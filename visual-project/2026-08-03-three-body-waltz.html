<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three-Body Waltz — Night 5</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #03040b;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="glow"></canvas>
<div id="caption">Three-Body Waltz &mdash; Night 5 &mdash; move to bend the pull, click to drop a comet through</div>
<script>
(() => {
  // A fifth technique after a noise-driven flow field, a Gray-Scott reaction,
  // physarum stigmergy, and a lit wave equation: this one is rigid-body
  // mechanics rather than a field or a swarm. Three massive bodies chase
  // each other under mutual Newtonian gravity (the classic three-body
  // problem, chaotic by nature and never repeating exactly), confined by a
  // gentle harmonic tether so the dance never ejects itself off-screen.
  // A cloud of massless stardust rides the field the three suns generate,
  // with no gravity of its own to give back — the same "test particle"
  // trick real orbital-mechanics sims use to render thousands of orbits
  // cheaply.
  const baseCanvas = document.getElementById('base');
  const glowCanvas = document.getElementById('glow');
  const baseCtx = baseCanvas.getContext('2d');
  const glowCtx = glowCanvas.getContext('2d');

  let W, H, DPR, cx, cy;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const c of [baseCanvas, glowCanvas]) {
      c.width = W * DPR;
      c.height = H * DPR;
    }
    baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glowCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
  }

  const EPS = 26;               // softening length, keeps close encounters finite
  const CONFINE_K = 0.000008;   // weak spring toward center — keeps the chaos on-screen
  let G = 0.085;                 // drifts slowly below

  function accelFrom(px, py, sources, excludeIdx) {
    let ax = 0, ay = 0;
    for (let i = 0; i < sources.length; i++) {
      if (i === excludeIdx) continue;
      const s = sources[i];
      const dx = s.x - px, dy = s.y - py;
      const r2 = dx * dx + dy * dy + EPS * EPS;
      const invr = 1 / Math.sqrt(r2);
      const invr3 = invr * invr * invr;
      const f = G * s.m * invr3;
      ax += f * dx;
      ay += f * dy;
    }
    return [ax, ay];
  }

  // --- the three suns: full mutual gravity, a bounded chaotic dance ---
  const HUES = [
    { r: 255, g: 207, b: 122 }, // warm gold
    { r: 122, g: 217, b: 255 }, // cool cyan
    { r: 201, g: 139, b: 255 }, // violet
  ];
  let suns = [];
  function initSuns() {
    suns = [];
    const R = Math.min(W, H) * 0.18;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + 0.4;
      const m = 340 + Math.random() * 90;
      suns.push({
        x: cx + Math.cos(a) * R,
        y: cy + Math.sin(a) * R,
        vx: -Math.sin(a) * 0.55 * (0.7 + Math.random() * 0.6),
        vy: Math.cos(a) * 0.55 * (0.7 + Math.random() * 0.6),
        m, hue: HUES[i],
      });
    }
  }

  // --- comets: transient visitors spawned by clicking ---
  let comets = [];
  function spawnComet(px, py) {
    const dx = px - cx, dy = py - cy;
    const d = Math.hypot(dx, dy) || 1;
    // tangential kick so it swings through rather than falling straight in
    const tx = -dy / d, ty = dx / d;
    const speed = 2.2 + Math.random() * 1.1;
    comets.push({
      x: px, y: py,
      vx: tx * speed * (Math.random() < 0.5 ? 1 : -1),
      vy: ty * speed * (Math.random() < 0.5 ? 1 : -1),
      m: 160,
      born: perfNow, life: 9000,
      hue: { r: 255, g: 255, b: 255 },
    });
  }

  function heaviesList() {
    return suns.concat(comets);
  }

  // --- stardust: massless test particles orbiting the suns' combined field ---
  const N_DUST = 950;
  let dustX, dustY, dustVX, dustVY, dustSpeed;
  function pickAnchor(heavies) {
    const totalM = heavies.reduce((s, h) => s + h.m, 0);
    let r = Math.random() * totalM;
    for (const h of heavies) {
      r -= h.m;
      if (r <= 0) return h;
    }
    return heavies[heavies.length - 1];
  }
  function respawnDust(i) {
    const heavies = suns; // anchor only to the permanent suns, not fleeting comets
    const anchor = pickAnchor(heavies);
    const r = 40 + Math.random() * (Math.min(W, H) * 0.32);
    const a = Math.random() * Math.PI * 2;
    const px = anchor.x + Math.cos(a) * r;
    const py = anchor.y + Math.sin(a) * r;
    const vCirc = Math.sqrt((G * anchor.m) / r) * (0.7 + Math.random() * 0.6);
    const dir = Math.random() < 0.85 ? 1 : -1; // mostly prograde, a rare retrograde straggler
    const vx = -Math.sin(a) * vCirc * dir;
    const vy = Math.cos(a) * vCirc * dir;
    dustX[i] = px; dustY[i] = py; dustVX[i] = vx; dustVY[i] = vy; dustSpeed[i] = vCirc;
  }
  function initDust() {
    dustX = new Float32Array(N_DUST);
    dustY = new Float32Array(N_DUST);
    dustVX = new Float32Array(N_DUST);
    dustVY = new Float32Array(N_DUST);
    dustSpeed = new Float32Array(N_DUST);
    for (let i = 0; i < N_DUST; i++) respawnDust(i);
  }

  // --- pointer: a phantom, weightless attractor while it moves ---
  const pointer = { x: -9999, y: -9999, active: false };
  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });
  window.addEventListener('pointerleave', () => (pointer.active = false));
  window.addEventListener('pointerdown', (e) => spawnComet(e.clientX, e.clientY));

  function speedColor(t) {
    // deep indigo (slow) -> cyan -> white-hot (fast, whipping past perihelion)
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    if (t < 0.5) {
      const u = t / 0.5;
      return [30 + u * 40, 40 + u * 140, 90 + u * 140];
    }
    const u = (t - 0.5) / 0.5;
    return [70 + u * 185, 180 + u * 75, 230 + u * 25];
  }

  let perfNow = 0;
  function step() {
    perfNow += 16.7;
    // G drifts over minutes: tighter, fast spirals vs looser, wide sweeps
    G = 0.085 + Math.sin(perfNow * 0.00006) * 0.028 + Math.sin(perfNow * 0.000037 + 1.3) * 0.013;

    // expire faded comets
    comets = comets.filter((c) => perfNow - c.born < c.life);

    const heavies = heaviesList();

    // mutual gravity among suns + comets, plus a weak center tether on suns
    const accs = heavies.map((h, idx) => {
      const [ax, ay] = accelFrom(h.x, h.y, heavies, idx);
      return [ax, ay];
    });
    for (let i = 0; i < suns.length; i++) {
      const s = suns[i];
      let [ax, ay] = accs[i];
      ax += -(s.x - cx) * CONFINE_K;
      ay += -(s.y - cy) * CONFINE_K;
      s.vx += ax; s.vy += ay;
      s.x += s.vx; s.y += s.vy;
    }
    for (let i = suns.length; i < heavies.length; i++) {
      const c = heavies[i];
      const [ax, ay] = accs[i];
      c.vx += ax; c.vy += ay;
      c.x += c.vx; c.y += c.vy;
    }

    // stardust: pulled only by the suns + comets, plus the phantom pointer
    const escapeR2 = Math.pow(Math.min(W, H) * 1.5, 2);
    for (let i = 0; i < N_DUST; i++) {
      let [ax, ay] = accelFrom(dustX[i], dustY[i], heavies, -1);
      if (pointer.active) {
        const dx = pointer.x - dustX[i], dy = pointer.y - dustY[i];
        const r2 = dx * dx + dy * dy + 900;
        const f = 6 / r2;
        ax += f * dx; ay += f * dy;
      }
      dustVX[i] += ax; dustVY[i] += ay;
      dustX[i] += dustVX[i]; dustY[i] += dustVY[i];
      dustSpeed[i] = Math.hypot(dustVX[i], dustVY[i]);

      const dx = dustX[i] - cx, dy = dustY[i] - cy;
      if (dx * dx + dy * dy > escapeR2) respawnDust(i);
    }
  }

  function render() {
    baseCtx.fillStyle = 'rgba(3, 4, 11, 0.16)';
    baseCtx.fillRect(0, 0, W, H);
    glowCtx.clearRect(0, 0, W, H);

    baseCtx.save();
    baseCtx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < N_DUST; i++) {
      const t = dustSpeed[i] / 6.5;
      const [r, g, b] = speedColor(t);
      const alpha = 0.35 + Math.min(0.55, t * 0.5);
      baseCtx.fillStyle = `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${alpha})`;
      baseCtx.fillRect(dustX[i], dustY[i], 1.4, 1.4);
    }
    baseCtx.restore();

    glowCtx.save();
    glowCtx.globalCompositeOperation = 'lighter';
    const heavies = heaviesList();
    for (const h of heavies) {
      const isComet = h.life !== undefined;
      let alpha = 1;
      if (isComet) {
        const age = perfNow - h.born;
        const fadeIn = Math.min(1, age / 600);
        const fadeOut = Math.min(1, (h.life - age) / 1500);
        alpha = Math.min(fadeIn, fadeOut);
      }
      const r = isComet ? 34 : 30 + h.m * 0.055;
      const { r: cr, g: cg, b: cb } = h.hue;
      const grad = glowCtx.createRadialGradient(h.x, h.y, 0, h.x, h.y, r * 3.2);
      grad.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, ${0.95 * alpha})`);
      grad.addColorStop(0.25, `rgba(${cr}, ${cg}, ${cb}, ${0.4 * alpha})`);
      grad.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
      glowCtx.fillStyle = grad;
      glowCtx.beginPath();
      glowCtx.arc(h.x, h.y, r * 3.2, 0, Math.PI * 2);
      glowCtx.fill();

      glowCtx.fillStyle = `rgba(255, 255, 255, ${0.9 * alpha})`;
      glowCtx.beginPath();
      glowCtx.arc(h.x, h.y, r * 0.32, 0, Math.PI * 2);
      glowCtx.fill();
    }
    glowCtx.restore();
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  function frame() {
    step();
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => { resize(); initSuns(); initDust(); comets = []; });
  resize();
  initSuns();
  initDust();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
