<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mean Free Hush — Night 41</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05050a;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Mean Free Hush &mdash; Night 41 &mdash; drag near the wall to slide the gap &middot; stir elsewhere &middot; click to strike a spark</div>
<script>
(() => {
  // A forty-first technique, and the first built on exact pairwise
  // hard-disk collision rather than a field, a lattice, a swarm rule, or a
  // continuum solver. Night 9's ink weather solved a real velocity field on
  // a fixed grid; night 21's borrowed weight was particles too, but smeared
  // into a continuous density by an SPH kernel, never actually touching;
  // night 34's lattice wake ran a lattice-gas automaton, particles confined
  // to a hexagonal lattice with a handful of discrete velocity directions.
  // This is closer to the thing kinetic theory was built to describe in the
  // first place — a few hundred hard disks with continuous position and
  // velocity, each frame's overlaps found through a uniform spatial grid
  // rebuilt from scratch, resolved with the same exact two-body elastic
  // impulse a billiards engine would use, mass drawn from disk area so
  // heavier bodies push back harder. A wall down the center splits the box
  // in two with a single gap in it. Every particle that reaches the left
  // outer wall is handed a fresh velocity sampled from a hot Gaussian, the
  // Maxwell–Boltzmann speed distribution a thermal reservoir imposes on
  // whatever touches it; every particle reaching the right wall gets the
  // same treatment from a colder distribution. Nothing forces the two
  // populations to mix — only the gap does that, one collision at a time —
  // so color, read straight off each disk's instantaneous speed from a red
  // hot to blue cold, shows the whole story: two separate temperatures on
  // either side, a violet, turbulent jet where they cross, and a texture
  // that never fully homogenizes because the reservoirs keep resupplying
  // the difference they're fighting to erase. A few heavier golden disks
  // ride inside the swarm doing nothing themselves, carrying no reservoir,
  // no purpose but to be shoved — their own fading paths, drawn as a faint
  // trailing line each keeps behind it, are exactly the random walk Einstein
  // derived from unseen molecular bombardment in 1905 and Perrin confirmed
  // by watching pollen grains through a microscope. Move the cursor near
  // the dividing wall and it takes hold of the gap, sliding it to wherever
  // the pointer sits; left near the wall's own oscillation, the gap drifts
  // on a slow sine instead. Away from the wall, the cursor stirs — every
  // disk nearby gets a gentle push outward, a private breeze. Click
  // anywhere to strike a spark: everything within reach of the click is
  // kicked to a sudden, shared high temperature and left to cool back into
  // the crowd on its own. Open the file directly in a browser.

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const caption = document.getElementById('caption');

  const N_GAS = 460;
  const N_TRACER = 3;
  const N = N_GAS + N_TRACER;
  const GAS_R = 2.3;
  const TRACER_R = 6.5;
  const SIGMA_HOT = 210;
  const SIGMA_COLD = 55;
  const TRAIL_LEN = 70;
  const DT = 1 / 60;

  let W, H, DPR;
  let left, right, top_, bottom, centerX, centerY;
  let gapHeight, gapY, autoGap = true, lastPointerMove = -1e9;

  const x = new Float32Array(N);
  const y = new Float32Array(N);
  const vx = new Float32Array(N);
  const vy = new Float32Array(N);
  const r = new Float32Array(N);
  const m = new Float32Array(N);

  const trailX = new Float32Array(N_TRACER * TRAIL_LEN);
  const trailY = new Float32Array(N_TRACER * TRAIL_LEN);
  let trailHead = new Int32Array(N_TRACER);
  let trailCount = new Int32Array(N_TRACER);

  let mouseX = -9999, mouseY = -9999, pointerDown = false;

  function gaussian(sigma) {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, W, H);

    const margin = Math.min(60, W * 0.06, H * 0.08);
    left = margin;
    right = W - margin;
    top_ = margin;
    bottom = H - margin;
    centerX = (left + right) / 2;
    centerY = (top_ + bottom) / 2;
    gapHeight = Math.max(70, (bottom - top_) * 0.16);
    gapY = centerY;

    for (let i = 0; i < N; i++) {
      if (x[i] < left + r[i]) x[i] = left + r[i];
      if (x[i] > right - r[i]) x[i] = right - r[i];
      if (y[i] < top_ + r[i]) y[i] = top_ + r[i];
      if (y[i] > bottom - r[i]) y[i] = bottom - r[i];
    }
  }

  function seed() {
    for (let i = 0; i < N_GAS; i++) {
      const hot = i < N_GAS / 2;
      x[i] = hot
        ? left + Math.random() * (centerX - left - 4)
        : centerX + Math.random() * (right - centerX - 4);
      y[i] = top_ + Math.random() * (bottom - top_);
      const sigma = hot ? SIGMA_HOT : SIGMA_COLD;
      vx[i] = gaussian(sigma);
      vy[i] = gaussian(sigma);
      r[i] = GAS_R;
      m[i] = r[i] * r[i];
    }
    for (let k = 0; k < N_TRACER; k++) {
      const i = N_GAS + k;
      x[i] = centerX + (k - (N_TRACER - 1) / 2) * 40;
      y[i] = centerY + (Math.random() - 0.5) * 60;
      vx[i] = 0;
      vy[i] = 0;
      r[i] = TRACER_R;
      m[i] = r[i] * r[i];
      trailHead[k] = 0;
      trailCount[k] = 0;
    }
  }

  // spatial grid, rebuilt every frame
  let cellSize = 16, cols = 1, rows = 1, grid = [];
  function rebuildGrid() {
    cellSize = Math.max(14, TRACER_R * 2 + 2);
    cols = Math.max(1, Math.ceil((right - left) / cellSize));
    rows = Math.max(1, Math.ceil((bottom - top_) / cellSize));
    const cells = cols * rows;
    if (grid.length !== cells) {
      grid = new Array(cells);
      for (let c = 0; c < cells; c++) grid[c] = [];
    } else {
      for (let c = 0; c < cells; c++) grid[c].length = 0;
    }
    for (let i = 0; i < N; i++) {
      let cx = Math.floor((x[i] - left) / cellSize);
      let cy = Math.floor((y[i] - top_) / cellSize);
      if (cx < 0) cx = 0; else if (cx >= cols) cx = cols - 1;
      if (cy < 0) cy = 0; else if (cy >= rows) cy = rows - 1;
      grid[cy * cols + cx].push(i);
    }
  }

  function resolvePair(i, j) {
    const dx = x[j] - x[i], dy = y[j] - y[i];
    let dist2 = dx * dx + dy * dy;
    const minDist = r[i] + r[j];
    if (dist2 >= minDist * minDist || dist2 === 0) return;
    const dist = Math.sqrt(dist2) || 0.01;
    const nx = dx / dist, ny = dy / dist;
    const overlap = minDist - dist;
    const totalMass = m[i] + m[j];
    x[i] -= nx * overlap * (m[j] / totalMass);
    y[i] -= ny * overlap * (m[j] / totalMass);
    x[j] += nx * overlap * (m[i] / totalMass);
    y[j] += ny * overlap * (m[i] / totalMass);

    const rvx = vx[j] - vx[i], rvy = vy[j] - vy[i];
    const velAlongNormal = rvx * nx + rvy * ny;
    if (velAlongNormal >= 0) return;
    const jImp = -2 * velAlongNormal / (1 / m[i] + 1 / m[j]);
    const jx = jImp * nx, jy = jImp * ny;
    vx[i] -= jx / m[i]; vy[i] -= jy / m[i];
    vx[j] += jx / m[j]; vy[j] += jy / m[j];
  }

  const NEIGHBOR_OFFSETS = [[1, 0], [0, 1], [1, 1], [-1, 1]];
  function collideAll() {
    for (let cy = 0; cy < rows; cy++) {
      for (let cx = 0; cx < cols; cx++) {
        const cell = grid[cy * cols + cx];
        for (let a = 0; a < cell.length; a++) {
          for (let b = a + 1; b < cell.length; b++) resolvePair(cell[a], cell[b]);
        }
        for (const [ox, oy] of NEIGHBOR_OFFSETS) {
          const nx_ = cx + ox, ny_ = cy + oy;
          if (nx_ < 0 || nx_ >= cols || ny_ < 0 || ny_ >= rows) continue;
          const neighbor = grid[ny_ * cols + nx_];
          for (let a = 0; a < cell.length; a++) {
            for (let b = 0; b < neighbor.length; b++) resolvePair(cell[a], neighbor[b]);
          }
        }
      }
    }
  }

  function walls(i) {
    const isTracer = i >= N_GAS;
    if (y[i] - r[i] < top_) { y[i] = top_ + r[i]; vy[i] = Math.abs(vy[i]); }
    if (y[i] + r[i] > bottom) { y[i] = bottom - r[i]; vy[i] = -Math.abs(vy[i]); }

    if (x[i] - r[i] < left) {
      x[i] = left + r[i];
      if (isTracer) { vx[i] = Math.abs(vx[i]); }
      else { vx[i] = Math.abs(gaussian(SIGMA_HOT)); vy[i] = gaussian(SIGMA_HOT); }
    }
    if (x[i] + r[i] > right) {
      x[i] = right - r[i];
      if (isTracer) { vx[i] = -Math.abs(vx[i]); }
      else { vx[i] = -Math.abs(gaussian(SIGMA_COLD)); vy[i] = gaussian(SIGMA_COLD); }
    }

    // the dividing wall, solid except through the gap
    if (Math.abs(x[i] - centerX) < r[i] + 1) {
      const inGap = y[i] > gapY - gapHeight / 2 + r[i] && y[i] < gapY + gapHeight / 2 - r[i];
      if (!inGap) {
        if (x[i] < centerX) { x[i] = centerX - r[i] - 1; vx[i] = -Math.abs(vx[i]); }
        else { x[i] = centerX + r[i] + 1; vx[i] = Math.abs(vx[i]); }
      }
    }
  }

  function stepAll(t) {
    if (autoGap) {
      gapY = centerY + Math.sin(t * 0.15) * (bottom - top_) * 0.22;
    }
    for (let i = 0; i < N; i++) {
      x[i] += vx[i] * DT;
      y[i] += vy[i] * DT;
    }
    rebuildGrid();
    collideAll();
    for (let i = 0; i < N; i++) walls(i);

    // cursor interaction: grab the gap, or stir the crowd
    const grabbing = Math.abs(mouseX - centerX) < 70 && mouseY > top_ && mouseY < bottom;
    if (grabbing) {
      autoGap = false;
      gapY = Math.max(top_ + gapHeight / 2 + 4, Math.min(bottom - gapHeight / 2 - 4, mouseY));
    } else if (mouseX > -9000) {
      const R = 95, R2 = R * R;
      for (let i = 0; i < N; i++) {
        const dx = x[i] - mouseX, dy = y[i] - mouseY;
        const d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 1) {
          const d = Math.sqrt(d2);
          const f = (1 - d / R) * 26;
          vx[i] += (dx / d) * f;
          vy[i] += (dy / d) * f;
        }
      }
    }
    if (t - lastPointerMove > 4.5) autoGap = true;

    for (let i = 0; i < N; i++) {
      const speed = Math.hypot(vx[i], vy[i]);
      const maxSpeed = i < N_GAS ? SIGMA_HOT * 5 : SIGMA_HOT * 3;
      if (speed > maxSpeed) {
        const s = maxSpeed / speed;
        vx[i] *= s; vy[i] *= s;
      }
    }

    for (let k = 0; k < N_TRACER; k++) {
      const i = N_GAS + k;
      const idx = k * TRAIL_LEN + trailHead[k];
      trailX[idx] = x[i]; trailY[idx] = y[i];
      trailHead[k] = (trailHead[k] + 1) % TRAIL_LEN;
      if (trailCount[k] < TRAIL_LEN) trailCount[k]++;
    }
  }

  const COLOR_LO = SIGMA_COLD;
  const COLOR_HI = SIGMA_HOT * 1.3;
  function speedToColor(speed) {
    const tnorm = Math.max(0, Math.min(1, (speed - COLOR_LO) / (COLOR_HI - COLOR_LO)));
    return 215 - 215 * tnorm;
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(4, 4, 9, 0.16)';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.strokeRect(left, top_, right - left, bottom - top_);
    ctx.beginPath();
    ctx.moveTo(centerX, top_);
    ctx.lineTo(centerX, gapY - gapHeight / 2);
    ctx.moveTo(centerX, gapY + gapHeight / 2);
    ctx.lineTo(centerX, bottom);
    ctx.stroke();

    for (let k = 0; k < N_TRACER; k++) {
      const count = trailCount[k];
      if (count < 2) continue;
      ctx.beginPath();
      for (let s = 0; s < count; s++) {
        const idx = k * TRAIL_LEN + ((trailHead[k] - count + s + TRAIL_LEN * 2) % TRAIL_LEN);
        const px = trailX[idx], py = trailY[idx];
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = 'rgba(255, 200, 110, 0.3)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < N_GAS; i++) {
      const speed = Math.hypot(vx[i], vy[i]);
      const hue = speedToColor(speed);
      ctx.beginPath();
      ctx.arc(x[i], y[i], r[i], 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 88%, 62%, 0.85)`;
      ctx.fill();
    }
    for (let k = 0; k < N_TRACER; k++) {
      const i = N_GAS + k;
      const glow = ctx.createRadialGradient(x[i], y[i], 0, x[i], y[i], r[i] * 3.2);
      glow.addColorStop(0, 'rgba(255, 214, 140, 0.55)');
      glow.addColorStop(1, 'rgba(255, 214, 140, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x[i], y[i], r[i] * 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x[i], y[i], r[i], 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 230, 190, 0.95)';
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function spark(px, py) {
    const R = 80, R2 = R * R;
    for (let i = 0; i < N; i++) {
      const dx = x[i] - px, dy = y[i] - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.max(6, Math.sqrt(d2));
        const kick = (1 - d / R) * SIGMA_HOT * 1.6;
        vx[i] += (dx / d) * kick + gaussian(30);
        vy[i] += (dy / d) * kick + gaussian(30);
      }
    }
  }

  window.addEventListener('pointermove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY; lastPointerMove = clock;
  });
  window.addEventListener('pointerleave', () => { mouseX = -9999; mouseY = -9999; });
  window.addEventListener('pointerdown', (e) => { pointerDown = true; spark(e.clientX, e.clientY); });
  window.addEventListener('pointerup', () => { pointerDown = false; });
  window.addEventListener('resize', resize);

  let start = null;
  let clock = 0;
  function frame(tms) {
    if (start === null) start = tms;
    clock = (tms - start) / 1000;
    stepAll(clock);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  seed();
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9500);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
