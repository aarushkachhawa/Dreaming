<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settling Glass</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#09080b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#efe3cf; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(0,0,0,0.8); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#cfc4b4; opacity:.55; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; text-shadow:0 0 6px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; heat the glass (right = hotter)&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; shatter into new pieces&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Settling glass. Seeds define a Voronoi mosaic. Each frame every seed moves toward the
// centroid of its own cell (Lloyd relaxation), so a random shattering slowly anneals into
// near-hexagonal, evenly sized panes. Heat from the cursor jostles the seeds and the
// mosaic cracks apart again, then re-settles. Each pane keeps its colour as it migrates.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let GW=0,GH=0,img=null,own=null;
let N=90, sx=[],sy=[],col=[],vx=[],vy=[];
let heat=0.0, paused=false, gen=1, t=0, energy=0;
function palette(i){
  const h=(i*47+gen*23+Math.random()*30)%360;
  return [h,55+Math.random()*25,38+Math.random()*24];
}
function hsl(h,s,l){
  s/=100;l/=100;const a=s*Math.min(l,1-l);
  const k=n=>{const q=(n+h/30)%12;return l-a*Math.max(-1,Math.min(q-3,9-q,1));};
  return [k(0)*255,k(8)*255,k(4)*255];
}
function shatter(){
  sx=[];sy=[];col=[];vx=[];vy=[];
  // cluster seeds in a few blast centres for an obviously uneven start
  const c=[];for(let k=0;k<4;k++)c.push([Math.random()*GW,Math.random()*GH]);
  for(let i=0;i<N;i++){
    const b=c[i%4], r=Math.pow(Math.random(),1.6)*Math.min(GW,GH)*0.5, a=Math.random()*6.283;
    sx.push(Math.min(GW-1,Math.max(0,b[0]+Math.cos(a)*r*1.4)));
    sy.push(Math.min(GH-1,Math.max(0,b[1]+Math.sin(a)*r)));
    col.push(palette(i)); vx.push(0); vy.push(0);
  }
  gen++;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  const asp=innerWidth/innerHeight;
  GH=150; GW=Math.round(GH*asp);
  off.width=GW; off.height=GH;
  img=octx.createImageData(GW,GH); own=new Int16Array(GW*GH);
  shatter();
}
function step(){
  // assign pixels to nearest seed
  const sumx=new Float64Array(N),sumy=new Float64Array(N),cnt=new Float64Array(N);
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      let best=1e18,bi=0;
      for(let i=0;i<N;i++){
        const dx=x-sx[i],dy=y-sy[i],d=dx*dx+dy*dy;
        if(d<best){best=d;bi=i;}
      }
      own[y*GW+x]=bi; sumx[bi]+=x; sumy[bi]+=y; cnt[bi]++;
    }
  }
  energy=0;
  const k=0.045, jit=heat*heat*1.6;
  for(let i=0;i<N;i++){
    if(cnt[i]>0){
      const cx=sumx[i]/cnt[i],cy=sumy[i]/cnt[i];
      energy+=Math.hypot(cx-sx[i],cy-sy[i]);
      vx[i]=vx[i]*0.8+(cx-sx[i])*k; vy[i]=vy[i]*0.8+(cy-sy[i])*k;
    }
    vx[i]+=(Math.random()-0.5)*jit; vy[i]+=(Math.random()-0.5)*jit;
    sx[i]=Math.min(GW-1,Math.max(0,sx[i]+vx[i]));
    sy[i]=Math.min(GH-1,Math.max(0,sy[i]+vy[i]));
  }
  energy/=N;
}
function paint(){
  const d=img.data;
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const p=y*GW+x, o=own[p];
      const dx=x-sx[o],dy=y-sy[o];
      const edge=(x<GW-1&&own[p+1]!==o)||(y<GH-1&&own[p+GW]!==o)||(x>0&&own[p-1]!==o)||(y>0&&own[p-GW]!==o);
      const c=col[o];
      // light pooling toward each pane's centre, like thick stained glass
      const r=Math.sqrt(dx*dx+dy*dy), glow=Math.max(0,1-r/16);
      const rgb=hsl(c[0],c[1],c[2]+glow*14+(Math.sin((x+y)*0.35+o)*1.5));
      const q=p*4;
      if(edge){d[q]=18;d[q+1]=14;d[q+2]=16;}
      else{d[q]=rgb[0];d[q+1]=rgb[1];d[q+2]=rgb[2];}
      d[q+3]=255;
    }
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,canvas.width,canvas.height);
  // faint vignette
  const g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,Math.min(canvas.width,canvas.height)*0.3,
    canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)*0.75);
  g.addColorStop(0,'rgba(9,8,11,0)'); g.addColorStop(1,'rgba(9,8,11,0.6)');
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);
}
function frame(){
  if(!paused){ t++; heat+=(target-heat)*0.05; step(); paint(); }
  hud.innerHTML='SETTLING GLASS<br>panes '+N+' &middot; unrest '+energy.toFixed(2)+'<br>shatter no. '+(gen-1);
  requestAnimationFrame(frame);
}
let target=0;
addEventListener('mousemove',e=>{target=Math.max(0,(e.clientX/innerWidth-0.15)/0.85);});
addEventListener('touchmove',e=>{target=e.touches[0].clientX/innerWidth;},{passive:true});
addEventListener('click',()=>{N=60+Math.floor(Math.random()*90);shatter();});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
