<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbiting Roots</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07080c; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; image-rendering:auto; }
  #hud { position:fixed; top:14px; left:16px; color:#e8e4da; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(140,200,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#5e6068; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; pull the first root toward the cursor&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; add or reshuffle roots&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Newton's method finds a root of a polynomial by repeatedly stepping z -> z - f(z)/f'(z).
// Every starting point in the plane falls into one root's basin, and the borders between
// basins are fractal: arbitrarily close to any border point, all the roots are present.
// Here the roots themselves slowly orbit, so the basins breathe, fold and tear.
// With roots r_k, f/f' = 1 / sum(1/(z-r_k)), so the step needs no polynomial expansion.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let W=0,H=0,img=null,nroots=4,tick=0,paused=false,pull=null,roots=[],orbit=[];
const MAXIT=28, SCALE=4;
function reshuffle(){
  orbit=[];
  for (let k=0;k<nroots;k++){
    orbit.push({r:0.45+Math.random()*0.75, w:(Math.random()<0.5?-1:1)*(0.003+Math.random()*0.006),
      a:Math.random()*6.283, ex:0.15+Math.random()*0.3, ew:0.002+Math.random()*0.004});
  }
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  W=Math.max(80,Math.round(canvas.width/SCALE/dpr*1.4)); H=Math.max(60,Math.round(canvas.height/SCALE/dpr*1.4));
  off.width=W; off.height=H; img=octx.createImageData(W,H);
}
function hsl(h,s,l){
  const a=s*Math.min(l,1-l), f=n=>{ const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1)); };
  return [f(0)*255,f(8)*255,f(4)*255];
}
function updateRoots(){
  roots=orbit.map((o,k)=>{
    o.a+=o.w;
    const rr=o.r*(1+o.ex*Math.sin(tick*o.ew+k));
    return [rr*Math.cos(o.a), rr*Math.sin(o.a)];
  });
  if (pull){ roots[0][0]+= (pull[0]-roots[0][0])*0.85; roots[0][1]+= (pull[1]-roots[0][1])*0.85; }
}
function render(){
  const n=roots.length, d=img.data;
  const cols=roots.map((_,k)=>hsl(((k/n)+0.58+tick*0.0002)%1,0.78,0.55));
  const aspect=W/H, span=1.9; // vertical half-extent
  let p=0;
  for (let j=0;j<H;j++){
    const y0=(j/H-0.5)*2*span;
    for (let i=0;i<W;i++){
      let x=(i/W-0.5)*2*span*aspect, y=y0, it=0, hit=-1;
      for (; it<MAXIT; it++){
        let sr=0, si=0;
        for (let k=0;k<n;k++){
          const dx=x-roots[k][0], dy=y-roots[k][1], q=dx*dx+dy*dy+1e-12;
          sr+=dx/q; si-=dy/q;
        }
        const m=sr*sr+si*si+1e-18;
        // step = 1/s = conj(s)/|s|^2
        const sx=sr/m, sy=-si/m;
        x-=sx; y-=sy;
        if (sx*sx+sy*sy<1e-7){ it++; break; }
      }
      let best=1e9;
      for (let k=0;k<n;k++){ const dx=x-roots[k][0], dy=y-roots[k][1], q=dx*dx+dy*dy; if (q<best){ best=q; hit=k; } }
      const c=cols[hit], v=best<1e-3? Math.pow(0.9,it)*1.15 : 0.04;
      d[p]=c[0]*v; d[p+1]=c[1]*v; d[p+2]=c[2]*v; d[p+3]=255; p+=4;
    }
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,canvas.width,canvas.height);
  // the roots, as small bright rings
  const sx=canvas.width/(2*span*aspect), sy=canvas.height/(2*span);
  ctx.lineWidth=Math.max(1.5,canvas.height/400);
  roots.forEach((r,k)=>{
    ctx.strokeStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(canvas.width/2+r[0]*sx, canvas.height/2+r[1]*sy, Math.max(4,canvas.height/120), 0, 6.2832); ctx.stroke();
  });
}
function frame(){
  if (!paused){ tick++; updateRoots(); render(); }
  hud.innerHTML='orbiting roots<br>polynomial degree '+nroots+'<br>newton steps per pixel, max '+MAXIT;
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{
  const aspect=innerWidth/innerHeight, span=1.9;
  pull=[(e.clientX/innerWidth-0.5)*2*span*aspect,(e.clientY/innerHeight-0.5)*2*span];
});
addEventListener('mouseleave',()=>{ pull=null; });
canvas.addEventListener('click',()=>{ nroots=3+((nroots-2)%5); reshuffle(); });
addEventListener('resize',setup);
addEventListener('keydown',e=>{ if (e.code==='Space'){ paused=!paused; e.preventDefault(); } });
reshuffle(); setup(); frame();
})();
</script>
</body>
</html>
