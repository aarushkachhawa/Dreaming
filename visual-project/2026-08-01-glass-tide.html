<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass Tide — Night 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #02040a;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="glow"></canvas>
<div id="caption">Glass Tide &mdash; Night 4 &mdash; drag to disturb the water, click to drop a stone</div>
<script>
(() => {
  // A fourth technique after a particle flow field, a Gray-Scott reaction, and
  // physarum stigmergy: this one is a linear wave equation solved on a grid,
  // lit like real water — a fixed moon casting a Blinn-Phong sheen and sharp
  // specular glints across the disturbed surface. The "stars" in this piece
  // are not drawn; they are glints the physics produces on its own, the same
  // impulse behind Night 1's starfield answered with an entirely different
  // mechanism.
  const baseCanvas = document.getElementById('base');
  const glowCanvas = document.getElementById('glow');
  const baseCtx = baseCanvas.getContext('2d');
  const glowCtx = glowCanvas.getContext('2d');

  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');

  let W, H, DPR, nx, ny;
  let h, v, edgeMask;
  let Xm1, Xp1, Ym1r, Yp1r;
  let img;

  function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
  function smooth(t) { return t * t * (3 - 2 * t); }

  function initGrid() {
    nx = 240;
    ny = Math.max(110, Math.min(180, Math.round(nx * (H / W))));
    off.width = nx;
    off.height = ny;
    img = offCtx.createImageData(nx, ny);

    const n = nx * ny;
    h = new Float32Array(n);
    v = new Float32Array(n);
    edgeMask = new Float32Array(n);

    // Reflect-free boundary: indices clamp at the edge rather than wrap, and
    // a soft absorbing ramp damps velocity near the border so ripples fade
    // into the frame instead of bouncing back or tiling like a torus.
    Xm1 = new Int32Array(nx);
    Xp1 = new Int32Array(nx);
    for (let x = 0; x < nx; x++) {
      Xm1[x] = Math.max(x - 1, 0);
      Xp1[x] = Math.min(x + 1, nx - 1);
    }
    Ym1r = new Int32Array(ny);
    Yp1r = new Int32Array(ny);
    for (let y = 0; y < ny; y++) {
      Ym1r[y] = Math.max(y - 1, 0) * nx;
      Yp1r[y] = Math.min(y + 1, ny - 1) * nx;
    }

    const ramp = 18;
    for (let y = 0; y < ny; y++) {
      for (let x = 0; x < nx; x++) {
        const d = Math.min(x, nx - 1 - x, y, ny - 1 - y);
        const t = smooth(clamp01(d / ramp));
        edgeMask[y * nx + x] = 0.18 + 0.82 * t;
      }
    }

    // Two independent random fields per axis, crossfaded over time below —
    // gives every cell its own uncorrelated twinkle with no repeating
    // lattice, unlike a product of a couple of low-frequency sine waves.
    noiseXA = new Float32Array(n); noiseXB = new Float32Array(n);
    noiseYA = new Float32Array(n); noiseYB = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      noiseXA[i] = Math.random() * 2 - 1;
      noiseXB[i] = Math.random() * 2 - 1;
      noiseYA[i] = Math.random() * 2 - 1;
      noiseYB[i] = Math.random() * 2 - 1;
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const c of [baseCanvas, glowCanvas]) {
      c.width = W * DPR;
      c.height = H * DPR;
    }
    baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glowCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initGrid();
  }

  // --- wave field: damped, mean-reverting so the pond always settles ---
  const C2 = 0.16;      // wave speed squared, kept under the CFL limit for stability
  const DAMPING = 0.05;
  const RESTORE = 0.006; // spring back to flat water — keeps splashes from leaving a lingering crater

  function stepWave() {
    for (let y = 0; y < ny; y++) {
      const ym1 = Ym1r[y], yp1 = Yp1r[y], row = y * nx;
      for (let x = 0; x < nx; x++) {
        const i = row + x;
        const lap = h[row + Xm1[x]] + h[row + Xp1[x]] + h[ym1 + x] + h[yp1 + x] - 4 * h[i];
        let vi = v[i] + C2 * lap - DAMPING * v[i] - RESTORE * h[i];
        v[i] = vi * edgeMask[i];
      }
    }
    for (let i = 0; i < h.length; i++) h[i] += v[i];
  }

  function addImpulse(gx, gy, strength, radius) {
    const x0 = Math.max(0, Math.floor(gx - radius));
    const x1 = Math.min(nx - 1, Math.ceil(gx + radius));
    const y0 = Math.max(0, Math.floor(gy - radius));
    const y1 = Math.min(ny - 1, Math.ceil(gy + radius));
    const r2 = radius * radius;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const dx = x - gx, dy = y - gy;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2 * 2.2) continue;
        const falloff = Math.exp(-d2 / (r2 * 0.6));
        v[y * nx + x] += strength * falloff;
      }
    }
  }

  // --- ambient rain: keeps the surface alive with no one at the keyboard ---
  let nextDrop = 40 + Math.random() * 60;
  function ambientRain() {
    nextDrop--;
    if (nextDrop > 0) return;
    nextDrop = 55 + Math.random() * 90;
    addImpulse(Math.random() * nx, Math.random() * ny, -(0.16 + Math.random() * 0.16), 2 + Math.random() * 1.5);
  }

  // --- lighting: a single moon, azimuth drifting slowly over minutes ---
  const deep = [3, 6, 15];
  const shallow = [7, 18, 34];
  const glint = [255, 240, 210];
  const NSCALE = 3.4;

  // Real water is never perfectly flat — a field of tiny, ever-shifting
  // capillary ripples is what actually produces a glitter path: only the
  // sparse patches whose micro-tilt happens to face the light catch it.
  // A calm patch with a mathematically exact zero gradient would instead
  // light up as one uniform gray sheet, which is what an early pass looked
  // like. Crossfading two independent random fields per axis stands in for
  // that texture — each cell twinkles on its own schedule, with no
  // periodic lattice the way a couple of sine waves multiplied together
  // would produce.
  const JITTER = 0.85;
  let noiseXA, noiseXB, noiseYA, noiseYB;

  function render(Lx, Ly, Lz, t) {
    // half-vector between light and a viewer looking straight down
    let hx = Lx, hy = Ly, hz = Lz + 1;
    const hl = Math.sqrt(hx * hx + hy * hy + hz * hz) || 1;
    hx /= hl; hy /= hl; hz /= hl;

    const wA = 0.5 + 0.5 * Math.sin(t * 0.021);
    const wB = 1 - wA;
    const wC = 0.5 + 0.5 * Math.sin(t * 0.026 + 2.1);
    const wD = 1 - wC;

    const data = img.data;
    for (let y = 0; y < ny; y++) {
      const ym1 = Ym1r[y], yp1 = Yp1r[y], row = y * nx;
      for (let x = 0; x < nx; x++) {
        const i = row + x;
        const dx = (h[row + Xp1[x]] - h[row + Xm1[x]]) * 0.5 * NSCALE
                  + (noiseXA[i] * wA + noiseXB[i] * wB) * JITTER;
        const dy = (h[yp1 + x] - h[ym1 + x]) * 0.5 * NSCALE
                  + (noiseYA[i] * wC + noiseYB[i] * wD) * JITTER;
        let nx_ = -dx, ny_ = -dy, nz_ = 1;
        const nl = Math.sqrt(nx_ * nx_ + ny_ * ny_ + nz_ * nz_);
        nx_ /= nl; ny_ /= nl; nz_ /= nl;

        const ndoth = Math.max(0, nx_ * hx + ny_ * hy + nz_ * hz);
        const soft = Math.pow(ndoth, 22);
        const sharp = Math.pow(ndoth, 220);
        const gl = soft * 0.4 + sharp * 4.5;
        const glTone = gl / (gl + 1.3);

        const tt = clamp01(h[i] * 2.2 + 0.5);
        const p = i * 4;
        let r = deep[0] + (shallow[0] - deep[0]) * tt + glint[0] * glTone;
        let g = deep[1] + (shallow[1] - deep[1]) * tt + glint[1] * glTone;
        let b = deep[2] + (shallow[2] - deep[2]) * tt + glint[2] * glTone;
        data[p] = r > 255 ? 255 : r;
        data[p + 1] = g > 255 ? 255 : g;
        data[p + 2] = b > 255 ? 255 : b;
        data[p + 3] = 255;
      }
    }
    offCtx.putImageData(img, 0, 0);

    baseCtx.imageSmoothingEnabled = true;
    baseCtx.imageSmoothingQuality = 'high';
    baseCtx.clearRect(0, 0, W, H);
    baseCtx.drawImage(off, 0, 0, nx, ny, 0, 0, W, H);

    glowCtx.clearRect(0, 0, W, H);
    glowCtx.save();
    glowCtx.filter = 'blur(10px)';
    glowCtx.globalCompositeOperation = 'lighter';
    glowCtx.globalAlpha = 0.55;
    glowCtx.drawImage(off, 0, 0, nx, ny, -16, -16, W + 32, H + 32);
    glowCtx.restore();
  }

  function drawMoon(moonX, moonY) {
    const r = Math.min(W, H) * 0.16;
    const grad = glowCtx.createRadialGradient(moonX, moonY, 0, moonX, moonY, r);
    grad.addColorStop(0, 'rgba(255, 248, 224, 0.9)');
    grad.addColorStop(0.35, 'rgba(255, 244, 214, 0.28)');
    grad.addColorStop(1, 'rgba(255, 244, 214, 0)');
    glowCtx.save();
    glowCtx.globalCompositeOperation = 'lighter';
    glowCtx.fillStyle = grad;
    glowCtx.beginPath();
    glowCtx.arc(moonX, moonY, r, 0, Math.PI * 2);
    glowCtx.fill();
    glowCtx.restore();
  }

  // --- cursor drags the surface, click drops a stone ---
  let mouse = { x: -9999, y: -9999, active: false, lastX: -9999, lastY: -9999 };
  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('pointerleave', () => (mouse.active = false));
  window.addEventListener('pointerdown', (e) => {
    const gx = (e.clientX / W) * nx;
    const gy = (e.clientY / H) * ny;
    addImpulse(gx, gy, -1.4, 4.5);
  });

  function dragDisturb() {
    if (!mouse.active) return;
    const speed = Math.hypot(mouse.x - mouse.lastX, mouse.y - mouse.lastY);
    mouse.lastX = mouse.x;
    mouse.lastY = mouse.y;
    if (speed < 1.5) return; // a resting cursor shouldn't keep pressing a hole in the water
    const gx = (mouse.x / W) * nx;
    const gy = (mouse.y / H) * ny;
    addImpulse(gx, gy, -Math.min(0.5, speed * 0.01), 3.2);
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let t = 0;
  function frame() {
    t += 1;
    // light drifts slowly across minutes, sliding the glitter path sideways
    // and cycling its texture between a broad sheen and needle-thin sparkle
    const azimuth = -0.55 + Math.sin(t * 0.00028) * 0.5;
    const elevation = 0.62 + Math.sin(t * 0.00019 + 1.7) * 0.12;
    const Lx = Math.cos(azimuth) * Math.cos(elevation);
    const Ly = Math.sin(azimuth) * Math.cos(elevation);
    const Lz = Math.sin(elevation);

    dragDisturb();
    ambientRain();
    stepWave();
    render(Lx, Ly, Lz, t);

    const moonX = W * (0.5 + 0.32 * Math.sin(azimuth));
    const moonY = H * (0.14 + 0.05 * (1 - elevation));
    drawMoon(moonX, moonY);

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
