<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mitotic Bloom — Night 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05030f;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="base"></canvas>
<canvas id="glow"></canvas>
<div id="caption">Mitotic Bloom &mdash; Night 2 &mdash; move to seed, click to bloom</div>
<script>
(() => {
  const baseCanvas = document.getElementById('base');
  const glowCanvas = document.getElementById('glow');
  const baseCtx = baseCanvas.getContext('2d');
  const glowCtx = glowCanvas.getContext('2d');

  // Offscreen low-res grid the simulation actually runs on; the visible
  // canvases just scale it up. Keeps a 28k-cell convolution cheap per frame.
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d');

  let W, H, DPR, nx, ny;
  let U, V, U2, V2;
  let Xm1, Xp1, Ym1, Yp1;
  let img;

  function initGrid() {
    nx = 200;
    ny = Math.max(70, Math.min(150, Math.round(nx * (H / W))));
    off.width = nx;
    off.height = ny;
    img = offCtx.createImageData(nx, ny);

    const n = nx * ny;
    U = new Float32Array(n).fill(1);
    V = new Float32Array(n).fill(0);
    U2 = new Float32Array(n);
    V2 = new Float32Array(n);

    Xm1 = new Int32Array(nx);
    Xp1 = new Int32Array(nx);
    for (let x = 0; x < nx; x++) {
      Xm1[x] = (x - 1 + nx) % nx;
      Xp1[x] = (x + 1) % nx;
    }
    Ym1 = new Int32Array(ny);
    Yp1 = new Int32Array(ny);
    for (let y = 0; y < ny; y++) {
      Ym1[y] = (y - 1 + ny) % ny;
      Yp1[y] = (y + 1) % ny;
    }

    for (let i = 0; i < 14; i++) {
      seedBlob(Math.floor(Math.random() * nx), Math.floor(Math.random() * ny), 8 + Math.random() * 4);
    }
  }

  function seedBlob(cx, cy, r) {
    r = Math.round(r);
    const r2 = r * r;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const x = ((cx + dx) % nx + nx) % nx;
        const y = ((cy + dy) % ny + ny) % ny;
        const i = y * nx + x;
        U[i] = 0.5;
        V[i] = 1.0;
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const c of [baseCanvas, glowCanvas]) {
      c.width = W * DPR;
      c.height = H * DPR;
    }
    baseCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    glowCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initGrid();
  }

  // --- Gray-Scott reaction-diffusion ---
  const Du = 0.2, Dv = 0.1;
  const feedBase = 0.039, killBase = 0.060; // branching/dividing region: cells split, never settle

  function step(feed, kill) {
    for (let y = 0; y < ny; y++) {
      const ym1 = Ym1[y] * nx, yp1 = Yp1[y] * nx, row = y * nx;
      for (let x = 0; x < nx; x++) {
        const xm1 = Xm1[x], xp1 = Xp1[x];
        const i = row + x;
        const u = U[i], v = V[i];

        const lapU =
          U[row + xm1] * 0.2 + U[row + xp1] * 0.2 +
          U[ym1 + x] * 0.2 + U[yp1 + x] * 0.2 +
          U[ym1 + xm1] * 0.05 + U[ym1 + xp1] * 0.05 +
          U[yp1 + xm1] * 0.05 + U[yp1 + xp1] * 0.05 - u;
        const lapV =
          V[row + xm1] * 0.2 + V[row + xp1] * 0.2 +
          V[ym1 + x] * 0.2 + V[yp1 + x] * 0.2 +
          V[ym1 + xm1] * 0.05 + V[ym1 + xp1] * 0.05 +
          V[yp1 + xm1] * 0.05 + V[yp1 + xp1] * 0.05 - v;

        const uvv = u * v * v;
        let nu = u + (Du * lapU - uvv + feed * (1 - u));
        let nv = v + (Dv * lapV + uvv - (feed + kill) * v);

        U2[i] = nu < 0 ? 0 : nu > 1 ? 1 : nu;
        V2[i] = nv < 0 ? 0 : nv > 1 ? 1 : nv;
      }
    }
    [U, U2] = [U2, U];
    [V, V2] = [V2, V];
  }

  // deep ink -> violet -> coral -> molten gold, driven by concentration
  const STOPS = [
    [0.00, 5, 3, 15],
    [0.16, 35, 10, 62],
    [0.36, 122, 22, 92],
    [0.56, 214, 58, 68],
    [0.78, 255, 142, 58],
    [1.00, 255, 236, 182],
  ];
  function paletteInto(rgb, t) {
    if (t <= 0) { rgb[0] = STOPS[0][1]; rgb[1] = STOPS[0][2]; rgb[2] = STOPS[0][3]; return; }
    if (t >= 1) { const s = STOPS[STOPS.length - 1]; rgb[0] = s[1]; rgb[1] = s[2]; rgb[2] = s[3]; return; }
    for (let k = 0; k < STOPS.length - 1; k++) {
      const a = STOPS[k], b = STOPS[k + 1];
      if (t >= a[0] && t <= b[0]) {
        const f = (t - a[0]) / (b[0] - a[0]);
        rgb[0] = a[1] + (b[1] - a[1]) * f;
        rgb[1] = a[2] + (b[2] - a[2]) * f;
        rgb[2] = a[3] + (b[3] - a[3]) * f;
        return;
      }
    }
  }

  const rgb = [0, 0, 0];
  function render() {
    const data = img.data;
    for (let i = 0, p = 0; i < V.length; i++, p += 4) {
      const t = V[i];
      paletteInto(rgb, t);
      data[p] = rgb[0];
      data[p + 1] = rgb[1];
      data[p + 2] = rgb[2];
      data[p + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);

    baseCtx.imageSmoothingEnabled = true;
    baseCtx.imageSmoothingQuality = 'high';
    baseCtx.drawImage(off, 0, 0, nx, ny, 0, 0, W, H);

    glowCtx.clearRect(0, 0, W, H);
    glowCtx.save();
    glowCtx.filter = 'blur(14px)';
    glowCtx.globalCompositeOperation = 'lighter';
    glowCtx.globalAlpha = 0.55;
    glowCtx.drawImage(off, 0, 0, nx, ny, -20, -20, W + 40, H + 40);
    glowCtx.restore();
  }

  // --- cursor stirs the chemical bath ---
  let mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener('pointermove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('pointerleave', () => (mouse.active = false));
  window.addEventListener('pointerdown', (e) => {
    const gx = Math.floor((e.clientX / W) * nx);
    const gy = Math.floor((e.clientY / H) * ny);
    seedBlob(gx, gy, 8);
  });

  function stir() {
    if (!mouse.active) return;
    const gx = Math.floor((mouse.x / W) * nx);
    const gy = Math.floor((mouse.y / H) * ny);
    const r = 2;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = ((gx + dx) % nx + nx) % nx;
        const y = ((gy + dy) % ny + ny) % ny;
        const i = y * nx + x;
        V[i] = Math.max(V[i], 0.85);
        U[i] = Math.min(U[i], 0.55);
      }
    }
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let frameCount = 0;
  let paramDrift = 0;

  function frame(now) {
    frameCount++;
    paramDrift += 1;
    // the chemistry itself drifts, not just its colors — slides between
    // mitosis-like division and calmer coral growth over minutes, so the
    // piece keeps changing shape long after the palette settles.
    const kill = killBase + Math.sin(paramDrift * 0.0007) * 0.0015;
    const feed = feedBase + Math.sin(paramDrift * 0.00041 + 1.7) * 0.0015;

    stir();
    for (let s = 0; s < 12; s++) step(feed, kill);
    render();

    if (frameCount % 240 === 0) {
      let sum = 0;
      for (let i = 0; i < V.length; i += 37) sum += V[i]; // sparse sample, cheap
      if (sum < 0.05) {
        for (let i = 0; i < 8; i++) {
          seedBlob(Math.floor(Math.random() * nx), Math.floor(Math.random() * ny), 8 + Math.random() * 4);
        }
      }
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
