<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doubling Cascade</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07050b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#f1e3d6; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(255,160,90,0.4); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#6a5a52; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; pick a growth rate r&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; reverse the dive&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// The logistic map x -> r x (1-x). For each r we iterate past the transient and
// pile up where the orbit lands. One fixed point splits into 2, 4, 8 ... faster and
// faster, converging on r = 3.5699456, beyond which chaos is threaded with windows
// of order. The view dives toward that limit; the picture repeats itself at every
// scale, shrunk by 4.669 sideways and 2.503 vertically, and nothing draws that.
const RINF = 3.5699456, DELTA = 4.6692016, ALPHA = 2.5029079;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
let W=0, H=0, hist, img, off, octx;
let t=0, dir=1, paused=false, mouseX=null;
let view = {r0:3, r1:4, y0:0, y1:1};
function resize(){
  canvas.width = innerWidth; canvas.height = innerHeight;
  W = Math.max(160, Math.floor(innerWidth/2)); H = Math.max(120, Math.floor(innerHeight/2));
  off = document.createElement('canvas'); off.width=W; off.height=H;
  octx = off.getContext('2d'); img = octx.createImageData(W,H);
  hist = new Float32Array(W*H);
}
function setView(){
  // s runs 0..1..0 as we dive in and climb back out; width falls geometrically
  const s = (1-Math.cos(t*0.045))/2;
  const w = 0.62*Math.exp(Math.log(0.0009/0.62)*s);
  const cx = RINF + 0.22*(w/0.62);
  const yh = 0.5*Math.min(1, Math.pow(w/0.62, Math.log(ALPHA)/Math.log(DELTA)))*1.05;
  view = {r0:cx-w*(W/H>1?1.15:1), r1:cx+w*(W/H>1?1.15:1), y0:0.5-yh, y1:0.5+yh};
}
function color(v,fr){
  // v in 0..1 brightness, fr in 0..1 across the window: violet -> amber -> pale gold
  const h = (265 + 130*fr) % 360, s=0.82, l = 0.08 + 0.6*v;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [255*f(0),255*f(8),255*f(4)];
}
function render(){
  hist.fill(0);
  const trans = 260, keep = 900, span = view.y1-view.y0;
  for (let c=0;c<W;c++){
    const r = view.r0 + (view.r1-view.r0)*c/(W-1);
    if (r>4) continue;
    let x = 0.3 + 0.4*((c*0.618)%1);
    for (let i=0;i<trans;i++) x = r*x*(1-x);
    for (let i=0;i<keep;i++){
      x = r*x*(1-x);
      const row = Math.floor((1-(x-view.y0)/span)*H);
      if (row>=0 && row<H) hist[row*W+c]++;
    }
  }
  const d = img.data;
  const gain = 6;
  for (let row=0;row<H;row++) for (let c=0;c<W;c++){
    const n = hist[row*W+c], o=(row*W+c)*4;
    const v = n>0 ? Math.min(1, Math.log(1+n*gain)/Math.log(1+keep*0.5*gain)+0.18) : 0;
    if (v===0){ d[o]=7+4*(row/H); d[o+1]=5; d[o+2]=11+6*(row/H); }
    else { const q=color(v,c/W); d[o]=q[0]; d[o+1]=q[1]; d[o+2]=q[2]; }
    d[o+3]=255;
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,innerWidth,innerHeight);
}
function period(r){
  let x=0.4; for (let i=0;i<4000;i++) x=r*x*(1-x);
  const x0=x;
  for (let p=1;p<=64;p++){ x=r*x*(1-x); if (Math.abs(x-x0)<1e-6) return p; }
  return 0;
}
function cobweb(r){
  const S=Math.min(220, innerWidth*0.3, innerHeight*0.38), px=innerWidth-S-18, py=innerHeight-S-18;
  ctx.save();
  ctx.fillStyle='rgba(7,5,11,0.78)'; ctx.fillRect(px-6,py-6,S+12,S+12);
  ctx.strokeStyle='rgba(255,226,200,0.18)'; ctx.strokeRect(px,py,S,S);
  const X=v=>px+v*S, Y=v=>py+S-v*S;
  ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(1),Y(1)); ctx.stroke();
  ctx.beginPath();
  for (let i=0;i<=80;i++){ const v=i/80; const y=r*v*(1-v); const yy=Math.min(1,y); i?ctx.lineTo(X(v),Y(yy)):ctx.moveTo(X(v),Y(yy)); }
  ctx.strokeStyle='rgba(255,170,100,0.7)'; ctx.stroke();
  let x=0.3; for (let i=0;i<300;i++) x=r*x*(1-x);
  ctx.beginPath(); ctx.moveTo(X(x),Y(0));
  for (let i=0;i<40;i++){ const y=r*x*(1-x); ctx.lineTo(X(x),Y(y)); ctx.lineTo(X(y),Y(y)); x=y; }
  ctx.strokeStyle='rgba(190,235,255,0.85)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
function frame(){
  if (!paused){ t += dir*0.016; setView(); render(); }
  if (!paused){
    if (mouseX!==null){
      const r = view.r0 + (view.r1-view.r0)*mouseX/innerWidth;
      ctx.fillStyle='rgba(255,240,225,0.35)'; ctx.fillRect(mouseX,0,1,innerHeight);
      if (r<=4 && r>=0){
        cobweb(r);
        const p=period(r);
        hud.innerHTML='doubling cascade<br>r '+r.toFixed(6)+'<br>'+(p?'cycle of '+p:'chaos or a very long cycle')+
          '<br>window width '+(view.r1-view.r0).toExponential(2)+
          '<br>'+(RINF-r>0&&RINF-r<(view.r1-view.r0)?'distance to r&infin; '+(RINF-r).toExponential(2):'');
      }
    } else {
      hud.innerHTML='doubling cascade<br>r from '+view.r0.toFixed(5)+' to '+view.r1.toFixed(5)+
        '<br>window width '+(view.r1-view.r0).toExponential(2)+'<br>limit of doubling r&infin; = '+RINF;
    }
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
addEventListener('mousemove', e=>{ mouseX=e.clientX; });
canvas.addEventListener('mouseleave', ()=>{ mouseX=null; });
canvas.addEventListener('click', ()=>{ dir=-dir; });
addEventListener('keydown', e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } });
resize(); frame();
})();
</script>
</body>
</html>
