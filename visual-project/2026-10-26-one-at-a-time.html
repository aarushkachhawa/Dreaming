<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One at a Time</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050508; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6e2f0; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(150,170,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#585668; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; widen or narrow the slits&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; watch which slit&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// The double-slit experiment, one particle at a time. Each particle lands at a single point on the
// screen, drawn from the probability  cos^2(pi d y / lz) * sinc^2(pi a y / lz)  — two slits of
// width a, separated by d. No single landing looks like anything; thousands together build fringes.
// Click to "watch which slit": the interference term vanishes and the fringes dissolve into two
// plain humps. Arrival rate ramps up and down, so the pattern can be watched forming slowly.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const YR=1.0; // half-height of the screen in model units
let W=0,H=0,t=0,paused=false,watch=false,count=0,mix=0,sep=0.5,target=0.5,hist=new Float32Array(400);
function sinc(x){ return Math.abs(x)<1e-6?1:Math.sin(x)/x; }
function pdf(y,s,m){ // m = 0 fringes, 1 which-path known
  const a=0.9, d=6+s*14, k=Math.PI;
  const env=sinc(k*a*y*0.5)**2;
  const fr=(1-m)*Math.cos(k*d*y*0.5)**2+m*0.5;
  return env*fr;
}
function sample(s,m){ // rejection sampling
  for (let i=0;i<500;i++){
    const y=(Math.random()*2-1)*YR*0.98;
    if (Math.random()<pdf(y,s,m)) return y;
  }
  return 0;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  reset();
}
function reset(){ ctx.fillStyle='#050508'; ctx.fillRect(0,0,W,H); count=0; hist.fill(0); }
function frame(){
  if (!paused){
    t+=1/60;
    mix+=((watch?1:0)-mix)*0.08;
    sep+=(target-sep)*0.05;
    // arrival rate breathes: slow trickle, then a burst
    const rate=Math.floor(2+60*Math.pow(0.5-0.5*Math.cos(t*0.35),2));
    const sx0=W*0.18, sx1=W*0.92, cy=H/2, S=H*0.44;
    ctx.globalCompositeOperation='lighter';
    for (let i=0;i<rate;i++){
      const y=sample(sep,mix>0.5?1:0);
      const px=sx1-Math.random()*Math.random()*W*0.05, py=cy+y*S;
      const bi=Math.min(399,Math.max(0,Math.floor((y/YR*0.5+0.5)*400))); hist[bi]++;
      const hue=210+60*Math.abs(y)/YR+(watch?40:0);
      ctx.fillStyle='hsla('+hue+',85%,62%,0.55)';
      ctx.beginPath(); ctx.arc(px,py,Math.max(0.7,H/900),0,6.2832); ctx.fill();
      count++;
    }
    ctx.globalCompositeOperation='source-over';
    // a few older dots dim so the screen never saturates to white
    if (count%7<3){ ctx.fillStyle='rgba(5,5,8,0.012)'; ctx.fillRect(sx1-W*0.06,0,W*0.1,H); }
    // beam, slits and a drifting trail of the latest particle's flight
    ctx.fillStyle='#050508'; ctx.fillRect(0,0,sx0+2,H);
    ctx.fillRect(sx0+3,0,sx1-sx0-W*0.07,H);
    const sl=sx0, a=H*0.012;
    ctx.fillStyle='#7a7890'; ctx.fillRect(sl-3,0,6,H);
    const gap=H*0.02+sep*H*0.06;
    ctx.fillStyle='#050508';
    ctx.fillRect(sl-4,cy-gap-a,8,a*2); ctx.fillRect(sl-4,cy+gap-a,8,a*2);
    ctx.fillStyle=watch?'#ffb86b':'#55546a';
    ctx.beginPath(); ctx.arc(sl-4,cy-gap,2.5,0,6.2832); ctx.arc(sl-4,cy+gap,2.5,0,6.2832); ctx.fill();
    // a faint ray from the gun through a random slit to the latest landing
    ctx.strokeStyle='rgba(160,180,255,0.05)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(W*0.02,cy); ctx.lineTo(sl,cy+(Math.random()<0.5?-gap:gap)); ctx.lineTo(sx1,cy+(Math.random()*2-1)*S*0.6); ctx.stroke();
    // live histogram along the left edge of the screen
    ctx.fillStyle='rgba(5,5,8,0.9)'; ctx.fillRect(sx1+W*0.015-2,0,W,H);
    let mxh=1; for (let i=0;i<400;i++) if (hist[i]>mxh) mxh=hist[i];
    ctx.strokeStyle='rgba(230,200,140,0.7)'; ctx.lineWidth=1.2; ctx.beginPath();
    for (let i=0;i<400;i++){
      const hy=cy+((i/400)*2-1)*S, hx=sx1+W*0.015+(hist[i]/mxh)*W*0.05;
      if (i===0) ctx.moveTo(hx,hy); else ctx.lineTo(hx,hy);
    }
    ctx.stroke();
  }
  hud.innerHTML='ONE AT A TIME<br>particles: '+count.toLocaleString()+'<br>slit spacing: '+(6+sep*14).toFixed(1)+'<br>which-path: '+(watch?'<span style="color:#ffb86b">watched</span>':'unwatched');
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{ const n=e.clientX/innerWidth; if (Math.abs(n-target)>0.01) { target=n; } });
addEventListener('touchmove',e=>{ target=e.touches[0].clientX/innerWidth; },{passive:true});
addEventListener('click',()=>{ watch=!watch; reset(); });
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
