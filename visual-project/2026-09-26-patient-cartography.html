<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patient Cartography — Night 52</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #06050a;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.32);
  }
  #readout {
    position: fixed;
    right: 24px;
    top: 20px;
    font: 300 12px/1.6 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.38);
    text-align: right;
    pointer-events: none;
    text-transform: uppercase;
  }
  #readout b {
    color: rgba(255, 255, 255, 0.72);
    font-weight: 400;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caption">Patient Cartography &mdash; Night 52 &mdash; move the cursor to tug a patch of the map toward you &middot; click to reshuffle what it's learning</div>
<div id="readout"></div>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var caption = document.getElementById('caption');
  var readout = document.getElementById('readout');

  var COLS = 48, ROWS = 30;
  var N = COLS * ROWS;
  var wx = new Float32Array(N);
  var wy = new Float32Array(N);
  var heat = new Float32Array(N);

  var LR = 0.05;
  var SAMPLES_PER_FRAME = 9;
  var GRID_DIAG = Math.sqrt(COLS * COLS + ROWS * ROWS);
  var SIGMA0 = GRID_DIAG * 0.34;
  var SIGMA_MIN = 0.6;
  var TAU = 5.5;

  function gauss() {
    var u = Math.random() || 1e-9, v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  var W = 0, H = 0, cx = 0, cy = 0, dpr = 1, R = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    W = Math.floor(window.innerWidth * dpr);
    H = Math.floor(window.innerHeight * dpr);
    canvas.width = W;
    canvas.height = H;
    cx = W / 2;
    cy = H / 2 - 8 * dpr;
    R = Math.min(W, H) * 0.30;
  }
  window.addEventListener('resize', resize);
  resize();

  var neuronsInit = false;
  function initNeurons() {
    for (var j = 0; j < ROWS; j++) {
      for (var i = 0; i < COLS; i++) {
        var idx = j * COLS + i;
        wx[idx] = cx + (Math.random() - 0.5) * 14 * dpr;
        wy[idx] = cy + (Math.random() - 0.5) * 14 * dpr;
        heat[idx] = 0;
      }
    }
    neuronsInit = true;
  }

  // six target distributions the map is asked, in turn, to cover. sample()
  // draws one point from the shape's density; t lets a few of them drift.
  var shapes = [
    {
      name: 'the ring',
      sample: function (t) {
        var a = Math.random() * Math.PI * 2 + t * 0.04;
        var rad = R * (0.82 + 0.14 * Math.random());
        return { x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.62 };
      }
    },
    {
      name: 'the disk',
      sample: function () {
        var a = Math.random() * Math.PI * 2;
        var rad = R * Math.sqrt(Math.random());
        return { x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.72 };
      }
    },
    {
      name: 'the rosette',
      sample: function (t) {
        var a = Math.random() * Math.PI * 2;
        var rr = R * (0.55 + 0.42 * Math.cos(5 * a + t * 0.1));
        var rad = rr * (0.9 + 0.1 * Math.random());
        return { x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad };
      }
    },
    {
      name: 'the lemniscate',
      sample: function () {
        var u = Math.random() * Math.PI * 2;
        var denom = 1 + Math.sin(u) * Math.sin(u);
        var x = R * 1.3 * Math.cos(u) / denom;
        var y = R * 0.85 * Math.sin(u) * Math.cos(u) / denom;
        return { x: cx + x + gauss() * R * 0.03, y: cy + y + gauss() * R * 0.03 };
      }
    },
    {
      name: 'two colonies',
      sample: function () {
        var side = Math.random() < 0.5 ? -1 : 1;
        return {
          x: cx + side * R * 0.45 + gauss() * R * 0.2,
          y: cy + gauss() * R * 0.2
        };
      }
    },
    {
      name: 'the spiral',
      sample: function (t) {
        var u = Math.random();
        var ang = u * Math.PI * 4 + t * 0.25;
        var rad = R * (0.12 + 0.88 * u);
        return {
          x: cx + Math.cos(ang) * rad + gauss() * R * 0.02,
          y: cy + Math.sin(ang) * rad * 0.85 + gauss() * R * 0.02
        };
      }
    }
  ];

  var currentShape = 0;
  var epochStart = 0;
  function nextShape() {
    if (shapes.length > 1) {
      var idx;
      do { idx = Math.floor(Math.random() * shapes.length); } while (idx === currentShape);
      currentShape = idx;
    }
    epochStart = now;
  }

  function currentSigma() {
    var dt = Math.max(0, now - epochStart);
    return SIGMA_MIN + (SIGMA0 - SIGMA_MIN) * Math.exp(-dt / TAU);
  }

  function trainSample(sx, sy, sigma) {
    var bi = -1, bj = -1, best = Infinity;
    for (var j = 0; j < ROWS; j++) {
      var rowBase = j * COLS;
      for (var i = 0; i < COLS; i++) {
        var idx = rowBase + i;
        var dx = wx[idx] - sx, dy = wy[idx] - sy;
        var d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; bi = i; bj = j; }
      }
    }
    var reach = Math.max(1, Math.ceil(3 * sigma));
    var i0 = Math.max(0, bi - reach), i1 = Math.min(COLS - 1, bi + reach);
    var j0 = Math.max(0, bj - reach), j1 = Math.min(ROWS - 1, bj + reach);
    var twoSig2 = 2 * sigma * sigma;
    var reach2 = reach * reach;
    for (var jj = j0; jj <= j1; jj++) {
      for (var ii = i0; ii <= i1; ii++) {
        var dgi = ii - bi, dgj = jj - bj;
        var dg2 = dgi * dgi + dgj * dgj;
        if (dg2 > reach2) continue;
        var infl = Math.exp(-dg2 / twoSig2);
        var idx = jj * COLS + ii;
        wx[idx] += LR * infl * (sx - wx[idx]);
        wy[idx] += LR * infl * (sy - wy[idx]);
        heat[idx] = Math.min(1, heat[idx] + infl * 0.85);
      }
    }
  }

  var pointerX = 0, pointerY = 0, lastMoveAt = -10;
  var idleSince = 0, now = 0;

  function wake() {
    idleSince = now;
    caption.classList.add('visible');
  }

  canvas.addEventListener('pointerdown', function (e) {
    wake();
    nextShape();
  });

  window.addEventListener('pointermove', function (e) {
    var r = canvas.getBoundingClientRect();
    pointerX = (e.clientX - r.left) * dpr;
    pointerY = (e.clientY - r.top) * dpr;
    lastMoveAt = now;
    wake();
  });

  var start = performance.now();

  function frame(tms) {
    now = (tms - start) / 1000;

    if (!neuronsInit) initNeurons();
    if (now - epochStart > 24) nextShape();
    if (now - idleSince > 6.0) caption.classList.remove('visible');

    var sigma = currentSigma();
    var cursorLive = (now - lastMoveAt) < 4.0;

    for (var s = 0; s < SAMPLES_PER_FRAME; s++) {
      var p;
      if (cursorLive && Math.random() < 0.35) {
        p = { x: pointerX + gauss() * R * 0.05, y: pointerY + gauss() * R * 0.05 };
      } else {
        p = shapes[currentShape].sample(now);
      }
      trainSample(p.x, p.y, sigma);
    }

    for (var k = 0; k < N; k++) heat[k] *= 0.90;

    ctx.fillStyle = 'rgba(6, 5, 10, 0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(150, 180, 255, 0.10)';
    ctx.lineWidth = 1 * dpr;
    for (var j = 0; j < ROWS; j++) {
      ctx.beginPath();
      for (var i = 0; i < COLS; i++) {
        var idx = j * COLS + i;
        if (i === 0) ctx.moveTo(wx[idx], wy[idx]); else ctx.lineTo(wx[idx], wy[idx]);
      }
      ctx.stroke();
    }
    for (var i2 = 0; i2 < COLS; i2++) {
      ctx.beginPath();
      for (var j2 = 0; j2 < ROWS; j2++) {
        var idx2 = j2 * COLS + i2;
        if (j2 === 0) ctx.moveTo(wx[idx2], wy[idx2]); else ctx.lineTo(wx[idx2], wy[idx2]);
      }
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';
    for (var h = 0; h < N; h++) {
      if (heat[h] < 0.05) continue;
      var g = heat[h];
      var cr = Math.round(120 + 135 * g), cg = Math.round(150 + 60 * g), cb = Math.round(255 - 130 * g);
      ctx.beginPath();
      ctx.arc(wx[h], wy[h], (1.4 + 2.6 * g) * dpr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + cr + ',' + cg + ',' + cb + ',' + (0.25 + 0.6 * g).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    readout.innerHTML = 'target <b>' + shapes[currentShape].name + '</b> &nbsp; &sigma; <b>' + sigma.toFixed(2) + '</b>';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
