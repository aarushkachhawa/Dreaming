<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin Skin</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050508; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6e2f0; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(150,170,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#585668; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; stir the film&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; change how it is held&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// A soap film seen by reflected light. The colour of a film depends only on its thickness:
// light bouncing off the front and back surfaces interferes, and each wavelength is
// strengthened or cancelled as the thickness changes. Here the thickness is a slow drainage
// gradient (heavier at the bottom) plus drifting waves and a few vortices; every pixel is
// turned into colour by evaluating the interference of red, green and blue separately.
// Where the film grows thin enough it goes black, just before it breaks.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const MODES=['ring','vertical','bubble','wand'];
const LAM=[650,550,450]; // nm
let W=0,H=0,iw=0,ih=0,img=null,off=null,octx=null;
let mi=0,t=0,paused=false,mouse=null,lastMove=-99,sx=0,sy=0,stir=[];
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  const sc=Math.max(3,Math.round(Math.max(W,H)/320));
  iw=Math.ceil(W/sc); ih=Math.ceil(H/sc);
  off=document.createElement('canvas'); off.width=iw; off.height=ih; octx=off.getContext('2d');
  img=octx.createImageData(iw,ih);
}
function stirrer(){
  if (mouse && t-lastMove<5) return [mouse.x/innerWidth, mouse.y/innerHeight];
  return [0.5+0.3*Math.sin(t*0.21), 0.5+0.25*Math.sin(t*0.17+1.3)];
}
function frame(){
  if (!paused) t+=1/60;
  const s=stirrer(); sx+=(s[0]-sx)*0.07; sy+=(s[1]-sy)*0.07;
  // trail of stirring points that decay
  if (!paused && (frameN++%4===0)){ stir.push([sx,sy,t]); if (stir.length>14) stir.shift(); }
  const d=img.data, asp=iw/ih, m=MODES[mi];
  let k=0, minH=1e9;
  for (let j=0;j<ih;j++){
    const v=j/ih;
    for (let i=0;i<iw;i++){
      const u=i/iw, x=(u-0.5)*asp, y=v-0.5;
      // base thickness in nm: drainage thins the top
      let h;
      if (m==='vertical') h=60+520*v*v+160*v;
      else if (m==='ring'){ const r=Math.hypot(x,y); h=80+900*r*r; }
      else if (m==='bubble'){ const r=Math.hypot(x,y); h=60+260*(0.5+0.5*y/0.5)*Math.min(1,r*2.2)+260*r; }
      else { h=70+420*Math.abs(y+0.15*Math.sin(x*3+t*0.2))+120*(0.5+0.5*Math.sin(x*2)); }
      // drifting waves
      h+=30*Math.sin(x*7+y*4+t*0.5)+22*Math.sin(-x*5+y*9-t*0.37)+10*Math.sin(x*21+y*17+t*0.9);
      // a slowly turning marangoni swirl
      const sw=Math.sin(x*3*Math.cos(t*0.05)+y*3*Math.sin(t*0.05)+Math.hypot(x,y)*9-t*0.45);
      h+=45*sw*Math.exp(-Math.hypot(x,y)*2.4);
      // stirring ripples
      for (let q=0;q<stir.length;q++){
        const p=stir[q], age=t-p[2], dx=u-p[0], dy=(v-p[1])/asp*1, r=Math.hypot(dx*asp,(v-p[1]));
        h+=70*Math.exp(-age*0.4)*Math.cos(r*60-age*4)*Math.exp(-r*5);
      }
      if (h<minH) minH=h;
      if (h<0) h=0;
      // thin-film reflectance: 2 n h cos(theta) with a half-wave phase flip at the front surface
      let o=0;
      for (let c=0;c<3;c++){
        const ph=2*Math.PI*2*1.33*h/LAM[c], iv=Math.sin(ph-Math.PI*0.5);
        const e=0.5+(iv*iv-0.5)*Math.exp(-h/1100);
        d[k+c]=Math.min(255,255*Math.pow(e,0.85)*(0.25+0.75*Math.min(1,h/90)));
      }
      d[k+3]=255; k+=4;
    }
  }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,W,H);
  // vignette so the film seems to hang in the dark
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(5,5,8,0)'); g.addColorStop(1,'rgba(5,5,8,0.88)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  hud.innerHTML='THIN SKIN<br>held as: '+m+'<br>thinnest point: '+Math.max(0,Math.round(minH))+' nm';
  requestAnimationFrame(frame);
}
let frameN=0;
addEventListener('mousemove',e=>{mouse={x:e.clientX,y:e.clientY};lastMove=t;});
addEventListener('touchmove',e=>{const p=e.touches[0];mouse={x:p.clientX,y:p.clientY};lastMove=t;},{passive:true});
addEventListener('click',()=>{mi=(mi+1)%MODES.length;});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
