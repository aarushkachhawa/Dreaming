<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Carpet</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07050a; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6d6c4; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(240,140,60,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#65584c; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; choose where the next particle starts&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; release it&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Quantum carpet. A particle in a one-dimensional box starts as a narrow packet. Each energy
// level n turns at its own rate n^2, so the packet smears across the box, then the phases
// realign: at fractions of the revival time it splits into 2, 3, 4... copies, and at the full
// period it is whole again. Space runs across, time runs down; brightness is probability.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const COLS=520, ROWS=420, NM=64, TAU=2*Math.PI;
const off=document.createElement('canvas'); off.width=COLS; off.height=ROWS;
const octx=off.getContext('2d'); const img=octx.createImageData(COLS,ROWS);
const px=new Uint32Array(img.data.buffer);
const S=[]; // S[n][col] = sin(n*pi*x)
for (let n=1;n<=NM;n++){ const r=new Float32Array(COLS);
  for (let c=0;c<COLS;c++) r[c]=Math.sin(n*Math.PI*(c+0.5)/COLS)*Math.SQRT2; S.push(r); }
const A=new Float64Array(NM), B=new Float64Array(NM), cs=new Float64Array(NM), sn=new Float64Array(NM);
let tau=0, speed=0.004, paused=false, mouse=null, startX=0.5, x0=0.5, k0=0, wid=0.012, rowsDone=0, label='';
function launch(x,k,w){
  x0=x;k0=k;wid=w;tau=0;rowsDone=0;
  A.fill(0);B.fill(0);
  const M=2000;
  for (let n=1;n<=NM;n++){
    let a=0,b=0;
    for (let i=0;i<M;i++){
      const u=(i+0.5)/M, g=Math.exp(-((u-x0)*(u-x0))/(4*w*w)), s=Math.sin(n*Math.PI*u)*Math.SQRT2;
      a+=g*Math.cos(k*u)*s; b+=g*Math.sin(k*u)*s;
    }
    A[n-1]=a/M; B[n-1]=b/M;
  }
  // normalise
  let tot=0; for (let i=0;i<NM;i++) tot+=A[i]*A[i]+B[i]*B[i];
  const f=1/Math.sqrt(tot); for (let i=0;i<NM;i++){A[i]*=f;B[i]*=f;}
  label=k===0?'at rest':'moving';
  px.fill(0xff0a0507);
}
const pal=new Uint32Array(256);
(function(){ // black-violet -> plum -> ember -> amber -> pale gold
  const st=[[0,7,5,10],[0.18,40,12,62],[0.42,128,28,70],[0.68,238,110,28],[0.88,255,196,92],[1,255,246,214]];
  for (let i=0;i<256;i++){ const v=i/255; let j=0; while (j<st.length-2&&v>st[j+1][0]) j++;
    const a=st[j],b=st[j+1],u=(v-a[0])/(b[0]-a[0]);
    const r=a[1]+(b[1]-a[1])*u,g=a[2]+(b[2]-a[2])*u,bl=a[3]+(b[3]-a[3])*u;
    pal[i]=(255<<24)|(bl<<16)|(g<<8)|r; }
})();
function addRow(){
  const SUB=4, acc=new Float32Array(COLS);
  for (let q=0;q<SUB;q++){
    const t=tau+speed*q/SUB;
    for (let n=1;n<=NM;n++){ const ph=n*n*t; cs[n-1]=Math.cos(ph); sn[n-1]=Math.sin(ph); }
    for (let c=0;c<COLS;c++){
      let re=0,im=0;
      for (let n=0;n<NM;n++){ const s=S[n][c]; re+=s*(A[n]*cs[n]+B[n]*sn[n]); im+=s*(B[n]*cs[n]-A[n]*sn[n]); }
      acc[c]+=(re*re+im*im)/SUB;
    }
  }
  px.copyWithin(0,COLS); // scroll up one row
  const base=(ROWS-1)*COLS;
  for (let c=0;c<COLS;c++){
    const v=1-Math.exp(-acc[c]*0.9); // 1 = uniform density
    px[base+c]=pal[Math.min(255,(Math.pow(v,0.8)*255)|0)];
  }
  tau+=speed; rowsDone++;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
}
function frame(){
  if (!paused){ for (let r=0;r<2;r++) addRow(); }
  octx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(off,0,0,canvas.width,canvas.height);
  // marker for the chosen start point
  if (mouse){ const mxp=mouse.x/innerWidth*canvas.width;
    ctx.fillStyle='rgba(255,220,170,0.5)'; ctx.fillRect(mxp-1,canvas.height-14,2,14); }
  const frac=(tau/TAU)%1;
  hud.innerHTML='QUANTUM CARPET<br>particle in a box, '+label+'<br>time: '+(tau/TAU).toFixed(2)+' of a revival'
    +(Math.abs(frac-0.5)<0.01?'<br>half revival: shifted copy':Math.abs(frac)<0.01||frac>0.99?'<br>revival: whole again':'');
  requestAnimationFrame(frame);
}
function pos(e){ const p=e.touches?e.touches[0]:e; mouse={x:p.clientX,y:p.clientY}; startX=Math.min(0.95,Math.max(0.05,p.clientX/innerWidth)); }
addEventListener('mousemove',pos);
addEventListener('touchmove',pos,{passive:true});
addEventListener('click',e=>{
  pos(e);
  const moving=Math.random()<0.5;
  launch(startX, moving?(Math.random()<0.5?-1:1)*(30+Math.random()*70):0, 0.014+Math.random()*0.02);
});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup(); launch(0.5,0,0.016); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
