<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines of Force</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05060b; height:100%; width:100%; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #fg { cursor:none; }
  #hud { position:fixed; top:14px; left:16px; color:#e8e2d6; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(0,0,0,0.85); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; right:16px; color:#d2cbbf; opacity:.55; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; text-shadow:0 0 6px #000; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<div id="hud"></div>
<div id="hint">move the cursor &mdash; carry a charge through the field&nbsp;&nbsp;|&nbsp;&nbsp;F &mdash; flip its sign (or switch it off)&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; scatter new charges&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Lines of force. A handful of point charges drift slowly across a dark plane. From every positive charge a
// fan of field lines is launched, evenly spaced in angle, and each is integrated step by step along the
// electric field until it is swallowed by a negative charge or wanders off into the dark. The field is the
// two-dimensional one (E ~ q r / |r|^2), so the number of lines leaving a charge is exactly proportional to its
// charge and every line that arrives somewhere is accounted for. Behind the lines the electric potential is
// shaded faintly, warm near positive charge and cool near negative, with thin equipotential contours that
// cross every field line at a right angle. Sparks travel along the lines in the direction of the field.
const bg=document.getElementById('bg'), bctx=bg.getContext('2d');
const fg=document.getElementById('fg'), ctx=fg.getContext('2d');
const hud=document.getElementById('hud');
const LPU=12;                 // field lines per unit charge
let W=0,H=0,DPR=1,charges=[],paused=false,t=0,arrangements=0;
let mouse={x:-1e4,y:-1e4,on:false}, cursorQ=1, cursorMode=0; // 0:+  1:-  2:off
const SCALE=4; let pw=0,ph=0,pimg=null,pc=null,pctx=null;

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  for(const c of [bg,fg]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  pw=Math.ceil(W/SCALE); ph=Math.ceil(H/SCALE);
  pc=document.createElement('canvas'); pc.width=pw; pc.height=ph; pctx=pc.getContext('2d');
  pimg=pctx.createImageData(pw,ph);
}

function rnd(a,b){ return a+Math.random()*(b-a); }
function scatter(){
  arrangements++;
  const n=3+Math.floor(Math.random()*4);
  charges=[];
  let net=0;
  for(let i=0;i<n;i++){
    let q=(Math.random()<0.5?1:2)*(i%2===0?1:-1);
    if(i===n-1 && Math.abs(net+q)>2) q=-q;
    net+=q;
    const m=Math.min(W,H);
    charges.push({
      q, cx:rnd(0.25,0.75)*W, cy:rnd(0.25,0.75)*H,
      ax:rnd(0.08,0.22)*m, ay:rnd(0.08,0.22)*m,
      fx:rnd(0.04,0.11)*(Math.random()<0.5?-1:1), fy:rnd(0.04,0.11)*(Math.random()<0.5?-1:1),
      px:rnd(0,6.283), py:rnd(0,6.283), spin:rnd(-0.15,0.15), x:0, y:0
    });
  }
  place();
}
function place(){
  for(const c of charges){
    c.x=c.cx+c.ax*Math.sin(c.fx*t+c.px);
    c.y=c.cy+c.ay*Math.sin(c.fy*t+c.py);
  }
}
function allCharges(){
  const a=charges.slice();
  if(mouse.on && cursorMode!==2) a.push({q:cursorMode===0?1:-1,x:mouse.x,y:mouse.y,spin:0.3,cursor:true});
  return a;
}

// field at (x,y): E = sum q (r)/|r|^2
function field(cs,x,y){
  let ex=0,ey=0;
  for(let i=0;i<cs.length;i++){
    const c=cs[i], dx=x-c.x, dy=y-c.y, r2=dx*dx+dy*dy+1e-6;
    ex+=c.q*dx/r2; ey+=c.q*dy/r2;
  }
  return [ex,ey];
}

// trace one line, dir=+1 along E, -1 against. Returns {pts, end} where end is the charge it hit or null.
function trace(cs,src,ang,dir){
  const R0=7;
  let x=src.x+Math.cos(ang)*R0, y=src.y+Math.sin(ang)*R0;
  const pts=[src.x,src.y,x,y];
  const margin=Math.max(W,H)*0.6;
  for(let s=0;s<1400;s++){
    // nearest charge distance for adaptive step and capture
    let dmin=1e9, hit=null;
    for(let i=0;i<cs.length;i++){
      const c=cs[i]; if(c===src && s<3) continue;
      const d=Math.hypot(x-c.x,y-c.y);
      if(d<dmin){ dmin=d; hit=c; }
    }
    if(dmin<R0 && hit!==src && Math.sign(hit.q)===-dir){
      pts.push(hit.x,hit.y); return {pts,end:hit};
    }
    const h=Math.max(1.2,Math.min(7,dmin*0.25));
    let [ex,ey]=field(cs,x,y); let m=Math.hypot(ex,ey)||1;
    const mx=x+dir*ex/m*h*0.5, my=y+dir*ey/m*h*0.5;
    [ex,ey]=field(cs,mx,my); m=Math.hypot(ex,ey)||1;
    x+=dir*ex/m*h; y+=dir*ey/m*h;
    pts.push(x,y);
    if(x<-margin||x>W+margin||y<-margin||y>H+margin) break;
  }
  return {pts,end:null};
}

const POS=[255,176,92], NEG=[96,170,255];
function mix(a,b,f){ return [a[0]+(b[0]-a[0])*f|0,a[1]+(b[1]-a[1])*f|0,a[2]+(b[2]-a[2])*f|0]; }
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }

let pv=null;
function drawPotential(cs){
  const d=pimg.data;
  if(!pv||pv.length!==pw*ph) pv=new Float32Array(pw*ph);
  // two-dimensional potential V = -sum q ln r, with its zero set at the average over the screen
  let j=0,mean=0;
  for(let py=0;py<ph;py++){
    const y=py*SCALE+SCALE*0.5;
    for(let px=0;px<pw;px++){
      const x=px*SCALE+SCALE*0.5;
      let v=0;
      for(let k=0;k<cs.length;k++){
        const c=cs[k], dx=x-c.x, dy=y-c.y;
        v-=c.q*0.5*Math.log(dx*dx+dy*dy+40);
      }
      pv[j++]=v; mean+=v;
    }
  }
  mean/=pv.length;
  let i=0;
  for(j=0;j<pv.length;j++){
    const v=pv[j]-mean, s=Math.tanh(v*0.35);
    // equipotential contours
    const band=v*1.4, f=band-Math.floor(band), line=Math.exp(-Math.pow(Math.min(f,1-f)*9,2));
    let r,g,b;
    if(s>0){ r=POS[0]*s; g=POS[1]*s*0.6; b=POS[2]*s*0.35; }
    else { r=NEG[0]*-s*0.35; g=NEG[1]*-s*0.6; b=NEG[2]*-s; }
    const k=0.12+0.22*line;
    d[i++]=8+r*k+line*8; d[i++]=8+g*k+line*8; d[i++]=14+b*k+line*12; d[i++]=255;
  }
  pctx.putImageData(pimg,0,0);
  bctx.setTransform(DPR,0,0,DPR,0,0);
  bctx.imageSmoothingEnabled=true; bctx.imageSmoothingQuality='high';
  bctx.drawImage(pc,0,0,pw*SCALE,ph*SCALE);
  // vignette
  const g=bctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.hypot(W,H)*0.6);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.6)');
  bctx.fillStyle=g; bctx.fillRect(0,0,W,H);
}

function strokePath(pts){
  ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
}

let lineCount=0, captured=0, escaped=0;
function frame(){
  if(!paused){ t+=1/60; place(); }
  const cs=allCharges();
  drawPotential(cs);
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.globalCompositeOperation='lighter';
  lineCount=0; captured=0; escaped=0;
  const lines=[];
  // launch from positives along E; launch from negatives against E, keeping only lines that escape
  for(const c of cs){
    const n=Math.round(Math.abs(c.q)*LPU);
    const dir=c.q>0?1:-1;
    const off=(c.spin||0)*t;
    for(let k=0;k<n;k++){
      const ang=off+(k+0.5)/n*Math.PI*2;
      const L=trace(cs,c,ang,dir);
      if(dir<0 && L.end) continue; // already drawn from its positive end
      lines.push({L,src:c,dir});
    }
  }
  for(const {L,src,dir} of lines){
    const p=L.pts, np=p.length/2; if(np<3) continue;
    lineCount++; if(L.end) captured++; else escaped++;
    const sx=p[0],sy=p[1],exn=p[p.length-2],eyn=p[p.length-1];
    const startCol=dir>0?POS:NEG;
    const endCol=L.end?(dir>0?NEG:POS):mix(startCol,[150,140,170],0.6);
    const grad=ctx.createLinearGradient(sx,sy,exn,eyn);
    const a0=0.85, a1=L.end?0.85:0.0;
    grad.addColorStop(0,rgba(startCol,a0));
    grad.addColorStop(0.5,rgba(mix(startCol,endCol,0.5),L.end?0.55:0.35));
    grad.addColorStop(1,rgba(endCol,a1));
    // glow
    strokePath(p);
    ctx.setLineDash([]);
    ctx.strokeStyle=grad; ctx.globalAlpha=0.18; ctx.lineWidth=4.5; ctx.stroke();
    ctx.globalAlpha=0.7; ctx.lineWidth=1.1; ctx.stroke();
    // sparks travelling with the field (from + toward -)
    ctx.globalAlpha=0.9; ctx.lineWidth=1.8;
    ctx.setLineDash([2,46]);
    ctx.lineDashOffset=-(t*38*dir)%48;
    ctx.strokeStyle=L.end?'rgba(255,248,230,0.75)':grad;
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.globalAlpha=1;
  // charges
  for(const c of cs){
    const col=c.q>0?POS:NEG, r=6+Math.abs(c.q)*3;
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r*5);
    g.addColorStop(0,rgba([255,255,255],0.95));
    g.addColorStop(0.18,rgba(col,0.85));
    g.addColorStop(1,rgba(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,r*5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  for(const c of cs){
    ctx.strokeStyle='rgba(10,10,18,0.85)'; ctx.lineWidth=1.6;
    const s=3.5; ctx.beginPath();
    ctx.moveTo(c.x-s,c.y); ctx.lineTo(c.x+s,c.y);
    if(c.q>0){ ctx.moveTo(c.x,c.y-s); ctx.lineTo(c.x,c.y+s); }
    ctx.stroke();
    if(c.cursor){ ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(c.x,c.y,14,0,Math.PI*2); ctx.stroke(); }
  }
  if(mouse.on && cursorMode===2){
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(mouse.x,mouse.y,6,0,Math.PI*2); ctx.stroke();
  }
  let pos=0,neg=0; for(const c of cs){ if(c.q>0)pos+=c.q; else neg-=c.q; }
  hud.innerHTML='lines of force<br>charges: '+cs.length+'  (+'+pos+' / &minus;'+neg+')<br>'+
    'field lines: '+lineCount+'  &middot;  closed '+captured+'  &middot;  to infinity '+escaped+'<br>'+
    'cursor charge: '+(['+1','&minus;1','off'][cursorMode])+(paused?'<br>paused':'');
  requestAnimationFrame(frame);
}

addEventListener('resize',()=>{ resize(); });
fg.addEventListener('pointermove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true; });
fg.addEventListener('pointerleave',()=>{ mouse.on=false; });
fg.addEventListener('click',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; scatter(); });
addEventListener('keydown',e=>{
  if(e.code==='Space'){ paused=!paused; e.preventDefault(); }
  else if(e.key==='f'||e.key==='F'){ cursorMode=(cursorMode+1)%3; }
});
resize(); scatter(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
