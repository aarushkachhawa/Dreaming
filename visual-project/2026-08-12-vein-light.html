<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vein Light — Night 13</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #050807;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Vein Light &mdash; Night 13 &mdash; move to bend new growth toward you, click to water a patch and wake it</div>
<script>
(() => {
  // A thirteenth technique, and the first that grows by aiming rather than
  // wandering or reinforcing. Space colonization, the algorithm botanical
  // graphics uses to fake tree branches and leaf veins: a scattered field
  // of auxin points stands in for unclaimed light and water, and every
  // growing tip looks only at the auxin within its reach, walks toward
  // the average direction of all of it, and takes one short, exact step —
  // no randomness in the step itself, no trail to reinforce, just a
  // greedy pull toward what's still unclaimed. Night 10's lightning found
  // ground by blind random walks that happened to stick; night 3's
  // currents carved paths by agents reinforcing a shared trail. This is
  // neither — every step is a straight, deliberate reach, and the loop of
  // reach-and-consume is what turns a point cloud into something that
  // looks unmistakably like a root system or a leaf's veins without
  // either being drawn on purpose. A few roots start along the floor and
  // climb into a field of auxin scattered edge to edge, tapering from a
  // mossy root color into pale phosphor tips as each branch's own
  // distance from the ground grows, while slow gold sap-pulses trace
  // root to tip along limbs already grown. Once a generation exhausts its
  // auxin it rests, sap still moving, then dissolves back to black and a
  // new one sprouts. Move the cursor to bend new growth toward you like
  // phototropism, click to water a patch and wake a dormant or
  // dissolving generation back into growth.
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const ink = document.createElement('canvas');
  const inkCtx = ink.getContext('2d');

  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ink.width = W * DPR;
    ink.height = H * DPR;
    inkCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    influenceR = clamp(Math.min(W, H) * 0.055, 46, 90);
    killR = influenceR * 0.16;
    growD = killR * 1.15;
    cellSize = influenceR;
    resetScene();
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return `rgb(${(r + m) * 255 | 0},${(g + m) * 255 | 0},${(b + m) * 255 | 0})`;
  }

  // root -> mid -> tip color, walked by a branch's own distance from the ground
  function veinColor(t, hueShift) {
    if (t < 0.5) {
      const k = t / 0.5;
      return hsl(150 + hueShift, lerp(0.30, 0.55, k), lerp(0.07, 0.34, k));
    }
    const k = (t - 0.5) / 0.5;
    return hsl(lerp(150, 138, k) + hueShift, lerp(0.55, 0.55, k), lerp(0.34, 0.85, k));
  }

  // --- growing tree: nodes never move once placed ---
  const MAX_NODES = 16000;
  let nx, ny, nParent, nOrder, nPathLen, nodeCount;
  let nodeGrid, influenceR, killR, growD, cellSize, maxPathLen, hueShift;

  function cellKey(x, y) {
    return ((x / cellSize) | 0) + ',' + ((y / cellSize) | 0);
  }

  function insertNode(x, y, parent, order, pathLen) {
    const i = nodeCount++;
    nx[i] = x; ny[i] = y; nParent[i] = parent; nOrder[i] = order; nPathLen[i] = pathLen;
    const key = cellKey(x, y);
    (nodeGrid[key] || (nodeGrid[key] = [])).push(i);
    if (pathLen > maxPathLen) maxPathLen = pathLen;
    return i;
  }

  // --- auxin field: unclaimed attraction points, swap-removed on consume ---
  const ATTR_CAP = 2200;
  let attrX, attrY, attrCount;

  function addAttractor(x, y) {
    if (attrCount >= ATTR_CAP) return;
    attrX[attrCount] = x; attrY[attrCount] = y; attrCount++;
  }

  function scatterField(n) {
    for (let i = 0; i < n; i++) addAttractor(Math.random() * W, H * 0.02 + Math.random() * H * 0.9);
  }

  function waterAt(x, y) {
    const n = 90;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 130;
      addAttractor(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    if (mode !== 'growing') { mode = 'growing'; modeT = 0; staleFrames = 0; }
  }

  function seedRoots() {
    const n = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < n; i++) {
      const x = W * (0.12 + 0.76 * ((i + 0.5) / n)) + (Math.random() - 0.5) * 40;
      const y = H - 16 - Math.random() * 14;
      insertNode(x, y, -1, 0, 0);
    }
  }

  // --- sap: a slow glow tracing root to tip along wood already grown ---
  let pulses = [];

  function pickPath() {
    if (nodeCount < 8) return null;
    const start = nodeCount - 1 - ((Math.random() * Math.min(nodeCount, 300)) | 0);
    const path = [];
    let i = Math.max(0, start), guard = 0;
    while (i >= 0 && guard++ < 3000) {
      path.push(i);
      if (nParent[i] < 0) break;
      i = nParent[i];
    }
    path.reverse();
    return path.length > 3 ? path : null;
  }

  function maybeSpawnPulse() {
    if (pulses.length < 40 && Math.random() < 0.02) {
      const path = pickPath();
      if (path) pulses.push({ path, t: 0, speed: 0.22 + Math.random() * 0.22 });
    }
  }

  function updatePulses(dt) {
    for (let s = pulses.length - 1; s >= 0; s--) {
      const p = pulses[s];
      p.t += dt * p.speed;
      if (p.t >= 1) { pulses.splice(s, 1); continue; }
      const n = p.path.length;
      const pos = p.t * (n - 1);
      const i0 = pos | 0, i1 = Math.min(n - 1, i0 + 1), f = pos - i0;
      const a = p.path[i0], b = p.path[i1];
      p.x = nx[a] + (nx[b] - nx[a]) * f;
      p.y = ny[a] + (ny[b] - ny[a]) * f;
    }
  }

  function drawPulses() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of pulses) {
      if (p.x === undefined) continue;
      const fade = Math.sin(p.t * Math.PI);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 10);
      g.addColorStop(0, `rgba(255,214,120,${0.9 * fade})`);
      g.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = g;
      ctx.fillRect(p.x - 10, p.y - 10, 20, 20);
    }
    ctx.restore();
  }

  // --- growth step: every alive auxin point claims or feeds its nearest tip ---
  const contrib = new Map();

  function growthStep() {
    let grew = false;
    for (let i = attrCount - 1; i >= 0; i--) {
      const ax = attrX[i], ay = attrY[i];
      const gx = (ax / cellSize) | 0, gy = (ay / cellSize) | 0;
      let best = -1, bestD = influenceR;
      for (let jy = -1; jy <= 1; jy++) {
        for (let jx = -1; jx <= 1; jx++) {
          const arr = nodeGrid[(gx + jx) + ',' + (gy + jy)];
          if (!arr) continue;
          for (let k = 0; k < arr.length; k++) {
            const idx = arr[k];
            const d = Math.hypot(nx[idx] - ax, ny[idx] - ay);
            if (d < bestD) { bestD = d; best = idx; }
          }
        }
      }
      if (best < 0) continue;
      if (bestD < killR) {
        attrCount--;
        attrX[i] = attrX[attrCount]; attrY[i] = attrY[attrCount];
        continue;
      }
      const dx = ax - nx[best], dy = ay - ny[best];
      const len = Math.hypot(dx, dy) || 1;
      let c = contrib.get(best);
      if (!c) { c = [0, 0]; contrib.set(best, c); }
      c[0] += dx / len; c[1] += dy / len;
    }

    contrib.forEach((c, idx) => {
      if (nodeCount >= MAX_NODES) return;
      let dx = c[0], dy = c[1];
      let len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      dx += windX * 0.15; dy += windY * 0.15;
      if (pointer.active) {
        const pdx = pointer.x - nx[idx], pdy = pointer.y - ny[idx];
        const pd = Math.hypot(pdx, pdy);
        if (pd < 420 && pd > 1) {
          const f = (1 - pd / 420) * 0.9;
          dx += (pdx / pd) * f; dy += (pdy / pd) * f;
        }
      }
      len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const px_ = nx[idx] + dx * growD, py_ = ny[idx] + dy * growD;
      const newIdx = insertNode(px_, py_, idx, nOrder[idx] + 1, nPathLen[idx] + growD);
      queueSegment(idx, newIdx);
      grew = true;
    });
    contrib.clear();
    return grew;
  }

  // batched by tapered-color bucket so a heavy growth frame is one stroke() per bucket
  const BUCKETS = 20;
  let pendingSeg = null;
  const ROOT_W = 3.0, TIP_W = 0.6;

  function queueSegment(fromIdx, toIdx) {
    const t = maxPathLen > 0 ? clamp(nPathLen[toIdx] / maxPathLen, 0, 1) : 0;
    const b = Math.min(BUCKETS - 1, (t * BUCKETS) | 0);
    pendingSeg[b].push(nx[fromIdx], ny[fromIdx], nx[toIdx], ny[toIdx]);
  }

  function flushSegments() {
    inkCtx.lineCap = 'round';
    for (let b = 0; b < BUCKETS; b++) {
      const arr = pendingSeg[b];
      if (!arr.length) continue;
      const bt = b / (BUCKETS - 1);
      inkCtx.strokeStyle = veinColor(bt, hueShift);
      inkCtx.lineWidth = lerp(ROOT_W, TIP_W, bt);
      inkCtx.beginPath();
      for (let k = 0; k < arr.length; k += 4) {
        inkCtx.moveTo(arr[k], arr[k + 1]);
        inkCtx.lineTo(arr[k + 2], arr[k + 3]);
      }
      inkCtx.stroke();
      arr.length = 0;
    }
  }

  function drawDust() {
    if (attrCount <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 + 0.15 * Math.sin(elapsed * 1.3);
    ctx.fillStyle = 'rgba(170,255,205,0.5)';
    ctx.beginPath();
    for (let i = 0; i < attrCount; i++) ctx.rect(attrX[i] - 1, attrY[i] - 1, 2, 2);
    ctx.fill();
    ctx.restore();
  }

  // --- state machine: growing -> resting -> dissolving -> reset ---
  let mode, modeT, elapsed, staleFrames, windX, windY;
  const pointer = { x: -9999, y: -9999, active: false };

  function resetScene() {
    nx = new Float64Array(MAX_NODES);
    ny = new Float64Array(MAX_NODES);
    nParent = new Int32Array(MAX_NODES);
    nOrder = new Int32Array(MAX_NODES);
    nPathLen = new Float64Array(MAX_NODES);
    nodeCount = 0;
    nodeGrid = {};
    maxPathLen = 0;
    attrX = new Float64Array(ATTR_CAP);
    attrY = new Float64Array(ATTR_CAP);
    attrCount = 0;
    pendingSeg = new Array(BUCKETS);
    for (let i = 0; i < BUCKETS; i++) pendingSeg[i] = [];
    pulses = [];
    hueShift = (Math.random() - 0.5) * 40;
    inkCtx.clearRect(0, 0, W, H);
    seedRoots();
    scatterField(1500 + ((Math.random() * 300) | 0));
    mode = 'growing';
    modeT = 0;
    elapsed = 0;
    staleFrames = 0;
  }

  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
  });
  window.addEventListener('pointerleave', () => (pointer.active = false));
  window.addEventListener('pointerdown', (e) => waterAt(e.clientX, e.clientY));
  window.addEventListener('resize', resize);

  function simulate(dt) {
    elapsed += dt;
    modeT += dt;
    windX = Math.cos(elapsed * 0.05) * 0.6 + Math.cos(elapsed * 0.017) * 0.4;
    windY = -0.3 + Math.sin(elapsed * 0.041) * 0.2;

    if (mode === 'growing') {
      const grew = growthStep();
      flushSegments();
      updatePulses(dt);
      maybeSpawnPulse();
      staleFrames = grew ? 0 : staleFrames + 1;
      if ((attrCount === 0 && !grew) || staleFrames > 90 || modeT > 55 || nodeCount >= MAX_NODES - 60) {
        mode = 'resting'; modeT = 0;
      }
    } else if (mode === 'resting') {
      updatePulses(dt);
      maybeSpawnPulse();
      if (modeT > 6.5) { mode = 'dissolving'; modeT = 0; }
    } else if (mode === 'dissolving') {
      updatePulses(dt);
      inkCtx.fillStyle = `rgba(5,8,7,${dt * 0.6})`;
      inkCtx.fillRect(0, 0, W, H);
      if (modeT > 3.2) resetScene();
    }
  }

  function render() {
    ctx.fillStyle = '#050807';
    ctx.fillRect(0, 0, W, H);

    ctx.drawImage(ink, 0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3;
    const pad = Math.max(W, H) * 0.006;
    ctx.drawImage(ink, -pad, -pad, W + pad * 2, H + pad * 2);
    ctx.restore();

    drawDust();
    drawPulses();

    const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.15, W / 2, H * 0.55, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let last = null;
  function frame(now) {
    if (last === null) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 20) dt = 1 / 20;
    if (dt <= 0) dt = 1 / 60;

    simulate(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
