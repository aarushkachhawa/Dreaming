<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restless Fern</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050806; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#cfe0d2; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(120,255,160,0.3); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#4a5a4e; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; bend the fronds&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; grow a new fern&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Restless fern. A Barnsley-style iterated function system: four affine maps, applied at random
// by the chaos game, draw a fern. Here every coefficient drifts slowly (each map has its own
// phase), so the fern never settles: the stem sways, the fronds curl and unfurl, and between
// pure shapes it passes through stranger relatives. Colour follows which map placed the point.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
// [a,b,c,d,e,f, probability] : x'=a x+b y+e, y'=c x+d y+f
const BASE=[
  [ 0.00, 0.00, 0.00, 0.16, 0.00, 0.00, 0.01],
  [ 0.85, 0.04,-0.04, 0.85, 0.00, 1.60, 0.85],
  [ 0.20,-0.26, 0.23, 0.22, 0.00, 1.60, 0.07],
  [-0.15, 0.28, 0.26, 0.24, 0.00, 0.44, 0.07],
];
let seeds=[], t=0, paused=false, mx=0.5, hue0=120, px=0, py=0, gen=1;
function reseed(){
  seeds=BASE.map(()=>Array.from({length:6},()=>({ph:Math.random()*6.283,sp:0.4+Math.random()*0.9,amp:0.008+Math.random()*0.03})));
  hue0=90+Math.random()*200; gen++;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  ctx.fillStyle='#050806'; ctx.fillRect(0,0,canvas.width,canvas.height);
}
function coeffs(){
  const bend=(mx-0.5)*0.5;
  return BASE.map((m,i)=>m.map((v,k)=>{
    if (k===6) return v;
    const s=seeds[i][k];
    let w=v+Math.sin(t*s.sp+s.ph)*s.amp;
    if (i>=2 && k<4) w+=bend*(k%2?-0.05:0.05)*(i===2?1:-1);
    return w;
  }));
}
function frame(){
  const W=canvas.width,H=canvas.height;
  if (!paused){
    t+=0.012;
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(5,8,6,0.16)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const M=coeffs();
    const sc=H*0.088, ox=W/2, oy=H*0.97;
    const size=Math.max(1,W/900);
    let x=px,y=py;
    for (let i=0;i<7000;i++){
      let r=Math.random(),k=0;
      for (;k<3;k++){ r-=M[k][6]; if (r<0) break; }
      const m=M[k];
      const nx=m[0]*x+m[1]*y+m[4], ny=m[2]*x+m[3]*y+m[5];
      x=nx; y=ny;
      if (!(Math.abs(x)<50&&Math.abs(y)<50)){ x=0;y=0; continue; }
      if (i<20) continue;
      const h=(hue0+k*22+y*6)%360;
      ctx.fillStyle='hsla('+h+',75%,'+(32+y*3.5)+'%,0.55)';
      ctx.fillRect(ox+x*sc,oy-y*sc,size,size);
    }
    px=x;py=y;
  }
  hud.innerHTML='RESTLESS FERN<br>four maps, 24 drifting coefficients<br>fern no. '+gen+' &middot; drift '+t.toFixed(1);
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{mx=e.clientX/innerWidth;});
addEventListener('touchmove',e=>{mx=e.touches[0].clientX/innerWidth;},{passive:true});
addEventListener('click',()=>{reseed();t=0;
  ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#050806'; ctx.fillRect(0,0,canvas.width,canvas.height);});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
reseed(); gen=1; setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
