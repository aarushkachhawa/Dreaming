<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slow Multiplication</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#06070b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud {
    position:fixed; top:14px; left:16px; color:#d9ecff; font-family:'Courier New', monospace;
    font-size:13px; line-height:1.55; text-shadow:0 0 6px rgba(120,180,255,0.5);
    pointer-events:none; user-select:none;
  }
  #hud .big { font-size:17px; color:#ffe0a8; text-shadow:0 0 8px rgba(255,190,110,0.6); }
  #hud .dim { color:#7a8aa3; }
  #hint {
    position:fixed; bottom:14px; left:16px; color:#5c6a80; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; left to right, more points&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; jump the multiplier&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";

// Modular times table: put N points on a circle and draw a chord from point i
// to point (i*k mod N). With k a whole number the chords fold into a hidden
// curve (k=2 a cardioid, k=3 a nephroid, k=4 a three-cusped epicycloid...).
// Here k is a real number that creeps upward, so the curve is never held:
// near each integer it crystallises, between integers it dissolves into
// interference, and a new cusp is born with every whole step.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

let cw = 0, ch = 0, dpr = 1, R = 100, cx = 0, cy = 0;
let k = 2.0, speed = 0.0022, paused = false, rot = 0;
let N = 360, targetN = 360;
const NAMES = {2:'cardioid',3:'nephroid',4:'trefoil',5:'quadrifolium',6:'quintafoil'};

function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  cw = canvas.width = Math.floor(innerWidth*dpr);
  ch = canvas.height = Math.floor(innerHeight*dpr);
  R = Math.min(cw, ch)*0.43; cx = cw/2; cy = ch/2;
  ctx.fillStyle = '#06070b'; ctx.fillRect(0,0,cw,ch);
}
window.addEventListener('resize', resize); resize();

function draw(){
  N += (targetN - N)*0.05;
  const n = Math.round(N);
  const nearest = Math.round(k), off = Math.abs(k - nearest);
  // how close to a whole number: 1 = locked, 0 = between
  const lock = Math.max(0, 1 - off*5);

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(6,7,11,0.22)';
  ctx.fillRect(0,0,cw,ch);

  ctx.globalCompositeOperation = 'lighter';
  const hue0 = (k*47) % 360;
  ctx.lineWidth = Math.max(0.6, dpr*0.7);
  const alpha = (0.05 + lock*0.10) * (360/n > 1 ? 1 : 360/n + 0.4);
  const pts = new Array(n);
  for (let i=0;i<n;i++){
    const a = rot + i/n*Math.PI*2;
    pts[i] = [cx + Math.cos(a)*R, cy + Math.sin(a)*R];
  }
  // chords batched in a few hue bands for speed
  const bands = 6;
  for (let b=0;b<bands;b++){
    ctx.beginPath();
    for (let i=b;i<n;i+=bands){
      const j = ((i*k) % n + n) % n;
      const j0 = Math.floor(j), f = j - j0, p = pts[i];
      const q0 = pts[j0], q1 = pts[(j0+1)%n];
      ctx.moveTo(p[0], p[1]);
      ctx.lineTo(q0[0]+(q1[0]-q0[0])*f, q0[1]+(q1[1]-q0[1])*f);
    }
    ctx.strokeStyle = 'hsla('+((hue0 + b*22) % 360)+',85%,'+(58+lock*12)+'%,'+alpha+')';
    ctx.stroke();
  }
  // bright rim of points
  ctx.fillStyle = 'hsla('+hue0+',90%,80%,'+(0.25+lock*0.4)+')';
  const step = Math.max(1, Math.floor(n/180));
  for (let i=0;i<n;i+=step){
    ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], dpr*1.3, 0, 6.2832); ctx.fill();
  }
}

function tick(){
  // linger near whole numbers: the speed dips where the curve is sharpest
  const off = Math.abs(k - Math.round(k));
  k += speed*(0.12 + Math.min(1, off*4)*0.88);
  rot += 0.0004;
  if (k > 12) k = 2;
}

function updateHud(){
  const r = Math.round(k), off = Math.abs(k - r);
  const nm = (off < 0.02 && NAMES[r]) ? ' &middot; ' + NAMES[r] : (off < 0.02 ? ' &middot; ' + (r-1) + ' cusps' : '');
  hud.innerHTML = '<span class="big">Slow Multiplication</span><br><span class="dim">k = ' + k.toFixed(3) +
    ' &middot; ' + Math.round(N) + ' points' + nm + (paused ? ' &middot; paused' : '') + '</span>';
}

canvas.addEventListener('mousemove', e => { targetN = 120 + Math.floor(e.clientX/innerWidth*480); });
canvas.addEventListener('click', () => { k = 2 + Math.random()*9; });
canvas.addEventListener('touchstart', () => { k = 2 + Math.random()*9; }, {passive:true});
window.addEventListener('keydown', e => { if (e.key===' '){ paused=!paused; e.preventDefault(); } });

let hudT = 0;
function frame(){
  if (!paused) tick();
  draw();
  if (++hudT % 6 === 0) updateHud();
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
