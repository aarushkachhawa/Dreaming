<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undecided Ground — Night 49</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #050308;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="caption">Undecided Ground &mdash; Night 49 &mdash; drag a well to bend the map &middot; drag open ground to pan &middot; scroll to zoom</div>
<script id="vert" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="frag" type="x-shader/x-fragment">
precision highp float;

#define NB 6
#define MAXIT 46

uniform vec2 iResolution;
uniform float uTime;
uniform vec2 uCenter;
uniform float uScale;
uniform vec2 uRoots[NB];
uniform int uDrag;

float hash(vec2 p) {
  return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453123);
}

vec3 hsv2rgb(vec3 c) {
  vec4 k = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + k.xyz) * 6.0 - k.www);
  return c.z * mix(k.xxx, clamp(p - k.xxx, 0.0, 1.0), c.y);
}

vec2 cinv(vec2 a, float d2) {
  return vec2(a.x, -a.y) / max(d2, 1e-12);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution.xy) / iResolution.y;
  vec2 z0 = uCenter + uv * uScale;
  vec2 z = z0;

  bool settled = false;
  float iterUsed = float(MAXIT);

  for (int i = 0; i < MAXIT; i++) {
    vec2 sumInv = vec2(0.0);
    bool hitRoot = false;
    for (int j = 0; j < NB; j++) {
      vec2 diff = z - uRoots[j];
      float d2 = dot(diff, diff);
      if (d2 < 6.0e-9) { hitRoot = true; break; }
      sumInv += cinv(diff, d2);
    }
    if (hitRoot) { iterUsed = float(i); settled = true; break; }
    float sd2 = dot(sumInv, sumInv);
    vec2 step = cinv(sumInv, sd2);
    z -= step;
    if (dot(step, step) < 1.0e-13) { iterUsed = float(i); settled = true; break; }
  }

  int nearest = 0;
  float bestD = 1.0e9;
  for (int j = 0; j < NB; j++) {
    float d = distance(z, uRoots[j]);
    if (d < bestD) { bestD = d; nearest = j; }
  }

  float hue = float(nearest) / float(NB);
  float shade = settled ? pow(1.0 - iterUsed / float(MAXIT), 0.55) : 0.0;
  shade = clamp(shade, 0.04, 0.88);
  vec3 col = hsv2rgb(vec3(hue + 0.10 * sin(uTime * 0.04 + hue * 6.2831), 0.58, shade));
  if (!settled) col *= 0.22;

  float vig = 1.0 - 0.32 * dot(uv, uv);
  col *= vig;

  float px = iResolution.y / max(uScale, 1.0e-6);
  for (int j = 0; j < NB; j++) {
    float d = distance(z0, uRoots[j]) * px;
    float ring = smoothstep(2.4, 0.0, abs(d - 9.0));
    float pulse = (j == uDrag) ? (1.4 + 0.6 * sin(uTime * 7.0)) : 1.0;
    col += vec3(1.0, 0.98, 0.92) * ring * 0.85 * pulse;
    col += hsv2rgb(vec3(float(j) / float(NB), 0.55, 1.0)) * exp(-d * 0.09) * 0.05;
  }

  col += (hash(gl_FragCoord.xy + fract(uTime * 37.0)) - 0.5) * 0.02;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var caption = document.getElementById('caption');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    caption.textContent = 'this piece needs WebGL — open it in a modern desktop browser';
    caption.classList.add('visible');
    return;
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }

  var vs = compile(gl.VERTEX_SHADER, document.getElementById('vert').textContent);
  var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent);
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uRes = gl.getUniformLocation(prog, 'iResolution');
  var uTimeLoc = gl.getUniformLocation(prog, 'uTime');
  var uCenterLoc = gl.getUniformLocation(prog, 'uCenter');
  var uScaleLoc = gl.getUniformLocation(prog, 'uScale');
  var uRootsLoc = gl.getUniformLocation(prog, 'uRoots[0]');
  var uDragLoc = gl.getUniformLocation(prog, 'uDrag');

  var NB = 6;
  var roots = [];
  for (var i = 0; i < NB; i++) {
    var a = (i / NB) * Math.PI * 2 + Math.random() * 0.5;
    var r = 1.05 + Math.random() * 0.35;
    roots.push({
      x: Math.cos(a) * r,
      y: Math.sin(a) * r,
      vx: 0,
      vy: 0
    });
  }

  var center = { x: 0, y: 0 };
  var scale = 2.15;
  var dragIndex = -1;
  var panning = false;
  var panLast = { x: 0, y: 0 };
  var lastPointer = { x: 0, y: 0 };
  var idleSince = 0;
  var now = 0;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    var w = Math.floor(window.innerWidth * dpr);
    var h = Math.floor(window.innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function screenToComplex(cx, cy) {
    var r = canvas.getBoundingClientRect();
    var px = (cx - r.left) / r.width * canvas.width;
    var py = (cy - r.top) / r.height * canvas.height;
    var uvx = (px - 0.5 * canvas.width) / canvas.height;
    var uvy = -(py - 0.5 * canvas.height) / canvas.height;
    return { x: center.x + uvx * scale, y: center.y + uvy * scale };
  }

  function nearestRoot(cx, cy) {
    var p = screenToComplex(cx, cy);
    var r = canvas.getBoundingClientRect();
    var pxPerUnit = canvas.height / scale;
    var best = -1;
    var bestD = 1e9;
    for (var i = 0; i < NB; i++) {
      var dx = (roots[i].x - p.x) * pxPerUnit;
      var dy = (roots[i].y - p.y) * pxPerUnit;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    var dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    return bestD < 34 * dpr ? best : -1;
  }

  function wake() {
    idleSince = now;
    caption.classList.add('visible');
  }

  canvas.addEventListener('pointerdown', function (e) {
    wake();
    var hit = nearestRoot(e.clientX, e.clientY);
    if (hit >= 0) {
      dragIndex = hit;
    } else {
      panning = true;
      panLast = screenToComplex(e.clientX, e.clientY);
    }
    lastPointer = { x: e.clientX, y: e.clientY };
  });

  window.addEventListener('pointermove', function (e) {
    if (dragIndex >= 0) {
      var p = screenToComplex(e.clientX, e.clientY);
      var dt = 1 / 60;
      roots[dragIndex].vx = (p.x - roots[dragIndex].x) / dt;
      roots[dragIndex].vy = (p.y - roots[dragIndex].y) / dt;
      roots[dragIndex].x = p.x;
      roots[dragIndex].y = p.y;
      wake();
    } else if (panning) {
      var q = screenToComplex(e.clientX, e.clientY);
      center.x += panLast.x - q.x;
      center.y += panLast.y - q.y;
      wake();
    }
  });

  window.addEventListener('pointerup', function () {
    if (dragIndex >= 0) {
      var r = roots[dragIndex];
      var sp = Math.sqrt(r.vx * r.vx + r.vy * r.vy);
      var cap = 1.4;
      if (sp > cap) { r.vx = r.vx / sp * cap; r.vy = r.vy / sp * cap; }
    }
    dragIndex = -1;
    panning = false;
  });

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    wake();
    var before = screenToComplex(e.clientX, e.clientY);
    var factor = Math.exp(e.deltaY * 0.0016);
    scale = Math.min(Math.max(scale * factor, 0.06), 8.0);
    var after = screenToComplex(e.clientX, e.clientY);
    center.x += before.x - after.x;
    center.y += before.y - after.y;
  }, { passive: false });

  var start = performance.now();

  function step(dt) {
    for (var i = 0; i < NB; i++) {
      if (i === dragIndex) continue;
      var r = roots[i];
      var fx = -0.05 * r.x;
      var fy = -0.05 * r.y;
      for (var j = 0; j < NB; j++) {
        if (j === i) continue;
        var dx = r.x - roots[j].x;
        var dy = r.y - roots[j].y;
        var d2 = dx * dx + dy * dy + 0.02;
        var inv = 0.55 / d2;
        fx += dx * inv;
        fy += dy * inv;
      }
      fx += (hash2(i, now * 0.9) - 0.5) * 0.55;
      fy += (hash2(i + 97.0, now * 0.9) - 0.5) * 0.55;
      r.vx = (r.vx + fx * dt) * 0.965;
      r.vy = (r.vy + fy * dt) * 0.965;
      r.x += r.vx * dt;
      r.y += r.vy * dt;
    }
  }

  function hash2(a, b) {
    var s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return s - Math.floor(s);
  }

  var flat = new Float32Array(NB * 2);
  var lastT = start;

  function frame(tms) {
    now = (tms - start) / 1000;
    var dt = Math.min((tms - lastT) / 1000, 0.05);
    lastT = tms;

    step(dt);

    if (now - idleSince > 6.0) caption.classList.remove('visible');

    resize();
    for (var i = 0; i < NB; i++) {
      flat[i * 2] = roots[i].x;
      flat[i * 2 + 1] = roots[i].y;
    }

    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTimeLoc, now);
    gl.uniform2f(uCenterLoc, center.x, center.y);
    gl.uniform1f(uScaleLoc, scale);
    gl.uniform2fv(uRootsLoc, flat);
    gl.uniform1i(uDragLoc, dragIndex);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
