<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beating Rings</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05060a; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#d9e4f0; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(120,190,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#555a63; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; steer the second source&nbsp;&nbsp;|&nbsp;&nbsp;scroll &mdash; change ring spacing&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; add a source&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Moire from concentric rings. Each source emits evenly spaced circles; where
// two families nearly agree their lines interleave into broad hyperbolic
// fringes much coarser than either ring spacing. Nothing draws the fringes.
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
let W=0, H=0, dpr=1, t=0, paused=false, spacing=9, mx=0.5, my=0.5;
let extra=[]; // sources added by clicking: {x,y,hue,born}
function resize(){
  dpr = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rings(x, y, hue, alpha){
  const far = Math.hypot(Math.max(x,W-x), Math.max(y,H-y));
  ctx.strokeStyle = 'hsla('+hue+',80%,62%,'+alpha+')';
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  for (let r=spacing; r<far; r+=spacing){ ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832); }
  ctx.stroke();
}
function frame(){
  if (!paused) t += 0.004;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05060a'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.22;
  // first source wanders in a slow Lissajous loop; second follows the cursor
  const ax = cx + Math.cos(t*1.3)*R, ay = cy + Math.sin(t*1.7)*R*0.8;
  const bx = cx + (mx-0.5)*W*0.8 + Math.sin(t*0.9)*12, by = cy + (my-0.5)*H*0.8 + Math.cos(t*1.1)*12;
  rings(ax, ay, 195 + Math.sin(t)*15, 0.55);
  rings(bx, by, 330 + Math.cos(t*0.8)*15, 0.55);
  for (const s of extra) rings(s.x + Math.sin(t*1.2+s.born)*30, s.y + Math.cos(t*0.9+s.born)*30, s.hue, 0.4);
  const d = Math.hypot(ax-bx, ay-by);
  hud.innerHTML = 'beating rings<br>sources '+(2+extra.length)+'<br>spacing '+spacing.toFixed(1)+'px<br>separation '+Math.round(d)+'px';
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
addEventListener('mousemove', e=>{ mx=e.clientX/innerWidth; my=e.clientY/innerHeight; });
addEventListener('wheel', e=>{ spacing = Math.max(4, Math.min(30, spacing + (e.deltaY>0?0.4:-0.4))); e.preventDefault(); }, {passive:false});
canvas.addEventListener('click', e=>{
  extra.push({x:e.clientX, y:e.clientY, hue:Math.random()*360, born:Math.random()*6.28});
  if (extra.length>3) extra.shift();
});
addEventListener('keydown', e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } });
resize(); frame();
})();
</script>
</body>
</html>
