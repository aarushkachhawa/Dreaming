<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auroral Wake — Night 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #030308;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="caption">Auroral Wake &mdash; Night 3 &mdash; move to bend the curtains, click to ring them</div>
<script>
(() => {
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) {
    document.body.style.background = '#030308';
    return;
  }

  const vertSrc = `
    attribute vec2 aPosition;
    void main() {
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `;

  // Domain-warped fbm rendered as vertical aurora curtains over a hashed
  // starfield. Two layers of fbm feed into a third (Inigo Quilez's warp
  // technique) so the ribbons fold and drift instead of just scrolling.
  const fragSrc = `
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec2 uMouse;
    uniform float uSeed;
    uniform vec2 uClickPos;
    uniform float uClickTime;
    uniform float uHasClick;

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21) + uSeed);
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    float fbm(vec2 p) {
      float v = 0.0;
      float amp = 0.5;
      mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
      for (int i = 0; i < 5; i++) {
        v += amp * noise(p);
        p = m * p;
        amp *= 0.5;
      }
      return v;
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes.xy) / uRes.y;
      float t = uTime * 0.045;

      vec2 warpCenter = uMouse * 0.35;

      vec2 q = vec2(
        fbm(uv * 1.4 + t),
        fbm(uv * 1.4 + vec2(5.2, 1.3) - t * 0.7)
      );
      vec2 r = vec2(
        fbm(uv * 1.4 + 1.0 * q + vec2(1.7, 9.2) + warpCenter + t * 0.3),
        fbm(uv * 1.4 + 1.0 * q + vec2(8.3, 2.8) - warpCenter - t * 0.2)
      );
      float pattern = fbm(uv * 1.4 + 2.0 * r);

      float curtain = smoothstep(0.15, 0.95, pattern) *
                       smoothstep(1.05, -0.2, abs(uv.x) * 1.15);

      vec3 teal   = vec3(0.05, 0.62, 0.55);
      vec3 violet = vec3(0.42, 0.16, 0.78);
      vec3 green  = vec3(0.16, 0.92, 0.48);

      vec3 col = mix(teal, green, smoothstep(0.2, 0.85, r.x));
      col = mix(col, violet, smoothstep(0.35, 0.9, r.y));
      col *= curtain * 1.35;

      // click sends a brief, tight ripple through the curtain field
      if (uHasClick > 0.5) {
        float age = uTime - uClickTime;
        float dist = length(uv - uClickPos);
        float ring = sin(dist * 14.0 - age * 7.0);
        float envelope = exp(-age * 1.4) * exp(-dist * 3.0);
        col += vec3(0.55, 0.85, 0.95) * max(ring, 0.0) * envelope * 0.55;
      }

      vec3 bg = mix(vec3(0.008, 0.008, 0.022), vec3(0.03, 0.018, 0.07), uv.y * 0.5 + 0.5);

      vec2 starUv = uv * uRes.y * 0.55;
      float starField = hash(floor(starUv));
      float star = step(0.9974, starField);
      float twinkle = 0.4 + 0.6 * sin(uTime * 2.3 + starField * 140.0);
      bg += star * twinkle * vec3(0.9, 0.95, 1.0);

      vec3 finalColor = bg + col;

      float vig = smoothstep(1.15, 0.15, length(uv));
      finalColor *= vig;

      float grain = (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.02;
      finalColor += grain;

      gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program));
  }
  gl.useProgram(program);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPosition = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(aPosition);
  gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

  const uRes = gl.getUniformLocation(program, 'uRes');
  const uTime = gl.getUniformLocation(program, 'uTime');
  const uMouse = gl.getUniformLocation(program, 'uMouse');
  const uSeed = gl.getUniformLocation(program, 'uSeed');
  const uClickPos = gl.getUniformLocation(program, 'uClickPos');
  const uClickTime = gl.getUniformLocation(program, 'uClickTime');
  const uHasClick = gl.getUniformLocation(program, 'uHasClick');

  gl.uniform1f(uSeed, Math.random() * 1000.0);

  let DPR, W, H;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.75);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }

  let mouseNorm = [0, 0];
  window.addEventListener('pointermove', (e) => {
    mouseNorm[0] = (e.clientX / W) * 2 - 1;
    mouseNorm[1] = -((e.clientY / H) * 2 - 1);
  });

  let hasClick = false;
  window.addEventListener('pointerdown', (e) => {
    const x = ((e.clientX - 0.5 * W) / H) * 2;
    const y = -((e.clientY - 0.5 * H) / H) * 2;
    gl.uniform2f(uClickPos, x, y);
    gl.uniform1f(uClickTime, startTime === null ? 0 : (performance.now() - startTime) / 1000);
    hasClick = true;
    gl.uniform1f(uHasClick, 1.0);
  });

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let startTime = null;
  function frame(now) {
    if (startTime === null) startTime = now;
    const t = (now - startTime) / 1000;
    gl.uniform1f(uTime, t);
    gl.uniform2f(uMouse, mouseNorm[0], mouseNorm[1]);
    if (!hasClick) gl.uniform1f(uHasClick, 0.0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
