<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lattice Wake — Night 34</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
    overflow: hidden;
    cursor: crosshair;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 1;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
    z-index: 2;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.32);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="caption">Lattice Wake &mdash; Night 34 &mdash; move to drag an eddy through the current &middot; click to plant a pillar</div>
<script>
(function(){
'use strict';
// A thirty-fourth technique, and the third fluid in this project's
// history, and the first built from a lattice-gas kinetic model rather
// than a continuum equation solved on a grid or a swarm of particles
// carrying the fluid's mass with them. This is the lattice Boltzmann
// method, D2Q9 flavor: every cell holds not a velocity but nine numbers,
// one for each of the compass directions plus rest, each representing how
// much of that cell's fluid is presently moving that way. Two steps,
// repeated forever: collision, where each cell's nine numbers relax a
// fraction of the way toward the Maxwell-Boltzmann equilibrium implied by
// its own locally-summed density and momentum; and streaming, where each
// of the nine numbers simply slides one cell over in its own direction.
// Density and velocity are never solved for directly, the way night 9's
// stable-fluids solver explicitly built and inverted a pressure Laplacian
// to force the field divergence-free, or night 21's SPH summed a kernel
// over neighbors to estimate a smooth field at a moving point — here
// macroscopic flow is just a statistic, the zeroth and first moment of a
// distribution nobody ever asked to be smooth or incompressible, and it
// comes out that way anyway, an emergent consequence of collide-and-
// stream. A solid cell needs no boundary condition solved for it at all:
// streaming toward a wall or a planted obstacle is simply redirected back
// the way it came, one bounce-back rule standing in for what a continuum
// solver would spend a whole no-slip constraint on. Left running, a
// channel of leftward-forced inflow around any obstacle placed in it does
// not sit still — past a critical ratio of inertia to the fluid's own
// relaxation time, exactly Reynolds' own criterion, the wake behind the
// obstacle tears into an alternating train of vortices peeling off first
// one side then the other, a Kármán vortex street nobody scripted, the
// flow's own instability, the closest thing this project's fluids have
// had yet to the double pendulum's tear into chaos at night 26. Color
// reads vorticity rather than dye or height: amber-coral where the local
// spin curls one way, indigo-cyan where it curls the other, a faint white
// bloom laid over both wherever the raw speed climbs, so a shed vortex
// train reads as an alternating necklace of warm and cool beads drifting
// downstream while untroubled inflow stays a calm, near-black hush. The
// relaxation time driving that spin breathes slowly over several minutes,
// sliding the same channel between a viscous, laminar hush around its
// obstacles and a proper turbulent shedding train without touching the
// geometry at all. Move the cursor to drag a temporary eddy-maker through
// the current, its own trailing wake following it live; click to plant a
// permanent pillar wherever it stands, up to a handful at once, each
// throwing its own street into the others' way. Left alone, the whole
// channel dissolves its pillars back to a single, freshly placed one
// every couple of minutes, reseeded with its own small asymmetry so a new
// street always finds its own side to start peeling from. Open the file
// directly in a browser.

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var flashEl = document.getElementById('flash');
var caption = document.getElementById('caption');
var dpr = Math.min(window.devicePixelRatio || 1, 2);

// ---------- D2Q9 lattice constants ----------
var EX = [0, 1, 0, -1, 0, 1, -1, -1, 1];
var EY = [0, 0, 1, 0, -1, 1, 1, -1, -1];
var W  = [4/9, 1/9, 1/9, 1/9, 1/9, 1/36, 1/36, 1/36, 1/36];
var OPP = [0, 3, 4, 1, 2, 7, 8, 5, 6];

function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function clampByte(v){ return v < 0 ? 0 : (v > 255 ? 255 : v) | 0; }

var width = 0, height = 0;
var nx, ny, n;
var f, fnew, rhoArr, uxArr, uyArr, obstacle, baseObstacle;
var offCanvas, offCtx, imgData;
var obstacles = [];
var MAX_OBSTACLES = 5;
var mouseActive = false, mouseGX = 0, mouseGY = 0, probeR = 6;
var time = 0;
var lastResetT = 0, resetInterval = 120000;
var STEPS_PER_FRAME = 2;

function defaultObstacle(){
  return {
    x: nx * 0.2,
    y: ny * (0.35 + Math.random() * 0.3),
    r: Math.max(4, ny * 0.075 + Math.random() * ny * 0.025)
  };
}

function seedField(){
  for(var y=0; y<ny; y++){
    for(var x=0; x<nx; x++){
      var idx = y*nx + x;
      var base = idx*9;
      var uxv = 0.08, uyv = (Math.random()-0.5)*0.05;
      var usqr = uxv*uxv + uyv*uyv;
      for(var i=0;i<9;i++){
        var eu = EX[i]*uxv + EY[i]*uyv;
        f[base+i] = W[i]*(1 + 3*eu + 4.5*eu*eu - 1.5*usqr);
      }
    }
  }
}

function initSim(){
  nx = clamp(Math.round(width/8), 100, 200);
  ny = clamp(Math.round(height/8), 60, 120);
  n = nx*ny;
  f = new Float32Array(n*9);
  fnew = new Float32Array(n*9);
  rhoArr = new Float32Array(n);
  uxArr = new Float32Array(n);
  uyArr = new Float32Array(n);
  obstacle = new Uint8Array(n);
  baseObstacle = new Uint8Array(n);
  for(var x=0;x<nx;x++){
    baseObstacle[x] = 1;
    baseObstacle[(ny-1)*nx + x] = 1;
  }
  obstacles = [ defaultObstacle() ];
  offCanvas = document.createElement('canvas');
  offCanvas.width = nx; offCanvas.height = ny;
  offCtx = offCanvas.getContext('2d');
  imgData = offCtx.createImageData(nx, ny);
  seedField();
  lastResetT = performance.now();
  resetInterval = 100000 + Math.random()*50000;
}

function stampCircle(cx, cy, r){
  var x0 = Math.max(0, Math.floor(cx-r)), x1 = Math.min(nx-1, Math.ceil(cx+r));
  var y0 = Math.max(0, Math.floor(cy-r)), y1 = Math.min(ny-1, Math.ceil(cy+r));
  var r2 = r*r;
  for(var y=y0; y<=y1; y++){
    for(var x=x0; x<=x1; x++){
      var dx = x-cx, dy = y-cy;
      if(dx*dx + dy*dy <= r2) obstacle[y*nx+x] = 1;
    }
  }
}

function rasterizeObstacles(){
  obstacle.set(baseObstacle);
  for(var k=0;k<obstacles.length;k++){
    stampCircle(obstacles[k].x, obstacles[k].y, obstacles[k].r);
  }
  if(mouseActive){
    stampCircle(mouseGX, mouseGY, probeR);
  }
}

function step(omega, u0cur, t){
  // 1. macroscopic moments
  for(var idx=0; idx<n; idx++){
    if(obstacle[idx]) continue;
    var base = idx*9;
    var r=0, uxs=0, uys=0;
    for(var i=0;i<9;i++){ var v=f[base+i]; r+=v; uxs+=v*EX[i]; uys+=v*EY[i]; }
    if(r < 1e-6) r = 1e-6;
    rhoArr[idx]=r; uxArr[idx]=uxs/r; uyArr[idx]=uys/r;
  }
  // 2. forced inflow at the left column
  for(var y=1; y<ny-1; y++){
    var idxL = y*nx;
    if(obstacle[idxL]) continue;
    var uyIn = 0.016*Math.sin(t*2.3 + y*0.6);
    rhoArr[idxL]=1; uxArr[idxL]=u0cur; uyArr[idxL]=uyIn;
    var baseL = idxL*9;
    var usqrL = u0cur*u0cur + uyIn*uyIn;
    for(var i2=0;i2<9;i2++){
      var euL = EX[i2]*u0cur + EY[i2]*uyIn;
      f[baseL+i2] = W[i2]*(1 + 3*euL + 4.5*euL*euL - 1.5*usqrL);
    }
  }
  // 3. BGK collision
  for(var idx3=0; idx3<n; idx3++){
    if(obstacle[idx3]) continue;
    var base3 = idx3*9;
    var rr=rhoArr[idx3], uxx=uxArr[idx3], uyy=uyArr[idx3];
    var usqr2 = uxx*uxx + uyy*uyy;
    for(var i3=0;i3<9;i3++){
      var eu2 = EX[i3]*uxx + EY[i3]*uyy;
      var feq = W[i3]*rr*(1 + 3*eu2 + 4.5*eu2*eu2 - 1.5*usqr2);
      f[base3+i3] += omega*(feq - f[base3+i3]);
    }
  }
  // stability clamp (also catches NaN)
  for(var k2=0; k2<f.length; k2++){
    if(!(f[k2] >= 0)) f[k2] = 0;
    else if(f[k2] > 6) f[k2] = 6;
  }
  // 4. streaming with on-link bounce-back
  fnew.fill(0);
  for(var y4=0; y4<ny; y4++){
    for(var x4=0; x4<nx; x4++){
      var idx4 = y4*nx + x4;
      if(obstacle[idx4]) continue;
      var base4 = idx4*9;
      for(var i4=0;i4<9;i4++){
        var fi = f[base4+i4];
        var tx = x4+EX[i4], ty = y4+EY[i4];
        if(tx < 0 || tx >= nx) continue;
        var tidx = ty*nx + tx;
        if(obstacle[tidx]){
          fnew[base4 + OPP[i4]] += fi;
        } else {
          fnew[tidx*9 + i4] += fi;
        }
      }
    }
  }
  // 5. open outflow: extrapolate the last column from its neighbor
  for(var y5=0; y5<ny; y5++){
    var dstIdx = y5*nx + (nx-1);
    if(obstacle[dstIdx]) continue;
    var srcIdx = y5*nx + (nx-2);
    var sb = srcIdx*9, db = dstIdx*9;
    for(var i5=0;i5<9;i5++){ fnew[db+i5] = fnew[sb+i5]; }
  }
  var tmp = f; f = fnew; fnew = tmp;
}

var BG = [6, 9, 18];
var WARM = [255, 140, 70];
var COOL = [70, 150, 255];
var CURL_SCALE = 9;
var SPEED_REF = 0.16;

function renderToBuffer(){
  var data = imgData.data;
  for(var y=0; y<ny; y++){
    for(var x=0; x<nx; x++){
      var idx = y*nx + x;
      var di = idx*4;
      if(obstacle[idx]){
        var xL = x>0 ? x-1 : x, xR = x<nx-1 ? x+1 : x;
        var yU = y>0 ? y-1 : y, yD = y<ny-1 ? y+1 : y;
        var edge = !obstacle[y*nx+xL] || !obstacle[y*nx+xR] || !obstacle[yU*nx+x] || !obstacle[yD*nx+x];
        var c = edge ? 44 : 15;
        data[di]=c; data[di+1]=c+3; data[di+2]=c+9; data[di+3]=255;
        continue;
      }
      var xL2 = x>0 ? x-1 : x, xR2 = x<nx-1 ? x+1 : x;
      var yU2 = y>0 ? y-1 : y, yD2 = y<ny-1 ? y+1 : y;
      var uyR = obstacle[y*nx+xR2] ? 0 : uyArr[y*nx+xR2];
      var uyL = obstacle[y*nx+xL2] ? 0 : uyArr[y*nx+xL2];
      var uxD = obstacle[yD2*nx+x] ? 0 : uxArr[yD2*nx+x];
      var uxU = obstacle[yU2*nx+x] ? 0 : uxArr[yU2*nx+x];
      var curl = (uyR - uyL) - (uxD - uxU);
      var uxv = uxArr[idx], uyv = uyArr[idx];
      var speed = Math.sqrt(uxv*uxv + uyv*uyv);
      var cN = clamp(curl*CURL_SCALE, -1, 1);
      var sN = clamp(speed/SPEED_REF, 0, 1);
      var mag = Math.pow(Math.abs(cN), 0.85);
      var r=BG[0], g=BG[1], b=BG[2];
      if(cN > 0){ r += WARM[0]*mag; g += WARM[1]*mag; b += WARM[2]*mag; }
      else { r += COOL[0]*mag; g += COOL[1]*mag; b += COOL[2]*mag; }
      var hi = sN*sN*0.45;
      r += hi*255; g += hi*255; b += hi*255;
      data[di]=clampByte(r); data[di+1]=clampByte(g); data[di+2]=clampByte(b); data[di+3]=255;
    }
  }
  offCtx.putImageData(imgData, 0, 0);
}

function resizeCanvas(){
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.round(width*dpr);
  canvas.height = Math.round(height*dpr);
  initSim();
}

var resizeTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeCanvas, 150);
});

function flash(){
  flashEl.style.transition = 'none';
  flashEl.style.opacity = '0.5';
  requestAnimationFrame(function(){
    flashEl.style.transition = 'opacity 0.8s ease';
    flashEl.style.opacity = '0';
  });
}

var rect = null;
function updateRect(){ rect = canvas.getBoundingClientRect(); }
window.addEventListener('resize', updateRect);

canvas.addEventListener('pointermove', function(e){
  if(!rect) updateRect();
  var mx = (e.clientX - rect.left) / rect.width;
  var my = (e.clientY - rect.top) / rect.height;
  mouseGX = mx*nx; mouseGY = my*ny;
  mouseActive = true;
});
canvas.addEventListener('pointerleave', function(){ mouseActive = false; });
canvas.addEventListener('pointerdown', function(e){
  if(!rect) updateRect();
  var mx = (e.clientX - rect.left) / rect.width;
  var my = (e.clientY - rect.top) / rect.height;
  obstacles.push({ x: mx*nx, y: my*ny, r: 5 + Math.random()*6 });
  if(obstacles.length > MAX_OBSTACLES) obstacles.shift();
  flash();
});

function autoReset(now){
  obstacles = [ defaultObstacle() ];
  seedField();
  lastResetT = now;
  resetInterval = 100000 + Math.random()*50000;
  flash();
}

var lastT = 0;
function frame(now){
  if(!lastT) lastT = now;
  var dt = Math.min(50, now-lastT);
  lastT = now;
  time += dt/1000;

  var tau = 0.565 + 0.215*(0.5 + 0.5*Math.sin(time*0.045));
  var omega = 1/tau;
  var u0cur = 0.075 + 0.025*(0.5 + 0.5*Math.sin(time*0.037 + 1.3));

  rasterizeObstacles();
  for(var s=0; s<STEPS_PER_FRAME; s++){ step(omega, u0cur, time); }
  renderToBuffer();

  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.filter = 'none';
  ctx.drawImage(offCanvas, 0, 0, nx, ny, 0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.3;
  try { ctx.filter = 'blur(12px)'; } catch(e){}
  ctx.drawImage(offCanvas, 0, 0, nx, ny, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  if(now - lastResetT > resetInterval) autoReset(now);

  requestAnimationFrame(frame);
}

resizeCanvas();
updateRect();
requestAnimationFrame(frame);
setTimeout(function(){ caption.classList.add('visible'); }, 1500);
setTimeout(function(){ caption.classList.remove('visible'); }, 9000);
})();
</script>
</body>
</html>
