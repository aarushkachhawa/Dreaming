<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Drift</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07080b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud {
    position:fixed; top:14px; left:16px; color:#fff1c9; font-family:'Courier New', monospace;
    font-size:13px; line-height:1.55; text-shadow:0 0 6px rgba(255,200,90,0.4);
    pointer-events:none; user-select:none;
  }
  #hint {
    position:fixed; bottom:14px; left:16px; color:#6b6a5c; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; nudge the divergence angle&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; snap to the golden angle&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";

// Phyllotaxis: seed n sits at angle n*theta and radius c*sqrt(n). At the
// golden angle (137.5077...) the seeds pack evenly and Fibonacci spirals
// appear. Nudge theta a hair either way and the packing shatters into
// rays, then re-forms into other spiral counts at other rational angles.
// theta drifts slowly on its own, passing through these crystallisations.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const GOLD = Math.PI*(3-Math.sqrt(5));   // golden angle, radians
const N = 2600;
let cw=0, ch=0, dpr=1, t=0, paused=false;
let offset = 0.0, target = null;   // extra divergence, in degrees
let mouseX = null;

function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  cw = canvas.width = Math.floor(innerWidth*dpr);
  ch = canvas.height = Math.floor(innerHeight*dpr);
}
addEventListener('resize', resize); resize();

function render(){
  ctx.fillStyle = '#07080b'; ctx.fillRect(0,0,cw,ch);
  const cx = cw/2, cy = ch/2, R = Math.min(cw,ch)*0.46;
  const c = R/Math.sqrt(N);
  // slow autonomous drift + user nudge; angle in degrees away from gold
  const auto = 2.2*Math.sin(t*0.05) + 0.6*Math.sin(t*0.131+1);
  const dev = auto + offset;
  const theta = GOLD + dev*Math.PI/180;
  const spin = t*0.02;
  ctx.globalCompositeOperation = 'lighter';
  for (let n=1;n<=N;n++){
    const a = n*theta + spin;
    const r = c*Math.sqrt(n);
    const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
    const f = n/N;
    const size = (0.6 + 2.6*f) * dpr;
    const hue = 42 - f*40 + 200*Math.max(0, f-0.75)*0.0 + Math.sin(n*0.01+t*0.2)*8;
    ctx.fillStyle = 'hsla('+hue+',90%,'+(48+22*f)+'%,'+(0.35+0.5*f)+')';
    ctx.beginPath(); ctx.arc(x,y,size,0,6.2832); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  hud.innerHTML = 'golden drift<br><span style="color:#ffd37a">divergence '+
    (137.5078+dev).toFixed(3)+'&deg;</span><br>off gold '+(dev>=0?'+':'')+dev.toFixed(3)+'&deg;';
}

function loop(){
  if (!paused){
    t += 1;
    if (target !== null){
      offset += (target-offset)*0.06;
      if (Math.abs(target-offset) < 0.001){ target = null; }
    }
  }
  render();
  requestAnimationFrame(loop);
}

addEventListener('mousemove', e=>{
  if (mouseX !== null){
    // horizontal motion turns the dial in tiny steps
    offset += (e.clientX-mouseX)*0.004;
    target = null;
  }
  mouseX = e.clientX;
});
canvas.addEventListener('click', ()=>{ target = -2.2*Math.sin(t*0.05)-0.6*Math.sin(t*0.131+1); });
addEventListener('keydown', e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } });
loop();
})();
</script>
</body>
</html>
