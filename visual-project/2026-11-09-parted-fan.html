<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parted Fan</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07060b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6dcec; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(0,0,0,0.8); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#cdc0d6; opacity:.55; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; text-shadow:0 0 6px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move cursor left or right &mdash; widen or narrow the first difference&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; release a new fan&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Parted fan. Three hundred double pendulums are released from almost the same pose; the first differs from
// the last by a hair. For a few seconds they swing as one bright blade. Then chaos pries them apart and the
// blade unravels into a spectrum. Each bob's end is painted as a glowing point; the hue is its birth order.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), hud=document.getElementById('hud');
const TAU=Math.PI*2, N=300;
let W=0,H=0,paused=false,spread=1e-3,tspread=1e-3,P=[],t=0,fans=0,sep=0;
const g=9.81,L1=1,L2=1,m1=1,m2=1;
function deriv(s){
  const a1=s[0],a2=s[1],w1=s[2],w2=s[3],d=a1-a2,sd=Math.sin(d),cd=Math.cos(d);
  const den=2*m1+m2-m2*Math.cos(2*d);
  const f1=(-g*(2*m1+m2)*Math.sin(a1)-m2*g*Math.sin(a1-2*a2)-2*sd*m2*(w2*w2*L2+w1*w1*L1*cd))/(L1*den);
  const f2=(2*sd*(w1*w1*L1*(m1+m2)+g*(m1+m2)*Math.cos(a1)+w2*w2*L2*m2*cd))/(L2*den);
  return [w1,w2,f1,f2];
}
function rk4(p,h){
  const s=p.s,k1=deriv(s);
  const s2=s.map((v,i)=>v+k1[i]*h/2),k2=deriv(s2);
  const s3=s.map((v,i)=>v+k2[i]*h/2),k3=deriv(s3);
  const s4=s.map((v,i)=>v+k3[i]*h),k4=deriv(s4);
  for(let i=0;i<4;i++)s[i]+=h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]);
}
function tip(s,sc,cx,cy){
  const x1=Math.sin(s[0])*L1,y1=Math.cos(s[0])*L1;
  return [cx+(x1+Math.sin(s[1])*L2)*sc, cy+(y1+Math.cos(s[1])*L2)*sc];
}
function release(){
  fans++; P=[]; t=0;
  const a1=1.6+Math.random()*1.4, a2=1.2+Math.random()*1.8;
  for(let i=0;i<N;i++){
    const f=i/(N-1)-0.5;
    P.push({s:[a1+f*spread,a2,0,0],px:0,py:0,hue:i/(N-1)*300+190});
  }
  clear();
}
function clear(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='#07060b';ctx.fillRect(0,0,W,H);}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  release();
}
function frame(){
  if(!paused){
    const sc=Math.min(W,H)*0.23, cx=W/2, cy=H*0.5;
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(7,6,11,0.06)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';
    const lw=Math.max(1,Math.min(W,H)*0.0022);
    let mx=0,my=0,cnt=0,pts=[];
    for(const p of P){
      for(let i=0;i<4;i++)rk4(p,1/240);
      const q=tip(p.s,sc,cx,cy);
      if(p.px){
        ctx.strokeStyle='hsla('+p.hue+',90%,60%,0.30)'; ctx.lineWidth=lw;
        ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(q[0],q[1]); ctx.stroke();
      }
      p.px=q[0]; p.py=q[1]; mx+=q[0]; my+=q[1]; cnt++; pts.push(q);
    }
    mx/=cnt; my/=cnt;
    let v=0; for(const q of pts)v+=Math.hypot(q[0]-mx,q[1]-my);
    sep=v/cnt/sc;
    // faint pivot and the first and last arms, so the eye sees the "same" start
    ctx.fillStyle='rgba(235,225,245,0.5)'; ctx.beginPath(); ctx.arc(cx,cy,lw*2,0,TAU); ctx.fill();
    for(const p of [P[0],P[N-1]]){
      const x1=cx+Math.sin(p.s[0])*L1*sc,y1=cy+Math.cos(p.s[0])*L1*sc,q=tip(p.s,sc,cx,cy);
      ctx.strokeStyle='rgba(240,230,250,0.10)'; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x1,y1); ctx.lineTo(q[0],q[1]); ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
    t+=1/60;
    if(t>90)release();
  }
  hud.innerHTML='PARTED FAN<br>initial difference '+spread.toExponential(1)+' rad<br>pendulums '+N+'<br>time '+t.toFixed(1)+' s<br>spread '+sep.toFixed(3)+'<br>fan #'+fans;
  requestAnimationFrame(frame);
}
function setSpread(x){spread=Math.pow(10,-5+3.5*(x/innerWidth));}
addEventListener('mousemove',e=>setSpread(e.clientX));
addEventListener('touchmove',e=>setSpread(e.touches[0].clientX),{passive:true});
addEventListener('click',release);
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
spread=1e-3; setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
