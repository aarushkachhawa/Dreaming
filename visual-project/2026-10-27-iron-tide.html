<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Tide</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07070a; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#d8d6e0; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(160,170,220,0.3); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#585668; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; a magnet follows the cursor&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; re-pole the magnets&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Ferrofluid. A film of magnetic liquid sits on a hex lattice of sites. Each site feels the
// field of a few wandering magnets (softened point poles, some north, some south) and
// rises into a spike as the field strengthens, saturating so strong places stay crisp.
// A spike leans along the field direction, and its glint sits on the side facing the light,
// so the liquid reads as a wet black relief that breathes as the magnets drift. Hue marks
// the polarity of the nearest pole; the film is otherwise nearly colourless.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const PAL=[210,285,30,160];
let W=0,H=0,t=0,paused=false,pi=0,seed=1,mouse=null,lastMove=-99,mx=0.5,my=0.5;
let mags=[],sites=[],cell=14,flip=1;
function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }
function build(){
  mags=[];
  const n=3+Math.floor(rnd()*3);
  for (let i=0;i<n;i++) mags.push({
    q:(i%2?-1:1)*(0.7+0.6*rnd()),
    a:rnd()*6.28, fx:0.05+0.12*rnd(), fy:0.05+0.12*rnd(),
    rx:0.12+0.28*rnd(), ry:0.1+0.25*rnd(), cx:0.5+(rnd()-0.5)*0.3, cy:0.5+(rnd()-0.5)*0.3
  });
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  cell=Math.max(9*dpr,Math.min(W,H)/62);
  sites=[];
  const dy=cell*0.866;
  for (let r=0,y=cell/2;y<H+cell;r++,y+=dy)
    for (let x=(r%2?cell/2:0);x<W+cell;x+=cell) sites.push(x,y);
}
function pos(m){ return [m.cx+m.rx*Math.sin(t*m.fx+m.a), m.cy+m.ry*Math.cos(t*m.fy*1.3+m.a*1.7)]; }
function frame(){
  if (!paused) t+=1/60;
  if (mouse && t-lastMove<5){ mx+=(mouse.x/innerWidth-mx)*0.12; my+=(mouse.y/innerHeight-my)*0.12; }
  else { mx+=(0.5+0.35*Math.sin(t*0.21)-mx)*0.02; my+=(0.5+0.3*Math.cos(t*0.17)-my)*0.02; }
  ctx.fillStyle='#07070a'; ctx.fillRect(0,0,W,H);
  const P=[];
  for (const m of mags){ const p=pos(m); P.push(p[0]*W,p[1]*H,m.q*flip); }
  P.push(mx*W,my*H,-1.1*flip);
  const S=Math.min(W,H), soft=S*0.07;
  const base=PAL[pi];
  for (let i=0;i<sites.length;i+=2){
    const x=sites[i], y=sites[i+1];
    let bx=0,by=0,best=1e9,bq=1;
    for (let j=0;j<P.length;j+=3){
      const dx=x-P[j], dy=y-P[j+1], d2=dx*dx+dy*dy+soft*soft;
      const f=P[j+2]*soft/(d2*Math.sqrt(d2))*S*0.35;
      bx+=dx*f; by+=dy*f;
      if (d2<best){ best=d2; bq=P[j+2]; }
    }
    const m=Math.sqrt(bx*bx+by*by);
    const h=1-Math.exp(-m*1.3);
    if (h<0.02) continue;
    const r=cell*(0.12+0.5*h), ux=bx/(m+1e-6), uy=by/(m+1e-6);
    const hue=(base+(bq>0?0:70))%360;
    // body of the spike, leaning along the field
    ctx.fillStyle='hsl('+hue+',30%,'+(4+7*h)+'%)';
    ctx.beginPath(); ctx.arc(x+ux*r*0.25,y+uy*r*0.25,r,0,6.2832); ctx.fill();
    // rim light on the side away from the lamp (upper left)
    ctx.fillStyle='hsla('+hue+',55%,'+(30+35*h)+'%,'+(0.2+0.5*h)+')';
    ctx.beginPath(); ctx.arc(x+ux*r*0.25+r*0.34,y+uy*r*0.25+r*0.34,r*0.55,0,6.2832); ctx.fill();
    // wet glint
    ctx.fillStyle='rgba(235,240,255,'+(0.15+0.7*h*h)+')';
    ctx.beginPath(); ctx.arc(x+ux*r*0.25-r*0.3,y+uy*r*0.25-r*0.32,r*0.17,0,6.2832); ctx.fill();
  }
  hud.innerHTML='IRON TIDE<br>magnets: '+(mags.length+1)+'<br>sites: '+(sites.length/2).toLocaleString();
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{mouse={x:e.clientX,y:e.clientY};lastMove=t;});
addEventListener('touchmove',e=>{const p=e.touches[0];mouse={x:p.clientX,y:p.clientY};lastMove=t;},{passive:true});
addEventListener('click',()=>{ seed=Math.floor(Math.random()*2e9)+1; pi=(pi+1)%PAL.length; flip=1; build(); });
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
build(); setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
