<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink Weather — Night 9</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #03040a;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Ink Weather &mdash; Night 9 &mdash; drag to stir, click to storm</div>
<script>
(() => {
  // A ninth technique, and the first that is a genuine fluid rather than a
  // stand-in for one: a real velocity field, solved on a grid the way
  // Jos Stam's "stable fluids" does it for real-time graphics — implicit
  // diffusion relaxed with Gauss-Seidel, semi-Lagrangian advection so the
  // whole thing stays stable at any time step, and a Helmholtz-Hodge
  // pressure projection after every step that scrubs the field back to
  // divergence-free (no fluid is being created or destroyed, only moved).
  // Three dye channels ride the velocity as passengers, advected but never
  // pushing back, so they paint whatever the flow is actually doing.
  // Semi-Lagrangian advection alone is famously diffusive — it wants to
  // smear every curl into fog within a few frames — so a vorticity
  // confinement pass measures the field's own spin each step and feeds a
  // little of it back in, which is the difference between "ink stirred
  // into water" and "ink stirred into wet cement". A phantom low-pressure
  // system wanders the canvas on its own, seeding weather so the piece
  // keeps roiling with nobody touching it; drag to add real currents and
  // paint color into them, click for a squall that blows the field open
  // from one point. The vorticity strength and the dye's hue both breathe
  // slowly over minutes, sliding the whole piece between calm sfumato
  // drift and sharp inky storms.
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    setupGrid();
  }

  // --- grid ---
  const TARGET_LONG = 116;
  let Nx, Ny, stride, size;
  let vx, vy, vxTmp, vyTmp, p, div, curl;
  let dyeR, dyeG, dyeB, dyeTmp;
  let offCanvas, offCtx, imgData, pix;

  function IX(i, j) { return i + stride * j; }

  function setupGrid() {
    if (W >= H) {
      Nx = TARGET_LONG;
      Ny = Math.max(24, Math.round(TARGET_LONG * (H / W)));
    } else {
      Ny = TARGET_LONG;
      Nx = Math.max(24, Math.round(TARGET_LONG * (W / H)));
    }
    stride = Nx + 2;
    size = stride * (Ny + 2);

    vx = new Float32Array(size);
    vy = new Float32Array(size);
    vxTmp = new Float32Array(size);
    vyTmp = new Float32Array(size);
    p = new Float32Array(size);
    div = new Float32Array(size);
    curl = new Float32Array(size);
    dyeR = new Float32Array(size);
    dyeG = new Float32Array(size);
    dyeB = new Float32Array(size);
    dyeTmp = new Float32Array(size);

    offCanvas = document.createElement('canvas');
    offCanvas.width = Nx;
    offCanvas.height = Ny;
    offCtx = offCanvas.getContext('2d');
    imgData = offCtx.createImageData(Nx, Ny);
    pix = imgData.data;
    for (let i = 3; i < pix.length; i += 4) pix[i] = 255;
  }

  function setBnd(b, x) {
    for (let j = 1; j <= Ny; j++) {
      x[IX(0, j)] = b === 1 ? -x[IX(1, j)] : x[IX(1, j)];
      x[IX(Nx + 1, j)] = b === 1 ? -x[IX(Nx, j)] : x[IX(Nx, j)];
    }
    for (let i = 1; i <= Nx; i++) {
      x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
      x[IX(i, Ny + 1)] = b === 2 ? -x[IX(i, Ny)] : x[IX(i, Ny)];
    }
    x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
    x[IX(0, Ny + 1)] = 0.5 * (x[IX(1, Ny + 1)] + x[IX(0, Ny)]);
    x[IX(Nx + 1, 0)] = 0.5 * (x[IX(Nx, 0)] + x[IX(Nx + 1, 1)]);
    x[IX(Nx + 1, Ny + 1)] = 0.5 * (x[IX(Nx, Ny + 1)] + x[IX(Nx + 1, Ny)]);
  }

  function linSolve(b, x, x0, a, c, iters) {
    const cRecip = 1 / c;
    for (let k = 0; k < iters; k++) {
      for (let j = 1; j <= Ny; j++) {
        let idx = IX(1, j);
        for (let i = 1; i <= Nx; i++, idx++) {
          x[idx] = (x0[idx] + a * (x[idx - 1] + x[idx + 1] + x[idx - stride] + x[idx + stride])) * cRecip;
        }
      }
      setBnd(b, x);
    }
  }

  function diffuse(b, x, x0, diffRate, dt, iters) {
    const a = dt * diffRate * Nx * Ny;
    x0.set(x);
    linSolve(b, x, x0, a, 1 + 4 * a, iters);
  }

  function advect(b, d, d0, velX, velY, dt) {
    const dtx = dt * Nx, dty = dt * Ny;
    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++) {
        let x = i - dtx * velX[idx];
        let y = j - dty * velY[idx];
        if (x < 0.5) x = 0.5; else if (x > Nx + 0.5) x = Nx + 0.5;
        if (y < 0.5) y = 0.5; else if (y > Ny + 0.5) y = Ny + 0.5;
        const i0 = x | 0, i1 = i0 + 1;
        const j0 = y | 0, j1 = j0 + 1;
        const s1 = x - i0, s0 = 1 - s1;
        const t1 = y - j0, t0 = 1 - t1;
        d[idx] =
          s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
          s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
      }
    }
    setBnd(b, d);
  }

  function project(velX, velY, pOut, divOut) {
    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++) {
        divOut[idx] = -0.5 * (
          (velX[idx + 1] - velX[idx - 1]) / Nx +
          (velY[idx + stride] - velY[idx - stride]) / Ny
        );
        pOut[idx] = 0;
      }
    }
    setBnd(0, divOut);
    setBnd(0, pOut);
    linSolve(0, pOut, divOut, 1, 4, 18);

    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++) {
        velX[idx] -= 0.5 * (pOut[idx + 1] - pOut[idx - 1]) * Nx;
        velY[idx] -= 0.5 * (pOut[idx + stride] - pOut[idx - stride]) * Ny;
      }
    }
    setBnd(1, velX);
    setBnd(2, velY);
  }

  let vortEps = 0.0022;

  function vorticityConfinement(dt) {
    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++) {
        curl[idx] =
          (vy[idx + 1] - vy[idx - 1]) * 0.5 * Nx -
          (vx[idx + stride] - vx[idx - stride]) * 0.5 * Ny;
      }
    }
    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++) {
        const dx = (Math.abs(curl[idx + 1]) - Math.abs(curl[idx - 1])) * 0.5;
        const dy = (Math.abs(curl[idx + stride]) - Math.abs(curl[idx - stride])) * 0.5;
        const len = Math.sqrt(dx * dx + dy * dy) + 1e-5;
        const nx = dx / len, ny = dy / len;
        const w = curl[idx];
        vx[idx] += vortEps * ny * w * dt;
        vy[idx] -= vortEps * nx * w * dt;
      }
    }
  }

  function velStep(dt) {
    vorticityConfinement(dt);
    diffuse(1, vx, vxTmp, 0.000006, dt, 3);
    diffuse(2, vy, vyTmp, 0.000006, dt, 3);
    project(vx, vy, p, div);
    vxTmp.set(vx);
    vyTmp.set(vy);
    advect(1, vx, vxTmp, vxTmp, vyTmp, dt);
    advect(2, vy, vyTmp, vxTmp, vyTmp, dt);
    project(vx, vy, p, div);
  }

  function densStep(d, dt) {
    diffuse(0, d, dyeTmp, 0.00003, dt, 2);
    dyeTmp.set(d);
    advect(0, d, dyeTmp, vx, vy, dt);
  }

  function addVelocity(gx, gy, amtX, amtY) {
    const i = gx | 0, j = gy | 0;
    if (i < 1 || i > Nx || j < 1 || j > Ny) return;
    vx[IX(i, j)] += amtX;
    vy[IX(i, j)] += amtY;
  }

  function addDye(gx, gy, r, g, b, radius, strength) {
    const i0 = Math.max(1, (gx - radius) | 0), i1 = Math.min(Nx, (gx + radius) | 0);
    const j0 = Math.max(1, (gy - radius) | 0), j1 = Math.min(Ny, (gy + radius) | 0);
    const r2 = radius * radius;
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const dx = i - gx, dy = j - gy;
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const k = strength * (1 - d2 / r2);
        const idx = IX(i, j);
        dyeR[idx] += r * k;
        dyeG[idx] += g * k;
        dyeB[idx] += b * k;
      }
    }
  }

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return [r + m, g + m, b + m];
  }

  // --- input: drag stirs currents and paints, click storms ---
  const pointer = { x: -9999, y: -9999, px: -9999, py: -9999, active: false, down: false };

  function toGrid(clientX, clientY) {
    return [1 + (clientX / W) * Nx, 1 + (clientY / H) * Ny];
  }

  window.addEventListener('pointermove', (e) => {
    pointer.px = pointer.x >= 0 ? pointer.x : e.clientX;
    pointer.py = pointer.y >= 0 ? pointer.y : e.clientY;
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });
  window.addEventListener('pointerleave', () => (pointer.active = false));
  window.addEventListener('pointerdown', (e) => {
    pointer.down = true;
    storm(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', () => (pointer.down = false));

  let stormHue = Math.random() * 360;
  function storm(cx, cy) {
    const [gx, gy] = toGrid(cx, cy);
    stormHue += 95 + Math.random() * 60;
    const [r, g, b] = hsl(stormHue, 0.75, 0.58);
    const RINGS = 26;
    for (let k = 0; k < RINGS; k++) {
      const a = (k / RINGS) * Math.PI * 2;
      addVelocity(gx + Math.cos(a) * 1.5, gy + Math.sin(a) * 1.5, Math.cos(a) * 7, Math.sin(a) * 7);
    }
    addDye(gx, gy, r, g, b, 5, 1.0);
  }

  // --- phantom weather system, wanders and seeds on its own ---
  let phantom = { x: 0.5, y: 0.5, hue: Math.random() * 360 };

  function driveInput(dt, t) {
    if (pointer.active) {
      const [gx, gy] = toGrid(pointer.x, pointer.y);
      const dx = pointer.x - pointer.px, dy = pointer.y - pointer.py;
      const speed = Math.hypot(dx, dy);
      if (speed > 0.15) {
        addVelocity(gx, gy, dx * 0.9, dy * 0.9);
        const hue = (t * 0.01 + speed * 2) % 360;
        const [r, g, b] = hsl(hue, 0.7, 0.56);
        addDye(gx, gy, r, g, b, 3.4, Math.min(1.0, 0.22 + speed * 0.035));
      }
      pointer.px = pointer.x;
      pointer.py = pointer.y;
    }

    phantom.x = 0.5 + Math.sin(t * 0.00013) * 0.36 + Math.sin(t * 0.00037 + 1.7) * 0.08;
    phantom.y = 0.5 + Math.cos(t * 0.00009 + 2.1) * 0.32 + Math.cos(t * 0.00029 + 0.4) * 0.08;
    phantom.hue += 0.06;
    const gx = 1 + phantom.x * Nx, gy = 1 + phantom.y * Ny;
    const swirl = Math.sin(t * 0.0002) * 2.6;
    addVelocity(gx, gy, Math.cos(t * 0.0006) * 3.2 - swirl, Math.sin(t * 0.0006) * 3.2 + swirl);
    const [r, g, b] = hsl(phantom.hue, 0.62, 0.5);
    addDye(gx, gy, r, g, b, 3, 0.06);
  }

  let simTime = 0;

  function simulate(dt) {
    simTime += dt * 1000;
    const t = simTime;
    vortEps = 0.0016 + 0.0016 * (0.5 + 0.5 * Math.sin(t * 0.00006));

    driveInput(dt, t);
    velStep(dt);
    densStep(dyeR, dt);
    densStep(dyeG, dt);
    densStep(dyeB, dt);

    const fade = 1 - dt * 0.16;
    for (let k = 0; k < size; k++) {
      dyeR[k] *= fade;
      dyeG[k] *= fade;
      dyeB[k] *= fade;
    }
  }

  function render() {
    let o = 0;
    for (let j = 1; j <= Ny; j++) {
      let idx = IX(1, j);
      for (let i = 1; i <= Nx; i++, idx++, o += 4) {
        pix[o] = dyeR[idx] * 255 <= 0 ? 0 : dyeR[idx] * 255 >= 255 ? 255 : dyeR[idx] * 255;
        pix[o + 1] = dyeG[idx] * 255 <= 0 ? 0 : dyeG[idx] * 255 >= 255 ? 255 : dyeG[idx] * 255;
        pix[o + 2] = dyeB[idx] * 255 <= 0 ? 0 : dyeB[idx] * 255 >= 255 ? 255 : dyeB[idx] * 255;
      }
    }
    offCtx.putImageData(imgData, 0, 0);

    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(offCanvas, 0, 0, Nx, Ny, 0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3;
    const pad = Math.max(W, H) * 0.015;
    ctx.drawImage(offCanvas, 0, 0, Nx, Ny, -pad, -pad, W + pad * 2, H + pad * 2);
    ctx.restore();

    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let lastFrameTime = null;
  function frame(now) {
    if (lastFrameTime === null) lastFrameTime = now;
    let dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;
    if (dt > 1 / 20) dt = 1 / 20;
    if (dt <= 0) dt = 1 / 60;

    simulate(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
