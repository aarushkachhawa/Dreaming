<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folding Thread</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#050508; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6e2f0; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(150,170,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#585668; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; push the thread aside&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; change the curve&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// One unbroken thread that visits every cell of a square grid. The Hilbert curve is built by
// repeated subdivision: every vertex of order n splits into four vertices of order n+1.
// Here the thread is breathing between orders: each new vertex starts on top of its parent
// and unfolds into place, so the line keeps doubling its detail and then folds back into
// a single stroke. Hue follows the length of the thread, drawn additively so the places
// where it crowds together glow. The Moore variant closes the same idea into a loop.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const MAXO=7, KINDS=['hilbert','moore'], PAL=[0,140,260,330];
let W=0,H=0,t=0,paused=false,ki=0,pi=0,mouse=null,lastMove=-99,mx=0.5,my=0.5;
function d2xy(n,d){ // index along a Hilbert curve of side n -> cell
  let x=0,y=0,tt=d;
  for (let s=1;s<n;s*=2){
    const rx=1&(tt>>1), ry=1&(tt^rx);
    if (ry===0){ if (rx===1){ x=s-1-x; y=s-1-y; } const q=x; x=y; y=q; }
    x+=s*rx; y+=s*ry; tt>>=2;
  }
  return [x,y];
}
const cache={};
function curve(kind,o){ // positions in 0..1 of every vertex of that order
  const key=kind+o; if (cache[key]) return cache[key];
  const n=1<<o, N=n*n, p=new Float32Array(N*2);
  if (kind==='hilbert'){
    for (let d=0;d<N;d++){ const c=d2xy(n,d); p[2*d]=(c[0]+0.5)/n; p[2*d+1]=(c[1]+0.5)/n; }
  } else { // four Hilbert curves of half the side, turned so the ends meet in a loop
    const h=n/2, M=h*h;
    for (let d=0;d<N;d++){
      const q=Math.floor(d/M), c=d2xy(h,d%M); let x, y;
      if (q<2){ x=h-1-c[1]; y=c[0]+q*h; }       // left pair, turned to climb
      else { x=c[1]+h; y=h-1-c[0]+(q===2?h:0); } // right pair, turned to descend
      p[2*d]=(x+0.5)/n; p[2*d+1]=(y+0.5)/n;
    }
  }
  return cache[key]=p;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  ctx.fillStyle='#050508'; ctx.fillRect(0,0,W,H);
}
function ease(f){ return f*f*(3-2*f); }
function frame(){
  if (!paused) t+=1/60;
  const kind=KINDS[ki];
  if (mouse && t-lastMove<5){ mx+=(mouse.x/innerWidth-mx)*0.1; my+=(mouse.y/innerHeight-my)*0.1; }
  else { mx+=(0.5+0.3*Math.sin(t*0.23)-mx)*0.02; my+=(0.5+0.3*Math.cos(t*0.19)-my)*0.02; }
  // continuous level between order 2 and MAXO
  const L=2+(MAXO-2)*(0.5-0.5*Math.cos(t*0.11));
  const k=Math.min(MAXO-1,Math.floor(L)), f=ease(L-k);
  const A=curve(kind,k+1), B=curve(kind,k), nv=A.length/2;
  const S=Math.min(W,H)*0.88, ox=(W-S)/2, oy=(H-S)/2;
  const rad=0.16+0.05*Math.sin(t*0.4), tw=t*0.3;
  // fade the previous frame so motion leaves a short comet trail
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(5,5,8,0.22)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.lineJoin='round'; ctx.lineCap='round';
  const CH=Math.min(160,nv), per=Math.ceil(nv/CH);
  const lw=Math.max(0.8,S/(1<<(k+1))*0.07);
  for (let pass=0;pass<2;pass++){
    ctx.lineWidth=pass===0?lw*3.2:lw;
    for (let c=0;c<CH;c++){
      const a=c*per, b=Math.min(nv-1,a+per); if (a>=nv) break;
      const hue=(PAL[pi]+360*a/nv+t*12)%360;
      ctx.strokeStyle=pass===0?'hsla('+hue+',90%,45%,0.07)':'hsla('+hue+',85%,'+(60+10*f)+'%,0.55)';
      ctx.beginPath();
      for (let j=a;j<=b;j++){
        const par=j>>2; // parent vertex on the coarser curve
        let x=B[2*par]+(A[2*j]-B[2*par])*f, y=B[2*par+1]+(A[2*j+1]-B[2*par+1])*f;
        // the cursor leans on the thread; the push swells where it is close
        const dx=x-mx, dy=y-my, r2=dx*dx+dy*dy, g=Math.exp(-r2/(rad*rad))*0.06;
        const wob=0.004*Math.sin(j*0.05+tw*3);
        x+=dx*g*6+wob; y+=dy*g*6+wob;
        const px=ox+x*S, py=oy+y*S;
        if (j===a) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation='source-over';
  hud.innerHTML='FOLDING THREAD<br>curve: '+kind+'<br>order: '+(k+f).toFixed(2)+'<br>vertices: '+nv.toLocaleString();
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{mouse={x:e.clientX,y:e.clientY};lastMove=t;});
addEventListener('touchmove',e=>{const p=e.touches[0];mouse={x:p.clientX,y:p.clientY};lastMove=t;},{passive:true});
addEventListener('click',()=>{ if (ki===1){ ki=0; pi=(pi+1)%PAL.length; } else ki=1; ctx.fillStyle='#050508'; ctx.fillRect(0,0,W,H); });
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
