<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singing Plate</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07060a; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e6dccb; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(255,200,120,0.3); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#5a5260; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; shake the plate harder&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; strike a new tone&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Singing plate. A square plate vibrating in a mixed mode (n,m) has displacement
//   f(x,y) = cos(n pi x) cos(m pi y) - cos(m pi x) cos(n pi y)
// Sand bounces off wherever the plate moves and rests where f = 0 (the nodal lines).
// Each grain jitters in proportion to |f| and so drifts, by chance alone, into stillness.
// The tone slowly glides between modes: the lines dissolve and the sand re-gathers.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const N=26000;
let W=0,H=0,S=0,ox=0,oy=0;
const gx=new Float32Array(N), gy=new Float32Array(N);
let n=2,m=5,n2=3,m2=7,mix=0,t=0,paused=false,shake=0.5,hue=35,count=1;
const PAIRS=[[1,2],[1,3],[2,3],[1,4],[2,5],[3,4],[3,5],[2,7],[4,5],[3,8],[5,6],[4,9],[6,7],[5,9]];
function pick(){ return PAIRS[Math.floor(Math.random()*PAIRS.length)]; }
function f(x,y,a,b){
  return Math.cos(a*Math.PI*x)*Math.cos(b*Math.PI*y)-Math.cos(b*Math.PI*x)*Math.cos(a*Math.PI*y);
}
function field(x,y){
  const e=mix*mix*(3-2*mix);
  return f(x,y,n,m)*(1-e)+f(x,y,n2,m2)*e;
}
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  W=canvas.width;H=canvas.height;
  S=Math.min(W,H)*0.9; ox=(W-S)/2; oy=(H-S)/2;
  ctx.fillStyle='#07060a'; ctx.fillRect(0,0,W,H);
}
function scatter(){ for(let i=0;i<N;i++){gx[i]=Math.random();gy[i]=Math.random();} }
function strike(){ n=n2;m=m2;[n2,m2]=pick(); mix=0; hue=(hue+37+Math.random()*60)%360; count++; }
function frame(){
  if(!paused){
    t+=1;
    mix+=0.0016;
    if(mix>=1) strike();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(7,6,10,0.22)'; ctx.fillRect(0,0,W,H);
    // faint plate
    ctx.fillStyle='rgba(30,24,34,0.35)'; ctx.fillRect(ox,oy,S,S);
    ctx.globalCompositeOperation='lighter';
    const sz=Math.max(1,W/1000);
    const amp=0.004+shake*0.016;
    for(let i=0;i<N;i++){
      let x=gx[i],y=gy[i];
      const a=Math.abs(field(x,y));
      const j=amp*Math.min(1,a*0.9);
      x+=(Math.random()-0.5)*2*j; y+=(Math.random()-0.5)*2*j;
      if(x<0)x=-x; else if(x>1)x=2-x;
      if(y<0)y=-y; else if(y>1)y=2-y;
      gx[i]=x;gy[i]=y;
      const rest=1-Math.min(1,a*3);
      const h=(hue+rest*40)%360;
      ctx.fillStyle='hsla('+h+',70%,'+(30+rest*38)+'%,'+(0.16+rest*0.5)+')';
      ctx.fillRect(ox+x*S,oy+y*S,sz,sz);
    }
  }
  hud.innerHTML='SINGING PLATE<br>mode ('+n+','+m+') &rarr; ('+n2+','+m2+') &middot; '+Math.round(mix*100)+'%<br>tone no. '+count;
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{shake=Math.min(1,Math.max(0,e.clientY/innerHeight));});
addEventListener('touchmove',e=>{shake=e.touches[0].clientY/innerHeight;},{passive:true});
addEventListener('click',()=>{strike();scatter();});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
[n,m]=pick();[n2,m2]=pick();scatter();setup();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
