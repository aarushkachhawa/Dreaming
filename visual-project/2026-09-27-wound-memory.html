<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var caption = document.getElementById('caption');
  var readout = document.getElementById('readout');

  // ---- trained model ---------------------------------------------------
  // A tiny neural cellular automaton (Mordvintsev, Niklasson, Randazzo &
  // Sabatier, "Growing Neural Cellular Automata", 2020). Every cell on a
  // 40x40 lattice carries a 16-number state: 4 visible channels (RGB +
  // alive-alpha) and 12 hidden ones nobody renders. Each step every cell
  // reads a fixed, hand-built perception of its 3x3 neighborhood -- its own
  // state, plus a Sobel x- and y-derivative of every channel, 48 numbers in
  // all -- and feeds that through the *same two small dense layers* to get
  // a proposed 16-number update. No layer here sees a channel by name or a
  // position on the grid; the identical weights are applied, cell by cell,
  // everywhere at once, so whatever shape emerges is entirely a property of
  // a local rule, not a plan drawn over the lattice. What is different from
  // every earlier automaton in this project (Life-like rules, SmoothLife,
  // Lenia, the cyclic and Langton automata) is where that local rule came
  // from: it was never hand-written. The two weight matrices below were
  // shaped entirely by gradient descent, run offline, against a single
  // loss -- how far a stochastic rollout from one lit pixel, after some
  // number of steps, sits from a target picture of a single curled petal -- backpropagated
  // through dozens of unrolled update steps the way a recurrent network is
  // trained through time. The rule that results is not a description of a
  // petal; it is closer to muscle memory for becoming one.
  var raw = JSON.parse(document.getElementById('weights-data').textContent);
  // The lattice the weights were trained on (40x40) only ever needed to hold
  // one petal. Nothing about the rule depends on lattice size -- it is
  // purely local and shift-invariant -- so a bigger lattice here just gives
  // a garden room to hold several petals without any of them growing into
  // the wall.
  var C = raw.C, HID = raw.HID, PERC = 3 * C;
  var N = 80;
  var MARGIN = 18;
  var W1 = new Float32Array(raw.W1.length * raw.W1[0].length);
  for (var i = 0; i < raw.W1.length; i++) for (var j = 0; j < raw.W1[0].length; j++) W1[i * HID + j] = raw.W1[i][j];
  var b1 = new Float32Array(raw.b1);
  var W2 = new Float32Array(raw.W2.length * raw.W2[0].length);
  for (var i = 0; i < raw.W2.length; i++) for (var j = 0; j < raw.W2[0].length; j++) W2[i * C + j] = raw.W2[i][j];
  var b2 = new Float32Array(raw.b2);

  var state = new Float32Array(N * N * C);
  var buf = new Float32Array(N * N * C);
  var perc = new Float32Array(N * N * PERC);
  var h1 = new Float32Array(HID);

  // The rule was trained against rollouts of 24-44 steps, never longer: past
  // that horizon it was never told what "done" looks like, and left to run
  // indefinitely it does not hold -- it drifts, then overgrows into noise,
  // the well-documented failure of a "growing"-only recipe with no
  // persistence phase to teach it to sit still once it arrives. So growth
  // here is not a live thing left running forever; it is given exactly the
  // window it was trained on, once per planting, and then it stops --
  // literally, per cell, by clock rather than by choice. activeUntil holds,
  // for every cell, the simulation step at which its own local motion is
  // permitted to end; each planting or wound extends that clock for the
  // cells it can reach and no others, so old growth elsewhere keeps
  // resting undisturbed. A wound gets the same treatment on a far shorter
  // clock: nobody ever showed this rule a damaged petal on purpose, so
  // whatever it does next is a side effect of a purely local update rather
  // than a rehearsed answer -- and what it does, most of the time, is pull
  // a torn hole most of the way back to itself within that short window
  // and then stop, satisfied or not.
  var GROW_STEPS = 40, MEND_STEPS = 10;
  var activeUntil = new Float64Array(N * N);
  var globalStep = 0;

  function idx(y, x, c) { return (y * N + x) * C + c; }

  function activate(cy, cx, radius, duration) {
    var r2 = radius * radius;
    for (var y = Math.max(0, cy - radius); y <= Math.min(N - 1, cy + radius); y++) {
      for (var x = Math.max(0, cx - radius); x <= Math.min(N - 1, cx + radius); x++) {
        var dy = y - cy, dx = x - cx;
        if (dy * dy + dx * dx <= r2) {
          var i = y * N + x;
          var until = globalStep + duration;
          if (until > activeUntil[i]) activeUntil[i] = until;
        }
      }
    }
  }

  function plant(cy, cx) {
    for (var c = 3; c < C; c++) state[idx(cy, cx, c)] = 1;
    activate(cy, cx, 20, GROW_STEPS);
  }

  function wound(cy, cx, r) {
    var r2 = r * r;
    for (var y = Math.max(0, cy - r); y <= Math.min(N - 1, cy + r); y++) {
      for (var x = Math.max(0, cx - r); x <= Math.min(N - 1, cx + r); x++) {
        var dy = y - cy, dx = x - cx;
        if (dy * dy + dx * dx <= r2) {
          var base = idx(y, x, 0);
          for (var c = 0; c < C; c++) state[base + c] = 0;
        }
      }
    }
    activate(cy, cx, r + 4, MEND_STEPS);
  }

  var stepCount = 0, bloomCount = 0;

  // A padded copy of state (a 1-cell zero border) turns every neighbor read
  // in the perception step into a plain array index instead of a
  // bounds-checked function call -- at an 80x80 lattice, the single biggest
  // cost in this loop. activeList collects only the cells still inside
  // their own clock (see activeUntil above), so the expensive dense layers
  // run on a handful of growing or healing cells rather than the whole,
  // mostly-frozen lattice every step. The alive mask still has to look past
  // an active cell's own edge into cells this step never touches, so it
  // reads a frozen neighbor's alpha straight from state (unchanged by
  // definition) and an active neighbor's from the buf this same pass just
  // computed for it -- the two together reconstruct the one synchronous
  // update every cell would have gotten if the whole lattice were still
  // live.
  var PW = N + 2;
  var padded = new Float32Array(PW * PW * C);
  var activeList = new Int32Array(N * N);
  var needed = new Uint8Array(N * N);

  function step() {
    padded.fill(0);
    for (var y = 0; y < N; y++) {
      var srcRow = (y * N) * C;
      var dstRow = ((y + 1) * PW + 1) * C;
      padded.set(state.subarray(srcRow, srcRow + N * C), dstRow);
    }

    var nActive = 0;
    for (var i0 = 0; i0 < N * N; i0++) {
      if (globalStep < activeUntil[i0]) activeList[nActive++] = i0;
    }

    // perception, only where it will actually be read: active cells and
    // their immediate neighbors
    needed.fill(0);
    for (var i = 0; i < nActive; i++) {
      var cell0 = activeList[i], cy = (cell0 / N) | 0, cx = cell0 % N;
      for (var dy = -1; dy <= 1; dy++) {
        for (var dx = -1; dx <= 1; dx++) {
          var yy = cy + dy, xx = cx + dx;
          if (yy >= 0 && yy < N && xx >= 0 && xx < N) needed[yy * N + xx] = 1;
        }
      }
    }

    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (!needed[y * N + x]) continue;
        var pBase = (y * N + x) * PERC;
        var p00 = (y * PW + x) * C, p01 = (y * PW + x + 1) * C, p02 = (y * PW + x + 2) * C;
        var p10 = ((y + 1) * PW + x) * C, p11 = ((y + 1) * PW + x + 1) * C, p12 = ((y + 1) * PW + x + 2) * C;
        var p20 = ((y + 2) * PW + x) * C, p21 = ((y + 2) * PW + x + 1) * C, p22 = ((y + 2) * PW + x + 2) * C;
        for (var c = 0; c < C; c++) {
          var sx = (-padded[p00 + c] + padded[p02 + c] - 2 * padded[p10 + c] + 2 * padded[p12 + c] - padded[p20 + c] + padded[p22 + c]) / 8;
          var sy = (-padded[p00 + c] - 2 * padded[p01 + c] - padded[p02 + c] + padded[p20 + c] + 2 * padded[p21 + c] + padded[p22 + c]) / 8;
          perc[pBase + c] = padded[p11 + c];
          perc[pBase + C + c] = sx;
          perc[pBase + 2 * C + c] = sy;
        }
      }
    }

    // pass A: dense layers, active cells only
    for (var i2 = 0; i2 < nActive; i2++) {
      var cell = activeList[i2];
      var pBase2 = cell * PERC;
      for (var h = 0; h < HID; h++) {
        var acc = b1[h];
        for (var k = 0; k < PERC; k++) acc += perc[pBase2 + k] * W1[k * HID + h];
        h1[h] = acc > 0 ? acc : 0;
      }
      var sBase = cell * C;
      var fire = Math.random() < 0.5 ? 1 : 0;
      for (var c2 = 0; c2 < C; c2++) {
        var acc2 = b2[c2];
        for (var h2 = 0; h2 < HID; h2++) acc2 += h1[h2] * W2[h2 * C + c2];
        buf[sBase + c2] = state[sBase + c2] + acc2 * fire;
      }
    }

    // pass B: alive mask + commit, active cells only
    for (var i3 = 0; i3 < nActive; i3++) {
      var cell2 = activeList[i3], y2 = (cell2 / N) | 0, x2 = cell2 % N;
      var m = 0;
      for (var dy2 = -1; dy2 <= 1 && !m; dy2++) {
        for (var dx2 = -1; dx2 <= 1; dx2++) {
          var yy2 = y2 + dy2, xx2 = x2 + dx2;
          if (yy2 < 0 || yy2 >= N || xx2 < 0 || xx2 >= N) continue;
          var ni = yy2 * N + xx2;
          var a = (globalStep < activeUntil[ni]) ? buf[ni * C + 3] : state[ni * C + 3];
          if (a > 0.1) { m = 1; break; }
        }
      }
      var sBase2 = cell2 * C;
      if (m) { for (var c3 = 0; c3 < C; c3++) state[sBase2 + c3] = buf[sBase2 + c3]; }
      else { for (var c4 = 0; c4 < C; c4++) state[sBase2 + c4] = 0; }
    }
    globalStep++;
    stepCount++;
  }

  // ---- rendering ---------------------------------------------------------
  var off = document.createElement('canvas');
  off.width = N; off.height = N;
  var offCtx = off.getContext('2d');
  var imgData = offCtx.createImageData(N, N);

  // The glow is a blur of the lattice, not of the final scaled-up picture --
  // a canvas blur filter's cost scales with the pixel count it runs over,
  // and that is a couple of orders of magnitude cheaper at NxN than at the
  // few-hundred-pixel-per-side final image, with no visible difference
  // once both are scaled up together.
  var glow = document.createElement('canvas');
  glow.width = N; glow.height = N;
  var glowCtx = glow.getContext('2d');

  var W = 0, H = 0, side = 0, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    W = Math.floor(window.innerWidth * dpr);
    H = Math.floor(window.innerHeight * dpr);
    canvas.width = W; canvas.height = H;
    side = Math.min(W, H) * 0.82;
    ox = (W - side) / 2;
    oy = (H - side) / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  function render() {
    var d = imgData.data;
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        var b = idx(y, x, 0);
        var o = (y * N + x) * 4;
        d[o] = Math.max(0, Math.min(255, state[b] * 255));
        d[o + 1] = Math.max(0, Math.min(255, state[b + 1] * 255));
        d[o + 2 ] = Math.max(0, Math.min(255, state[b + 2] * 255));
        d[o + 3] = Math.max(0, Math.min(255, state[b + 3] * 255));
      }
    }
    offCtx.putImageData(imgData, 0, 0);

    glowCtx.clearRect(0, 0, N, N);
    glowCtx.filter = 'blur(1.6px) saturate(1.3) brightness(1.25)';
    glowCtx.drawImage(off, 0, 0);
    glowCtx.filter = 'none';

    ctx.fillStyle = '#07080a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.65;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(glow, ox, oy, side, side);
    ctx.restore();

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.globalAlpha = 1;
    ctx.drawImage(off, ox, oy, side, side);
    ctx.restore();
  }

  // ---- input --------------------------------------------------------------
  function toGrid(px, py) {
    var gx = Math.floor(((px - ox) / side) * N);
    var gy = Math.floor(((py - oy) / side) * N);
    return { x: gx, y: gy };
  }

  var dragging = false, moved = false, downPos = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var sx = W / r.width, sy = H / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; moved = false;
    downPos = pos(e);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pos(e);
    if (Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y) > 6) moved = true;
    if (moved) {
      var g = toGrid(p.x, p.y);
      if (g.x >= 0 && g.x < N && g.y >= 0 && g.y < N) wound(g.y, g.x, 3);
    }
  });
  window.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      var g = toGrid(downPos.x, downPos.y);
      if (g.x >= MARGIN && g.x < N - MARGIN && g.y >= MARGIN && g.y < N - MARGIN) {
        plant(g.y, g.x);
        bloomCount++;
      }
    }
  });

  // seed the first bloom at center
  plant(Math.floor(N / 2), Math.floor(N / 2));
  bloomCount = 1;

  var lastAuto = performance.now();
  function maybeAutoSeed(now) {
    if (now - lastAuto < 11000) return;
    var alive = 0;
    for (var i = 0; i < N * N; i++) if (state[i * C + 3] > 0.1) alive++;
    if (alive < N * N * 0.55) {
      var gy = MARGIN + Math.floor(Math.random() * (N - 2 * MARGIN));
      var gx = MARGIN + Math.floor(Math.random() * (N - 2 * MARGIN));
      plant(gy, gx);
      bloomCount++;
      lastAuto = now;
    } else {
      lastAuto = now - 6000;
    }
  }

  var frame = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    frame++;
    if (frame % 3 === 0) {
      step();
      maybeAutoSeed(now);
    }
    render();

    var aliveFrac = 0;
    for (var i = 0; i < N * N; i++) if (state[i * C + 3] > 0.1) aliveFrac++;
    aliveFrac = Math.round((aliveFrac / (N * N)) * 100);
    readout.innerHTML =
      'STEP <b>' + stepCount + '</b><br>' +
      'BLOOMS PLANTED <b>' + bloomCount + '</b><br>' +
      'COVERAGE <b>' + aliveFrac + '%</b>';
  }
  requestAnimationFrame(loop);

  setTimeout(function () { caption.className = 'visible'; }, 700);
})();
</script>
</body>
</html>
