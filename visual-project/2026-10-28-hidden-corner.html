<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden Corner</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#06070b; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#d6dae4; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(150,180,230,0.3); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#555a68; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">move &mdash; steer the 4D rotation&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; new palette and spin&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Tesseract. The 16 corners of a four-dimensional cube are rotated in all six coordinate
// planes at once, then projected twice: perspective from 4D into 3D, perspective from 3D
// onto the screen. The 32 edges are drawn as glowing strokes with additive blending, tinted
// by their depth along the fourth axis (w), so the inner cube seems to turn itself inside
// out through the outer one. Trails are left to fade, which draws the motion as light.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const PAL=[[200,320],[30,190],[130,280],[350,60]];
let W=0,H=0,t=0,paused=false,pi=0,mx=0.5,my=0.5,mouse=null,lastMove=-99;
let speed=[0.31,0.23,0.17,0.27,0.13,0.37];
const V=[], E=[];
for (let i=0;i<16;i++) V.push([i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);
for (let i=0;i<16;i++) for (let b=0;b<4;b++){ const j=i^(1<<b); if (i<j) E.push([i,j]); }
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr; W=canvas.width; H=canvas.height;
  ctx.fillStyle='#06070b'; ctx.fillRect(0,0,W,H);
}
function rot(p,a,b,th){
  const c=Math.cos(th), s=Math.sin(th), x=p[a], y=p[b];
  p[a]=x*c-y*s; p[b]=x*s+y*c;
}
function frame(){
  if (!paused) t+=1/60;
  if (mouse && t-lastMove<5){ mx+=(mouse.x/innerWidth-mx)*0.08; my+=(mouse.y/innerHeight-my)*0.08; }
  else { mx+=(0.5+0.3*Math.sin(t*0.13)-mx)*0.02; my+=(0.5+0.3*Math.cos(t*0.11)-my)*0.02; }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(6,7,11,0.16)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const S=Math.min(W,H), cx=W/2, cy=H/2;
  // planes: xy, xz, yz are ordinary spins; xw, yw, zw are the ones with no everyday analogue
  const k=0.6+1.6*mx, w4=0.4+1.6*my;
  const P=[], Wd=[];
  for (const v of V){
    const p=v.slice();
    rot(p,0,1,t*speed[0]); rot(p,0,2,t*speed[1]); rot(p,1,2,t*speed[2]);
    rot(p,0,3,t*speed[3]*k); rot(p,1,3,t*speed[4]*k); rot(p,2,3,t*speed[5]*k);
    const f4=1/(3.2-p[3]*w4*0.8);
    const q=[p[0]*f4*3,p[1]*f4*3,p[2]*f4*3];
    const f3=1/(4.2-q[2]);
    P.push(cx+q[0]*f3*S*1.25, cy+q[1]*f3*S*1.25);
    Wd.push(p[3]);
  }
  const h0=PAL[pi][0], h1=PAL[pi][1];
  ctx.lineCap='round';
  for (const e of E){
    const a=e[0], b=e[1], w=(Wd[a]+Wd[b])/4+0.5;   // 0..1 across the fourth axis
    const hue=h0+(h1-h0)*w;
    ctx.strokeStyle='hsla('+hue+',80%,'+(40+25*w)+'%,0.55)';
    ctx.lineWidth=(1.2+2.2*w)*(W/1000+0.6);
    ctx.beginPath(); ctx.moveTo(P[a*2],P[a*2+1]); ctx.lineTo(P[b*2],P[b*2+1]); ctx.stroke();
  }
  for (let i=0;i<16;i++){
    const w=Wd[i]/2+0.5, r=(2+5*w)*(W/1000+0.6);
    ctx.fillStyle='hsla('+(h0+(h1-h0)*w)+',90%,80%,0.8)';
    ctx.beginPath(); ctx.arc(P[i*2],P[i*2+1],r,0,6.2832); ctx.fill();
  }
  hud.innerHTML='HIDDEN CORNER<br>vertices: 16 &nbsp; edges: 32<br>4D spin: '+k.toFixed(2)+'&times;';
  requestAnimationFrame(frame);
}
addEventListener('mousemove',e=>{mouse={x:e.clientX,y:e.clientY};lastMove=t;});
addEventListener('touchmove',e=>{const p=e.touches[0];mouse={x:p.clientX,y:p.clientY};lastMove=t;},{passive:true});
addEventListener('click',()=>{
  pi=(pi+1)%PAL.length;
  speed=speed.map(()=>0.1+0.3*Math.random());
  ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#06070b'; ctx.fillRect(0,0,W,H);
});
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault();}});
addEventListener('resize',setup);
setup(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
