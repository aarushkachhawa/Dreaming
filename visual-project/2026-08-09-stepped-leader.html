<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stepped Leader — Night 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060b;
    overflow: hidden;
    cursor: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #caption {
    position: fixed;
    left: 24px;
    bottom: 20px;
    font: 300 12px/1.5 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    color: rgba(255, 255, 255, 0);
    text-transform: uppercase;
    pointer-events: none;
    transition: color 3s ease;
  }
  #caption.visible {
    color: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="caption">Stepped Leader &mdash; Night 10 &mdash; move to guide it, click to draw it toward you</div>
<script>
(() => {
  // A tenth technique: diffusion-limited aggregation standing in for a
  // dielectric breakdown. Real lightning finds its path this way — a
  // stepped leader has no plan for where it's going until it gets there,
  // forking wherever the field happens to be weakest. Here hundreds of
  // independent random walkers drift near a single charged seed at the
  // screen's center; the instant a walker brushes an existing branch it
  // freezes there and becomes part of it, one step further out. No walker
  // steers and no branch is designed — the fractal, forked shape is just
  // what a great many blind walks look like once they can only ever join
  // what already exists. A fractal cluster's reach grows far slower than
  // its point count — the same screening that makes DLA look like this
  // also means each further inch outward costs more than the last — so
  // rather than chase full-screen coverage the leader is let run for
  // about forty seconds, long enough to sprawl into a dense, many-armed
  // tree, and then the whole thing fires: a return-stroke flash sweeps
  // through, the frame burns white, fades to black, and a fresh leader
  // starts over from the seed with a new color. The cursor is a weak
  // attractor the whole time, gently curving nearby growth toward it;
  // a click drops a strong ground charge that pulls the nearest branch
  // in fast, like drawing a strike to where you're standing.
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const ink = document.createElement('canvas');
  const inkCtx = ink.getContext('2d');

  let W, H, DPR, cx, cy;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ink.width = W * DPR;
    ink.height = H * DPR;
    inkCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    reset();
  }

  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return `rgb(${(r + m) * 255 | 0},${(g + m) * 255 | 0},${(b + m) * 255 | 0})`;
  }

  // --- aggregate: points join by proximity, each remembering its parent ---
  const MAX_POINTS = 20000;
  let px, py, pGen, pParent;
  let count, stickRadius, cellSize, grid, maxRadius, baseHue;

  function cellKey(x, y) {
    return ((x / cellSize) | 0) + ',' + ((y / cellSize) | 0);
  }

  function insertPoint(x, y, gen, parent) {
    const i = count++;
    px[i] = x; py[i] = y; pGen[i] = gen; pParent[i] = parent;
    const key = cellKey(x, y);
    (grid[key] || (grid[key] = [])).push(i);
    const d = Math.hypot(x - cx, y - cy);
    if (d > maxRadius) maxRadius = d;
    return i;
  }

  function findStick(x, y) {
    const gx = (x / cellSize) | 0, gy = (y / cellSize) | 0;
    let best = -1, bestD = stickRadius;
    for (let j = -1; j <= 1; j++) {
      for (let i = -1; i <= 1; i++) {
        const arr = grid[(gx + i) + ',' + (gy + j)];
        if (!arr) continue;
        for (let k = 0; k < arr.length; k++) {
          const idx = arr[k];
          const d = Math.hypot(px[idx] - x, py[idx] - y);
          if (d < bestD) { bestD = d; best = idx; }
        }
      }
    }
    return best;
  }

  // --- walkers: blind, memoryless, respawn on the outer ring when lost ---
  const NUM_WALKERS = 320;
  let wx, wy;

  // A walker far from the frontier can safely take a large step — it has
  // nothing nearby to tunnel through — so the spawn/kill ring scales with
  // the cluster and step size scales with distance from that ring. Fixed
  // tiny steps make a 2D random walk's expected hitting time enormous;
  // this is the standard fix real DLA implementations use to stay fast.
  function marginGap() {
    return Math.max(18, maxRadius * 0.18);
  }

  function spawnWalker(i) {
    const a = Math.random() * Math.PI * 2;
    const r = maxRadius + marginGap() * (0.9 + Math.random() * 0.5);
    wx[i] = cx + Math.cos(a) * r;
    wy[i] = cy + Math.sin(a) * r;
  }

  // --- transient click attractors (ground charges) ---
  let attractors = [];

  // --- sparks: a traveling glint tracing root-to-tip through the tree ---
  let sparks = [];

  function pickTipPath() {
    if (count < 6) return null;
    const start = count - 1 - ((Math.random() * Math.min(count, 260)) | 0);
    const path = [];
    let i = Math.max(0, start);
    let guard = 0;
    while (i >= 0 && guard++ < 4000) {
      path.push(i);
      if (pParent[i] < 0) break;
      i = pParent[i];
    }
    path.reverse();
    return path.length > 2 ? path : null;
  }

  function spawnSpark() {
    const path = pickTipPath();
    if (!path) return;
    sparks.push({ path, t: 0, speed: 0.7 + Math.random() * 0.9 });
  }

  // --- state machine: growing -> flash -> fading -> reset ---
  let mode = 'growing';
  let modeT = 0;
  let elapsed = 0;

  function reset() {
    px = new Float64Array(MAX_POINTS);
    py = new Float64Array(MAX_POINTS);
    pGen = new Int32Array(MAX_POINTS);
    pParent = new Int32Array(MAX_POINTS);
    count = 0;
    grid = {};
    maxRadius = 0;
    stickRadius = Math.max(2, Math.min(W, H) / 300);
    cellSize = stickRadius * 2.2;
    baseHue = Math.random() * 360;
    attractors = [];
    sparks = [];
    pending = new Array(HUE_BUCKETS);
    wx = new Float64Array(NUM_WALKERS);
    wy = new Float64Array(NUM_WALKERS);
    insertPoint(cx, cy, 0, -1);
    for (let i = 0; i < NUM_WALKERS; i++) spawnWalker(i);
    inkCtx.clearRect(0, 0, W, H);
    mode = 'growing';
    modeT = 0;
    elapsed = 0;
  }

  // --- input ---
  const pointer = { x: -9999, y: -9999, active: false };
  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  });
  window.addEventListener('pointerleave', () => (pointer.active = false));
  window.addEventListener('pointerdown', (e) => {
    attractors.push({ x: e.clientX, y: e.clientY, life: 1 });
  });
  window.addEventListener('resize', resize);

  const SUBSTEPS = 6;

  function growStep(dt) {
    const margin = marginGap();
    const maxStep = Math.max(margin * 1.3, stickRadius * 2);
    const killR = maxRadius + margin * 7;

    for (let i = 0; i < NUM_WALKERS; i++) {
      let x = wx[i], y = wy[i];
      let stuck = -1;

      for (let s = 0; s < SUBSTEPS; s++) {
        const distFromCenter = Math.hypot(x - cx, y - cy);
        const gap = Math.max(0, distFromCenter - maxRadius);
        const step = Math.min(maxStep, Math.max(stickRadius * 0.9, gap * 0.5));
        const ang = Math.random() * Math.PI * 2;
        x += Math.cos(ang) * step;
        y += Math.sin(ang) * step;

        if (pointer.active) {
          const dx = pointer.x - x, dy = pointer.y - y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 320) {
            const f = (1 - d / 320) * step * 0.5;
            x += (dx / d) * f;
            y += (dy / d) * f;
          }
        }
        for (let a = 0; a < attractors.length; a++) {
          const at = attractors[a];
          const dx = at.x - x, dy = at.y - y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < 420) {
            const f = (1 - d / 420) * step * 1.8 * at.life;
            x += (dx / d) * f;
            y += (dy / d) * f;
          }
        }

        const hit = findStick(x, y);
        if (hit >= 0 && count < MAX_POINTS) { stuck = hit; break; }
        if (Math.hypot(x - cx, y - cy) > killR) {
          const a = Math.random() * Math.PI * 2;
          const r = maxRadius + margin * (0.9 + Math.random() * 0.5);
          x = cx + Math.cos(a) * r;
          y = cy + Math.sin(a) * r;
        }
      }

      if (stuck >= 0) {
        const idx = insertPoint(x, y, pGen[stuck] + 1, stuck);
        queueSegment(stuck, idx);
        spawnWalker(i);
        if (Math.random() < 0.03) spawnSpark();
      } else {
        wx[i] = x; wy[i] = y;
      }
    }

    for (let a = attractors.length - 1; a >= 0; a--) {
      attractors[a].life -= dt * 0.25;
      if (attractors[a].life <= 0) attractors.splice(a, 1);
    }
  }

  // Hundreds of sticks can land in a single frame; one stroke() call per
  // segment (each with its own color) is a canvas anti-pattern that tanks
  // frame time long before the walker loop does. Bucket by quantized hue
  // and issue one path/stroke per bucket per frame instead.
  const HUE_BUCKETS = 24;
  let pending = null;

  function queueSegment(fromIdx, toIdx) {
    const hue = baseHue + pGen[toIdx] * 0.55 + Math.sin(toIdx * 12.9898) * 6;
    const bucket = ((Math.round(hue / (360 / HUE_BUCKETS)) % HUE_BUCKETS) + HUE_BUCKETS) % HUE_BUCKETS;
    (pending[bucket] || (pending[bucket] = [])).push(px[fromIdx], py[fromIdx], px[toIdx], py[toIdx]);
  }

  function flushSegments() {
    inkCtx.lineWidth = Math.max(0.6, stickRadius * 0.7);
    inkCtx.lineCap = 'round';
    for (let b = 0; b < HUE_BUCKETS; b++) {
      const arr = pending[b];
      if (!arr || !arr.length) continue;
      inkCtx.strokeStyle = hsl(b * (360 / HUE_BUCKETS), 0.85, 0.62);
      inkCtx.beginPath();
      for (let k = 0; k < arr.length; k += 4) {
        inkCtx.moveTo(arr[k], arr[k + 1]);
        inkCtx.lineTo(arr[k + 2], arr[k + 3]);
      }
      inkCtx.stroke();
      arr.length = 0;
    }
  }

  function updateSparks(dt) {
    for (let s = sparks.length - 1; s >= 0; s--) {
      const sp = sparks[s];
      sp.t += dt * sp.speed;
      if (sp.t >= 1) { sparks.splice(s, 1); continue; }
      const n = sp.path.length;
      const pos = sp.t * (n - 1);
      const i0 = pos | 0, i1 = Math.min(n - 1, i0 + 1);
      const f = pos - i0;
      const p0 = sp.path[i0], p1 = sp.path[i1];
      sp.x = px[p0] + (px[p1] - px[p0]) * f;
      sp.y = py[p0] + (py[p1] - py[p0]) * f;
    }
  }

  function drawSparks() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const sp of sparks) {
      if (sp.x === undefined) continue;
      const fade = Math.sin(sp.t * Math.PI);
      const g = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, 14);
      g.addColorStop(0, `rgba(255,255,255,${0.85 * fade})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(sp.x - 14, sp.y - 14, 28, 28);
    }
    ctx.restore();
  }

  function targetRadius() { return Math.min(W, H) * 0.42; }
  const MAX_GROW_TIME = 42;

  function render() {
    ctx.fillStyle = '#05060b';
    ctx.fillRect(0, 0, W, H);

    ctx.drawImage(ink, 0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    const pad = Math.max(W, H) * 0.01;
    ctx.drawImage(ink, -pad, -pad, W + pad * 2, H + pad * 2);
    ctx.restore();

    drawSparks();

    if (mode === 'flash') {
      const k = Math.min(1, modeT / 0.22);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,255,255,${0.85 * k})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    } else if (mode === 'fading') {
      const k = Math.min(1, modeT / 1.5);
      ctx.fillStyle = `rgba(5,6,11,${k})`;
      ctx.fillRect(0, 0, W, H);
    }

    const vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.2, cx, cy, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function simulate(dt) {
    elapsed += dt;
    if (mode === 'growing') {
      growStep(dt);
      flushSegments();
      updateSparks(dt);
      if (maxRadius > targetRadius() || elapsed > MAX_GROW_TIME || count >= MAX_POINTS - 40) {
        mode = 'flash';
        modeT = 0;
      }
    } else if (mode === 'flash') {
      modeT += dt;
      if (modeT > 0.22) { mode = 'fading'; modeT = 0; }
    } else if (mode === 'fading') {
      modeT += dt;
      if (modeT > 1.5) reset();
    }
  }

  const caption = document.getElementById('caption');
  setTimeout(() => caption.classList.add('visible'), 1500);
  setTimeout(() => caption.classList.remove('visible'), 9000);

  let last = null;
  function frame(now) {
    if (last === null) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 20) dt = 1 / 20;
    if (dt <= 0) dt = 1 / 60;

    simulate(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
