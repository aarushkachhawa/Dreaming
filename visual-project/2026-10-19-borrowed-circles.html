<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowed Circles</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07080c; height:100%; width:100%; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #hud { position:fixed; top:14px; left:16px; color:#e8e4da; font-family:'Courier New', monospace;
    font-size:12.5px; line-height:1.55; text-shadow:0 0 6px rgba(140,200,255,0.35); pointer-events:none; user-select:none; }
  #hint { position:fixed; bottom:14px; left:16px; color:#5e6068; font-family:'Courier New', monospace;
    font-size:11.5px; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="hint">drag &mdash; draw a closed shape for the circles to borrow&nbsp;&nbsp;|&nbsp;&nbsp;click &mdash; a new random shape&nbsp;&nbsp;|&nbsp;&nbsp;space &mdash; pause</div>
<script>
(function(){
"use strict";
// Epicycles. Any closed curve, read as a complex function of time, is a sum of rotating
// circles (a discrete Fourier transform). A chain of circles, each riding the rim of the
// last, redraws the shape with a single pen. The number of circles in use swells and
// shrinks: with few, the shape is a soft ghost of itself; with many, it sharpens.
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
let W=0,H=0,S=0,paused=false,coef=[],N=0,t=0,hue=200,trail=[],drawing=false,mouse=[],useN=1,tick=0;
const TRAIL=900;
function setup(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=canvas.width=innerWidth*dpr; H=canvas.height=innerHeight*dpr; S=Math.min(W,H);
  if (!coef.length) randomShape();
}
// pts: array of [x,y] in [-1,1]; resample to M points and take the DFT
function load(pts){
  const M=256, res=[];
  let len=[0];
  for (let i=1;i<=pts.length;i++){ const a=pts[i-1], b=pts[i%pts.length]; len.push(len[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1])); }
  const total=len[len.length-1]; if (total<1e-6) return;
  let j=0;
  for (let k=0;k<M;k++){
    const s=total*k/M;
    while (len[j+1]<s) j++;
    const a=pts[j], b=pts[(j+1)%pts.length], f=(s-len[j])/Math.max(1e-9,len[j+1]-len[j]);
    res.push([a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f]);
  }
  N=M; coef=[];
  for (let k=0;k<M;k++){
    const freq=k<M/2?k:k-M; let re=0,im=0;
    for (let n=0;n<M;n++){
      const ang=-2*Math.PI*freq*n/M, c=Math.cos(ang), s2=Math.sin(ang);
      re+=res[n][0]*c-res[n][1]*s2; im+=res[n][0]*s2+res[n][1]*c;
    }
    re/=M; im/=M;
    coef.push({freq:freq,re:re,im:im,amp:Math.hypot(re,im),ph:Math.atan2(im,re)});
  }
  coef.sort((a,b)=>b.amp-a.amp);
  t=0; trail=[]; hue=Math.random()*360;
}
function randomShape(){
  // a wobbly closed loop: a few random harmonics, or a star, or a trefoil-ish knot
  const pts=[], kind=(Math.random()*3)|0, ph=[Math.random()*6,Math.random()*6,Math.random()*6];
  const n=5+((Math.random()*4)|0);
  for (let i=0;i<400;i++){
    const a=i/400*2*Math.PI; let r;
    if (kind===0) r=0.55+0.25*Math.cos(n*a+ph[0])+0.1*Math.cos((n+2)*a+ph[1]);
    else if (kind===1) r=(i%100<50? 0.8:0.35)+0.0*a;
    else r=0.5+0.3*Math.cos(2*a+ph[0])*Math.sin(3*a+ph[1])+0.12*Math.cos(7*a+ph[2]);
    if (kind===1){ const k=(a*n/(2*Math.PI)); const f=Math.abs((k%1)-0.5)*2; r=0.35+0.45*f; }
    pts.push([r*Math.cos(a), r*Math.sin(a)]);
  }
  load(pts);
}
function evaluate(m,time){
  // returns the chain of circle centres and the pen position
  let x=0,y=0; const chain=[[x,y]];
  for (let i=0;i<m;i++){
    const c=coef[i], a=c.freq*time+c.ph;
    x+=c.amp*Math.cos(a); y+=c.amp*Math.sin(a);
    chain.push([x,y]);
  }
  return chain;
}
function frame(){
  if (!paused && coef.length && !drawing){
    tick++;
    // the circle count breathes between a handful and nearly all
    useN=Math.max(2,Math.round(2+(N*0.28)*(0.5-0.5*Math.cos(tick/420))+4*Math.sin(tick/97)));
    const dt=2*Math.PI/900;
    for (let s=0;s<3;s++){
      t+=dt/3;
      const ch=evaluate(useN,t), p=ch[ch.length-1];
      trail.push(p);
    }
    while (trail.length>TRAIL) trail.shift();
  }
  ctx.fillStyle='#07080c'; ctx.fillRect(0,0,W,H);
  const cx=W/2, cy=H/2, sc=S*0.4;
  if (drawing && mouse.length>1){
    ctx.strokeStyle='rgba(232,228,218,0.8)'; ctx.lineWidth=Math.max(1.5,S/400);
    ctx.beginPath(); mouse.forEach((p,i)=>{ const x=cx+p[0]*sc, y=cy+p[1]*sc; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  } else if (coef.length){
    const ch=evaluate(useN,t);
    // circles: faint rims, a bright line along the arms
    for (let i=0;i<useN;i++){
      const r=coef[i].amp*sc; if (r<0.6) continue;
      ctx.strokeStyle='hsla('+((hue+i*4)%360)+',60%,60%,'+Math.max(0.05,0.28-i*0.01)+')';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx+ch[i][0]*sc, cy+ch[i][1]*sc, r, 0, 2*Math.PI); ctx.stroke();
    }
    ctx.strokeStyle='rgba(232,228,218,0.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ch.forEach((p,i)=>{ const x=cx+p[0]*sc, y=cy+p[1]*sc; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    // the pen's trail, fading toward its tail
    ctx.lineCap='round'; ctx.lineWidth=Math.max(1.5,S/330);
    for (let i=1;i<trail.length;i++){
      const f=i/trail.length;
      ctx.strokeStyle='hsla('+((hue+f*80)%360)+',85%,'+(40+30*f)+'%,'+(f*f).toFixed(3)+')';
      ctx.beginPath(); ctx.moveTo(cx+trail[i-1][0]*sc, cy+trail[i-1][1]*sc); ctx.lineTo(cx+trail[i][0]*sc, cy+trail[i][1]*sc); ctx.stroke();
    }
    const p=ch[ch.length-1];
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+p[0]*sc, cy+p[1]*sc, Math.max(2.5,S/260), 0, 2*Math.PI); ctx.fill();
  }
  hud.innerHTML='borrowed circles<br>circles in use '+useN+' / '+N+'<br>'+(drawing?'drawing…':'turn '+(t/(2*Math.PI)).toFixed(1));
  requestAnimationFrame(frame);
}
function unit(e){ const k=S*0.4/(W/innerWidth); return [(e.clientX-innerWidth/2)/k,(e.clientY-innerHeight/2)/k]; }
canvas.addEventListener('mousedown',e=>{ drawing=true; mouse=[unit(e)]; });
addEventListener('mousemove',e=>{ if (drawing) mouse.push(unit(e)); });
addEventListener('mouseup',e=>{
  if (!drawing) return; drawing=false;
  if (mouse.length>12) load(mouse); else randomShape();
  mouse=[];
});
addEventListener('resize',setup);
addEventListener('keydown',e=>{ if (e.code==='Space'){ paused=!paused; e.preventDefault(); } });
setup(); frame();
})();
</script>
</body>
</html>
